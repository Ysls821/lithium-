/* ============================================================
   液态玻璃引擎 —— 逐行移植自 sanctuary 的 GlassRenderer + 编辑页参数。
   真 WebGL：圆角矩形 SDF 算出玻璃斜面法线，对壁纸做折射采样，
   加菲涅尔边缘光、四盏高光、色差。背景是静态壁纸，所以只在
   滚动 / 重渲染时重画，不跑每帧循环。WebGL 不可用就退回 CSS 玻璃。
   ============================================================ */
const LG_VS_QUAD=`attribute vec2 a_pos;varying vec2 v_uv;
void main(){v_uv=a_pos*0.5+0.5;gl_Position=vec4(a_pos,0.0,1.0);}`;
const LG_FS_BLIT=`precision mediump float;uniform sampler2D u_tex;varying vec2 v_uv;
void main(){gl_FragColor=texture2D(u_tex,v_uv);}`;
const LG_FS_BLUR=`precision mediump float;uniform sampler2D u_tex;uniform vec2 u_dir;varying vec2 v_uv;
void main(){vec4 s=texture2D(u_tex,v_uv)*0.227027;
s+=texture2D(u_tex,v_uv+u_dir*1.0)*0.194594;s+=texture2D(u_tex,v_uv-u_dir*1.0)*0.194594;
s+=texture2D(u_tex,v_uv+u_dir*2.0)*0.121622;s+=texture2D(u_tex,v_uv-u_dir*2.0)*0.121622;
s+=texture2D(u_tex,v_uv+u_dir*3.0)*0.054054;s+=texture2D(u_tex,v_uv-u_dir*3.0)*0.054054;
s+=texture2D(u_tex,v_uv+u_dir*4.0)*0.016216;s+=texture2D(u_tex,v_uv-u_dir*4.0)*0.016216;
gl_FragColor=s;}`;
const LG_VS_GLASS=`attribute vec2 a_pos;uniform vec2 u_center;uniform vec2 u_size;uniform vec2 u_res;
varying vec2 v_localPx;varying vec2 v_screenUV;
void main(){v_localPx=a_pos*u_size;vec2 px=u_center+a_pos*u_size;
v_screenUV=vec2(px.x/u_res.x,1.0-px.y/u_res.y);
vec2 ndc=(px/u_res)*2.0-1.0;ndc.y=-ndc.y;gl_Position=vec4(ndc,0.0,1.0);}`;
const LG_FS_GLASS=`precision highp float;
uniform sampler2D u_bgTex;uniform sampler2D u_blurTex;
uniform vec2 u_size;uniform float u_radius;uniform vec2 u_res;
uniform float u_refract;uniform float u_chroma;uniform float u_edgeHL;uniform float u_spec;
uniform float u_fresnel;uniform float u_alpha;uniform float u_sat;uniform float u_tint;
uniform float u_zRadius;uniform float u_brightness;
varying vec2 v_localPx;varying vec2 v_screenUV;
float rrSDF(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+vec2(r);
return min(max(q.x,q.y),0.0)+length(max(q,vec2(0.0)))-r;}
float bevelHeight(float d,float zR){if(d<=0.0)return 0.0;if(d>=zR)return zR;
return sqrt(d*(2.0*zR-d));}
void main(){
vec2 half_=u_size*0.5;
float r=min(u_radius,min(half_.x,half_.y));
float sdf=rrSDF(v_localPx,half_,r);
if(sdf>0.0){gl_FragColor=vec4(0.0);return;}
float mask=1.0-smoothstep(-1.5,0.5,sdf);
float maxD=min(half_.x,half_.y);
float inside=-sdf;
float edge=smoothstep(maxD*0.35,0.0,inside);
float zR=u_zRadius;float e=2.0;
float dC=inside;
float dR=-rrSDF(v_localPx+vec2(e,0.0),half_,r);
float dL=-rrSDF(v_localPx-vec2(e,0.0),half_,r);
float dU=-rrSDF(v_localPx+vec2(0.0,e),half_,r);
float dD=-rrSDF(v_localPx-vec2(0.0,e),half_,r);
float hC=bevelHeight(dC,zR);float hR=bevelHeight(dR,zR);float hL=bevelHeight(dL,zR);
float hU=bevelHeight(dU,zR);float hD=bevelHeight(dD,zR);
vec2 hGrad=vec2(hR-hL,hU-hD)/(2.0*e);
vec3 N=normalize(vec3(-hGrad,1.0));
float depth=smoothstep(0.0,zR,inside);
vec2 pxToUV=vec2(1.0,-1.0)/u_res;
float ior=1.5;float refrPow=1.0-1.0/ior;
float thickness=hC*2.0;float thickNorm=thickness/max(zR*2.0,1.0);
vec2 exitRefr=hGrad*refrPow;vec2 entryRefr=hGrad*refrPow;
vec2 throughRefr=entryRefr*thickNorm*0.5;
vec2 refrPx=(exitRefr+entryRefr+throughRefr)*u_refract*30.0;
vec2 centerDir=-v_localPx/max(half_,vec2(1.0));
refrPx+=centerDir*u_refract*4.0*depth;
vec2 refr=refrPx*pxToUV;
float caS=u_chroma*18.0*(edge*0.7+0.3)*2.0;
vec2 caD=N.xy*caS*pxToUV;
vec2 base=v_screenUV+refr;
vec3 sharp=vec3(texture2D(u_bgTex,base+caD).r,texture2D(u_bgTex,base).g,texture2D(u_bgTex,base-caD).b);
vec3 blur=vec3(texture2D(u_blurTex,base+caD).r,texture2D(u_blurTex,base).g,texture2D(u_blurTex,base-caD).b);
float edgeMix=(1.0-edge*0.15);
vec3 col=mix(sharp,blur,edgeMix);
col*=1.0+u_brightness;
float lum=dot(col,vec3(0.299,0.587,0.114));
col=mix(vec3(lum),col,1.0+u_sat);
col=mix(col,col*vec3(0.92,0.95,1.05),u_tint);
col*=1.0+0.06*depth;
float fres=pow(1.0-abs(N.z),4.0)*u_fresnel;
vec3 V=vec3(0.0,0.0,1.0);
vec3 L1=normalize(vec3(0.4,0.7,1.0));vec3 H1=normalize(L1+V);
float sp1=pow(max(dot(N,H1),0.0),90.0);
vec3 L2=normalize(vec3(-0.3,-0.5,1.0));vec3 H2=normalize(L2+V);
float sp2=pow(max(dot(N,H2),0.0),50.0)*0.3;
vec3 L3=normalize(vec3(0.1,0.3,1.0));
float spB=pow(max(dot(N,L3),0.0),6.0)*0.1;
vec3 L4=normalize(vec3(0.0,0.9,0.4));vec3 H4=normalize(L4+V);
float sp4=pow(max(dot(N,H4),0.0),120.0)*0.6;
float totalSpec=(sp1+sp2+spB+sp4)*u_spec;
float borderWidth=1.5;
float innerStroke=smoothstep(-borderWidth-1.0,-borderWidth,sdf)*(1.0-smoothstep(-1.0,0.0,sdf));
float topBias=0.5+0.5*(-v_localPx.y/half_.y);
innerStroke*=(0.4+0.6*topBias);
float rim=edge*u_edgeHL*0.22;
float innerGlow=smoothstep(5.0,0.0,-sdf)*u_edgeHL*0.15;
float envRefl=(N.y*0.5+0.5)*fres*0.08;
vec3 fin=col;
fin+=vec3(totalSpec);
fin+=vec3(rim+innerGlow);
fin+=vec3(innerStroke*u_edgeHL*0.55);
fin+=vec3(envRefl);
fin=mix(fin,vec3(1.0),fres*0.2);
gl_FragColor=vec4(fin,mask*u_alpha);}`;

/* 编辑页同款参数（BubbleDetailModal / OutputView） */
const LG_CFG={blurAmount:.3,refraction:.5,chroma:.05,edgeHL:.1,spec:.12,
  fresnel:.9,alpha:1,sat:0,tint:.2,zRadius:30,brightness:-.1};

class LGGlass{
  constructor(){
    this.canvas=document.createElement('canvas');
    const gl=this.canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false,preserveDrawingBuffer:true});
    if(!gl) throw new Error('no webgl');
    this.gl=gl;
    this.blitP=this._link(LG_VS_QUAD,LG_FS_BLIT);
    this.blurP=this._link(LG_VS_QUAD,LG_FS_BLUR);
    this.glassP=this._link(LG_VS_GLASS,LG_FS_GLASS);
    // 注意：不能拿 WebGLProgram 当对象 key（会全部串成同一个字符串），按名字分开存
    const loc=(p,names)=>{const m={};for(const n of names)m[n]=gl.getUniformLocation(p,n);return m;};
    this.uBlit=loc(this.blitP,['u_tex']);
    this.uBlur=loc(this.blurP,['u_tex','u_dir']);
    this.uGlass=loc(this.glassP,['u_bgTex','u_blurTex','u_center','u_size','u_radius','u_res','u_refract',
       'u_chroma','u_edgeHL','u_spec','u_fresnel','u_alpha','u_sat','u_tint','u_zRadius','u_brightness']);
    this.quad=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,this.quad);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    this.panel=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,this.panel);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-.5,-.5,.5,-.5,-.5,.5,.5,.5]),gl.STATIC_DRAW);
    this.bgTex=null; this.f={};
  }
  _compile(src,type){const gl=this.gl,sh=gl.createShader(type);
    gl.shaderSource(sh,src);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;}
  _link(vs,fs){const gl=this.gl,p=gl.createProgram();
    gl.attachShader(p,this._compile(vs,gl.VERTEX_SHADER));
    gl.attachShader(p,this._compile(fs,gl.FRAGMENT_SHADER));
    gl.linkProgram(p);return p;}
  _fbo(key,w,h){
    const gl=this.gl,old=this.f[key];
    if(old&&old.w===w&&old.h===h) return old;
    if(old){gl.deleteFramebuffer(old.fbo);gl.deleteTexture(old.tex);}
    const tex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const fbo=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    return this.f[key]={fbo,tex,w,h};
  }
  _draw(prog,buf){const gl=this.gl,loc=gl.getAttribLocation(prog,'a_pos');
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}
  render(src,w,h,radius){
    const gl=this.gl,W=src.width,H=src.height;
    if(W<=0||H<=0) return;
    if(this.canvas.width<W||this.canvas.height<H){
      this.canvas.width=Math.max(this.canvas.width,W);
      this.canvas.height=Math.max(this.canvas.height,H);
    }
    const bg=this._fbo('bg',W,H),A=this._fbo('a',W,H),B=this._fbo('b',W,H);
    if(!this.bgTex) this.bgTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,this.bgTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    // 底图 → bgFBO
    gl.bindFramebuffer(gl.FRAMEBUFFER,bg.fbo);
    gl.viewport(0,0,W,H);
    gl.useProgram(this.blitP);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D,this.bgTex);
    gl.uniform1i(this.uBlit.u_tex,0);
    this._draw(this.blitP,this.quad);
    // → blurA
    gl.bindFramebuffer(gl.FRAMEBUFFER,A.fbo);
    gl.bindTexture(gl.TEXTURE_2D,bg.tex);
    this._draw(this.blitP,this.quad);
    // 多轮高斯
    const spread=LG_CFG.blurAmount*2.5;
    gl.useProgram(this.blurP);
    gl.uniform1i(this.uBlur.u_tex,0);
    for(let i=0;i<6;i++){
      gl.bindFramebuffer(gl.FRAMEBUFFER,B.fbo);
      gl.bindTexture(gl.TEXTURE_2D,A.tex);
      gl.uniform2f(this.uBlur.u_dir,spread/W,0);
      this._draw(this.blurP,this.quad);
      gl.bindFramebuffer(gl.FRAMEBUFFER,A.fbo);
      gl.bindTexture(gl.TEXTURE_2D,B.tex);
      gl.uniform2f(this.uBlur.u_dir,0,spread/H);
      this._draw(this.blurP,this.quad);
    }
    // 玻璃
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,this.canvas.height-H,W,H);
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(0,this.canvas.height-H,W,H);
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.SCISSOR_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(this.glassP);
    const U=this.uGlass;
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,bg.tex);gl.uniform1i(U.u_bgTex,0);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,A.tex);gl.uniform1i(U.u_blurTex,1);
    gl.uniform2f(U.u_res,W,H);
    gl.uniform2f(U.u_center,W*0.5,H*0.5);
    gl.uniform2f(U.u_size,w,h);
    gl.uniform1f(U.u_radius,radius);
    gl.uniform1f(U.u_refract,LG_CFG.refraction);
    gl.uniform1f(U.u_chroma,LG_CFG.chroma);
    gl.uniform1f(U.u_edgeHL,LG_CFG.edgeHL);
    gl.uniform1f(U.u_spec,LG_CFG.spec);
    gl.uniform1f(U.u_fresnel,LG_CFG.fresnel);
    gl.uniform1f(U.u_alpha,LG_CFG.alpha);
    gl.uniform1f(U.u_sat,LG_CFG.sat);
    gl.uniform1f(U.u_tint,LG_CFG.tint);
    gl.uniform1f(U.u_zRadius,LG_CFG.zRadius*(w>120?1:.45));
    gl.uniform1f(U.u_brightness,LG_CFG.brightness);
    this._draw(this.glassP,this.panel);
    gl.disable(gl.BLEND);
  }
}

/* ---------- 引擎调度 ---------- */
let lgR=null,lgDead=false,lgImg=null,lgImgSrc='',lgBgCv=null,lgBgSig='',lgSet=new Set(),lgRafId=0,lgObs=null;
function lgGet(){
  if(lgDead) return null;
  if(!lgR){ try{ lgR=new LGGlass(); }catch(e){ lgDead=true; return null; } }
  return lgR;
}
/* 把壁纸按 cover 画进和机身同尺寸的 canvas，当折射源 */
function lgEnsureBg(){
  if(!S.homeBg) return null;
  if(lgImgSrc!==S.homeBg){
    lgImgSrc=S.homeBg; lgImg=new Image();
    lgImg.onload=()=>{ lgBgSig=''; lgRepaint(); };
    lgImg.src=S.homeBg;
  }
  if(!lgImg||!lgImg.naturalWidth) return null;
  const ph=document.getElementById('phone').getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  const W=Math.round(ph.width*dpr),H=Math.round(ph.height*dpr);
  const sig=S.homeBg.length+'|'+W+'x'+H;
  if(lgBgCv&&lgBgSig===sig) return lgBgCv;
  lgBgCv=lgBgCv||document.createElement('canvas');
  lgBgCv.width=W; lgBgCv.height=H;
  const cx=lgBgCv.getContext('2d');
  const iw=lgImg.naturalWidth,ih=lgImg.naturalHeight;
  const sc=Math.max(W/iw,H/ih);
  cx.drawImage(lgImg,(W-iw*sc)/2,(H-ih*sc)/2,iw*sc,ih*sc);
  lgBgSig=sig;
  return lgBgCv;
}
function lgTeardown(){
  for(const el of lgSet){
    el.classList.remove('lgon');
    const cv=el.querySelector(':scope>.lgcv'); if(cv) cv.remove();
  }
  lgSet.clear();
}
function lgSync(){
  const phone=document.getElementById('phone');
  if(!phone.classList.contains('himm')||!lgGet()){ lgTeardown(); return; }
  const scr=document.querySelector('.screen.active');
  if(!scr||!HOME_TABS.includes(scr.id)){ return; }
  const mode=S.glassMode||'mix';
  let want;
  if(mode==='frost') want=new Set();                    // 全 CSS 毛玻璃
  else if(mode==='liquid')                              // 全 WebGL
    want=new Set([...scr.querySelectorAll('.group,.listcard,.pcard'),document.getElementById('tabbar')]);
  else                                                  // 混合：惊艳只留给底栏
    want=new Set([document.getElementById('tabbar')]);
  for(const el of [...lgSet]) if(!want.has(el)||!el.isConnected){
    el.classList.remove('lgon');
    const cv=el.querySelector(':scope>.lgcv'); if(cv) cv.remove();
    lgSet.delete(el);
  }
  for(const el of want){
    if(!el) continue;
    if(!el.querySelector(':scope>.lgcv')){
      const cv=document.createElement('canvas');
      cv.className='lgcv';
      el.insertBefore(cv,el.firstChild);
      el.classList.add('lgon');
    }
    lgSet.add(el);
  }
  lgRepaint();
}
function lgRepaint(){
  if(lgRafId) return;
  lgRafId=requestAnimationFrame(()=>{ lgRafId=0; lgPaintNow(); });
}
function lgPaintNow(){
  const R=lgGet(); if(!R) return;
  const bg=lgEnsureBg(); if(!bg) return;
  const ph=document.getElementById('phone').getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  for(const el of lgSet){
    if(!el.isConnected) continue;
    const cv=el.querySelector(':scope>.lgcv'); if(!cv) continue;
    const r=el.getBoundingClientRect();
    if(r.width<8||r.height<8) continue;
    // 完全在可视区外的不画
    if(r.bottom<ph.top-40||r.top>ph.bottom+40) continue;
    const W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);
    // 从壁纸里裁出面板正下方那块
    const sx=Math.round((r.left-ph.left)*dpr),sy=Math.round((r.top-ph.top)*dpr);
    const crop=lgPaintNow._crop||(lgPaintNow._crop=document.createElement('canvas'));
    crop.width=W; crop.height=H;
    const ccx=crop.getContext('2d');
    ccx.clearRect(0,0,W,H);
    // 源矩形越界时 Chrome 会整块不画，先和壁纸范围求交
    const cx0=Math.max(0,sx), cy0=Math.max(0,sy);
    const cx1=Math.min(bg.width,sx+W), cy1=Math.min(bg.height,sy+H);
    if(cx1>cx0&&cy1>cy0)
      ccx.drawImage(bg,cx0,cy0,cx1-cx0,cy1-cy0,cx0-sx,cy0-sy,cx1-cx0,cy1-cy0);
    const rad=(parseFloat(getComputedStyle(el).borderTopLeftRadius)||0)*dpr;
    R.render(crop,W,H,rad);
    if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
    const ox=cv.getContext('2d');
    ox.clearRect(0,0,W,H);
    // viewport 的 y 是 GL 坐标（从底往上数），落在图像坐标里是顶部——从 (0,0) 拷
    ox.drawImage(R.canvas,0,0,W,H,0,0,W,H);
  }
}
function lgInit(){
  if(lgObs) return;
  lgObs=new MutationObserver(muts=>{
    // 自己插 canvas 触发的变更不用管
    if(muts.every(m=>[...m.addedNodes,...m.removedNodes].every(n=>n.nodeType===1&&n.classList&&n.classList.contains('lgcv')))) return;
    clearTimeout(lgInit._t);
    lgInit._t=setTimeout(lgSync,50);
  });
  lgObs.observe(document.getElementById('screens'),{childList:true,subtree:true});
  document.addEventListener('scroll',e=>{
    if(document.getElementById('phone').classList.contains('himm')) lgRepaint();
  },true);
  window.addEventListener('resize',()=>{ lgBgSig=''; lgRepaint(); });
}


/* ============================================================
   天气层 —— 雨/雪 shader 原样移植自 sanctuary WeatherBackground。
   热控三件套：30fps 节流、0.6x 分辨率渲染、不在沉浸页就整个停掉。
   ============================================================ */
const WX_VERT=`attribute vec2 a_position;void main(){gl_Position=vec4(a_position,0.0,1.0);}`;
const WX_COVER=`vec2 coverUV(vec2 uv,float screenAspect,float imgAspect){vec2 s=uv;
if(screenAspect>imgAspect){float sc=screenAspect/imgAspect;s.y=(s.y-0.5)/sc+0.5;}
else{float sc=imgAspect/screenAspect;s.x=(s.x-0.5)/sc+0.5;}return s;}`;
const WX_RAIN=`precision highp float;
uniform vec2 u_resolution;uniform float u_time;uniform sampler2D u_background;
uniform float u_rainAmount;uniform float u_fog;uniform float u_refraction;
uniform int u_hasBg;uniform float u_bgAspect;
`+WX_COVER+`
#define S(a,b,t) smoothstep(a,b,t)
vec3 N13(float p){vec3 p3=fract(vec3(p)*vec3(0.1031,0.11369,0.13787));
p3+=dot(p3,p3.yzx+19.19);
return fract(vec3((p3.x+p3.y)*p3.z,(p3.x+p3.z)*p3.y,(p3.y+p3.z)*p3.x));}
float N(float t){return fract(sin(t*12345.564)*7658.76);}
float Saw(float b,float t){return S(0.0,b,t)*S(1.0,b,t);}
vec2 DropLayer2(vec2 uv,float t){
vec2 UV=uv;uv.y+=t*0.75;
vec2 a=vec2(6.0,1.0);vec2 grid=a*2.0;vec2 id=floor(uv*grid);
float colShift=N(id.x);uv.y+=colShift;
id=floor(uv*grid);
vec3 n=N13(id.x*35.2+id.y*2376.1);
vec2 st=fract(uv*grid)-vec2(0.5,0.0);
float x=n.x-0.5;
float y=UV.y*20.0;float wiggle=sin(y+sin(y));
x+=wiggle*(0.5-abs(x))*(n.z-0.5);x*=0.7;
float ti=fract(t+n.z);y=(Saw(0.85,ti)-0.5)*0.9+0.5;
vec2 p=vec2(x,y);float d=length((st-p)*a.yx);
float mainDrop=S(0.4,0.0,d);
float r=sqrt(S(1.0,y,st.y));float cd=abs(st.x-x);
float trail=S(0.23*r,0.15*r*r,cd);
float trailFront=S(-0.02,0.02,st.y-y);trail*=trailFront*r*r;
y=UV.y;float trail2=S(0.2*r,0.0,cd);
float droplets=max(0.0,(sin(y*(1.0-y)*120.0)-st.y)*trail2*trailFront*n.z);
y=fract(y*10.0)+(st.y-0.5);float dd=length(st-vec2(x,y));
droplets=S(0.3,0.0,dd);
float m=mainDrop+droplets*r*trailFront;
return vec2(m,trail);}
float StaticDrops(vec2 uv,float t){
uv*=40.0;vec2 id=floor(uv);uv=fract(uv)-0.5;
vec3 n=N13(id.x*107.45+id.y*3543.654);
vec2 p=(n.xy-0.5)*0.7;float d=length(uv-p);
float fade=Saw(0.025,fract(t+n.z));
return S(0.3,0.0,d)*fract(n.z*10.0)*fade;}
vec2 Drops(vec2 uv,float t,float l0,float l1,float l2){
float s=StaticDrops(uv,t)*l0;
vec2 m1=DropLayer2(uv,t)*l1;vec2 m2=DropLayer2(uv*1.85,t*1.25)*l2;
float c=s+m1.x+m2.x;c=S(0.3,1.0,c);
return vec2(c,max(m1.y*l1,m2.y*l2));}
vec3 defaultBackground(vec2 uv,float t){
float slow=t*0.05;
vec3 c1=vec3(0.03,0.07,0.05);vec3 c2=vec3(0.05,0.03,0.09);
float blend=uv.y+sin(uv.x*3.0+slow)*0.15;
blend=mix(blend,1.0-blend,sin(slow*0.7)*0.5+0.5);
return mix(c1,c2,clamp(blend,0.0,1.0));}
void main(){
vec2 uv=gl_FragCoord.xy/u_resolution.xy;vec2 UV=uv;
float T=u_time+120.0;float t=T*0.2;
float rainAmount=u_rainAmount;float refrStrength=u_refraction*0.06;
float staticDrops=S(-0.5,1.0,rainAmount)*2.0;
float layer1=S(0.25,0.75,rainAmount);float layer2=S(0.0,0.5,rainAmount);
float aspect=u_resolution.x/u_resolution.y;
vec2 dropUV=vec2(uv.x*aspect,uv.y);
vec2 c=Drops(dropUV,t,staticDrops,layer1,layer2);
vec2 e=vec2(0.002,0.0);
float cx=Drops(dropUV+e,t,staticDrops,layer1,layer2).x;
float cy=Drops(dropUV+e.yx,t,staticDrops,layer1,layer2).x;
vec2 n=vec2(cx-c.x,cy-c.x);
vec2 refrUV=UV+n*refrStrength;
vec3 col;
float screenAspect=u_resolution.x/u_resolution.y;
if(u_hasBg==1){vec2 bgUV=coverUV(vec2(refrUV.x,1.0-refrUV.y),screenAspect,u_bgAspect);col=texture2D(u_background,bgUV).rgb;}
else{col=defaultBackground(refrUV,T);}
float fogAmount=u_fog;
vec3 fogCol=(u_hasBg==1)?vec3(0.12):defaultBackground(vec2(0.5),T)*1.2;
col=mix(col,fogCol,fogAmount*0.55);
col+=c.x*vec3(0.08);col*=1.0-c.y*0.12;
gl_FragColor=vec4(col,1.0);}`;
const WX_SNOW=`precision highp float;
uniform vec2 u_resolution;uniform float u_time;uniform sampler2D u_background;
uniform float u_rainAmount;uniform float u_fog;uniform float u_refraction;
uniform int u_hasBg;uniform float u_bgAspect;
`+WX_COVER+`
#define LAYERS 50
#define DEPTH 0.5
#define WIDTH 0.3
#define SPEED 0.6
vec3 defaultBackground(vec2 uv,float t){
float slow=t*0.05;
vec3 c1=vec3(0.04,0.05,0.08);vec3 c2=vec3(0.06,0.06,0.12);
float blend=uv.y+sin(uv.x*3.0+slow)*0.15;
blend=mix(blend,1.0-blend,sin(slow*0.7)*0.5+0.5);
return mix(c1,c2,clamp(blend,0.0,1.0));}
void main(){
vec2 uv=gl_FragCoord.xy/u_resolution.xy;
float T=u_time;
vec3 col;
float screenAspect=u_resolution.x/u_resolution.y;
if(u_hasBg==1){vec2 bgUV=coverUV(vec2(uv.x,1.0-uv.y),screenAspect,u_bgAspect);col=texture2D(u_background,bgUV).rgb;}
else{col=defaultBackground(uv,T);}
float fogAmount=u_fog;
vec3 fogCol=(u_hasBg==1)?vec3(0.15):defaultBackground(vec2(0.5),T)*1.3;
col=mix(col,fogCol,fogAmount*0.5);
float intensity=u_rainAmount;
int layers=int(10.0+intensity*40.0);
float speed=SPEED*(0.5+intensity*0.5);
const mat3 p=mat3(13.323122,23.5112,21.71123,21.1212,28.7312,11.9312,21.8112,14.7212,61.3934);
vec2 snowUV=vec2(1.0,u_resolution.y/u_resolution.x)*uv;
vec3 acc=vec3(0.0);
float dof=5.0*sin(T*0.1);
for(int i=0;i<50;i++){
if(i>=layers)break;
float fi=float(i);
vec2 q=snowUV*(1.0+fi*DEPTH);
q+=vec2(q.y*(WIDTH*mod(fi*7.238917,1.0)-WIDTH*0.5),speed*T/(1.0+fi*DEPTH*0.03));
vec3 n=vec3(floor(q),31.189+fi);
vec3 m=floor(n)*0.00001+fract(n);
vec3 mp=(31415.9+m)/fract(p*m);
vec3 r=fract(mp);
vec2 s=abs(mod(q,1.0)-0.5+0.9*r.xy-0.45);
s+=0.01*abs(2.0*fract(10.0*q.yx)-1.0);
float d=0.6*max(s.x-s.y,s.x+s.y)+max(s.x,s.y)-0.01;
float edge=0.005+0.05*min(0.5*abs(fi-5.0-dof),1.0);
acc+=vec3(smoothstep(edge,-edge,d)*(r.x/(1.0+0.02*fi*DEPTH)));}
col+=acc*intensity*1.2;
gl_FragColor=vec4(col,1.0);}`;

const WX_FPS=30, WX_SCALE=.6;
let wxGl=null,wxProgs={},wxUnis={},wxTex=null,wxTexSrc='',wxRaf=0,wxLast=0,
    wxT0=performance.now(),wxDead=false,wxAspect=1;
const wxCfg=()=>({mode:'',i:.5,chat:false,...(S.weather||{})});
let wxImg=null,wxImgSrc='';
/* 现在该用哪张图当天气的底：四个 tab 用首页壁纸；聊天页（开了同步）用聊天背景 */
function wxSrcNow(){
  const ph=document.getElementById('phone');
  const g=wxCfg();
  if(!g.mode) return '';
  if(ph.classList.contains('himm')) return S.homeBg||'';
  if(g.chat&&ph.classList.contains('imm')
     &&document.getElementById('s-chat').classList.contains('active')){
    const c=curCharId?characters.find(x=>x.id===curCharId):null;
    return c?(chatCfg(c).chatBg||''):'';
  }
  return '';
}
function wxActive(){
  return !!wxSrcNow()&&!document.hidden;
}
function wxCompile(gl,frag){
  const mk=(t,src)=>{const sh=gl.createShader(t);gl.shaderSource(sh,src);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;};
  const p=gl.createProgram();
  gl.attachShader(p,mk(gl.VERTEX_SHADER,WX_VERT));
  gl.attachShader(p,mk(gl.FRAGMENT_SHADER,frag));
  gl.linkProgram(p);
  const u={};
  for(const n of ['u_resolution','u_time','u_background','u_rainAmount','u_fog','u_refraction','u_hasBg','u_bgAspect'])
    u[n]=gl.getUniformLocation(p,n);
  return {p,u};
}
function wxInitGl(){
  if(wxDead) return null;
  if(wxGl) return wxGl;
  try{
    const cv=document.getElementById('weatherCv');
    const gl=cv.getContext('webgl',{alpha:false,premultipliedAlpha:false});
    if(!gl) throw new Error('no webgl');
    wxProgs.rain=wxCompile(gl,WX_RAIN);
    wxProgs.snow=wxCompile(gl,WX_SNOW);
    const buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    wxGl=gl;
    return gl;
  }catch(e){ wxDead=true; return null; }
}
function wxUpTex(gl){
  const src=wxSrcNow();
  if(!src) return false;
  if(wxImgSrc!==src){
    wxImgSrc=src; wxImg=new Image();
    wxImg.src=src;
  }
  if(!wxImg||!wxImg.naturalWidth) return false;
  if(wxTexSrc===src&&wxTex) return true;
  if(!wxTex) wxTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,wxTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,wxImg);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  wxAspect=wxImg.naturalWidth/wxImg.naturalHeight;
  wxTexSrc=src;
  return true;
}
function wxFrame(){
  wxRaf=0;
  if(!wxActive()){ wxStop(); return; }
  const now=performance.now();
  if(now-wxLast<1000/WX_FPS){ wxRaf=requestAnimationFrame(wxFrame); return; }
  wxLast=now;
  const gl=wxInitGl(); if(!gl){ wxStop(); return; }
  const cv=gl.canvas;
  const ph=document.getElementById('phone').getBoundingClientRect();
  const W=Math.max(2,Math.round(ph.width*WX_SCALE*(devicePixelRatio||1))),
        H=Math.max(2,Math.round(ph.height*WX_SCALE*(devicePixelRatio||1)));
  if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  const g=wxCfg();
  const pr=wxProgs[g.mode==='snow'?'snow':'rain'];
  const hasBg=wxUpTex(gl)?1:0;
  if(!hasBg){ wxRaf=requestAnimationFrame(wxFrame); return; }   // 图还没解码好，等下一帧
  gl.viewport(0,0,W,H);
  gl.useProgram(pr.p);
  const loc=gl.getAttribLocation(pr.p,'a_position');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.activeTexture(gl.TEXTURE0);
  if(wxTex) gl.bindTexture(gl.TEXTURE_2D,wxTex);
  gl.uniform1i(pr.u.u_background,0);
  gl.uniform2f(pr.u.u_resolution,W,H);
  gl.uniform1f(pr.u.u_time,(performance.now()-wxT0)/1000);
  gl.uniform1f(pr.u.u_rainAmount,Math.max(.05,Math.min(1,g.i)));
  gl.uniform1f(pr.u.u_fog,g.mode==='snow'?.2:.25);
  gl.uniform1f(pr.u.u_refraction,.5);
  gl.uniform1i(pr.u.u_hasBg,hasBg);
  gl.uniform1f(pr.u.u_bgAspect,wxAspect);
  gl.drawArrays(gl.TRIANGLES,0,3);
  document.getElementById('phone').classList.add('wxlive');   // 真画出来了才让它接管背景
  wxRaf=requestAnimationFrame(wxFrame);
}
function wxStop(){
  if(wxRaf){ cancelAnimationFrame(wxRaf); wxRaf=0; }
  document.getElementById('phone').classList.remove('wxon','wxlive');
}
function wxSync(){
  const on=wxActive();
  document.getElementById('phone').classList.toggle('wxon',!!wxSrcNow());
  if(on){ if(!wxRaf) wxRaf=requestAnimationFrame(wxFrame); }
  else if(wxRaf){ cancelAnimationFrame(wxRaf); wxRaf=0;
    document.getElementById('phone').classList.remove('wxlive'); }
  if(!on) document.getElementById('phone').classList.remove('wxlive');
}
document.addEventListener('visibilitychange',()=>wxSync());

function phoneApp(k){
  const c=characters.find(x=>x.id===curCharId);
  if(k==='shop'&&!((c.phone||{}).shop)){ openApp('shop'); return refreshShop(); }
  if(k==='mood')   return openMood();
  if(k==='diary')  return openDiary();
  if(k==='lithium')return openLi();
  if(k==='chats')  return openPhChats();
  if(k==='wallet') return toast('钱包还没做');
  if(k==='gallery'||k==='photos'){
    const pics=[
      ...(c.photos||[]).map(p=>({src:p.src,t:(p.caption||(p.from==='moment'?'朋友圈配图':'发给你的照片'))+'　'+fmtTime(p.at||0)})),
      ...((c.li&&c.li.posts)||[]).filter(p=>p.img).map(p=>({src:p.img,t:'lithium：'+String(p.text||'').slice(0,20)})),
      ...(c.images||[]).map((src,i)=>({src,t:'角色图片 '+(i+1)}))];
    if(!pics.length) return toast('相册是空的：TA 发过的照片、朋友圈和 lithium 的配图、编辑角色里加的图都会在这');
    return actionSheet('相册　'+pics.length+' 张',pics.map(p=>({t:p.t,av:p.src,fn:()=>openViewer(p.src)})));
  }
  openApp(k);
}

let rfBusy=false;
async function refreshAll(){
  if(rfBusy) return toast('还在刷，等一下');
  const c=characters.find(x=>x.id===curCharId);
  const rf=rfOf(c);
  const jobs=RF_DEFS.filter(d=>rf[d.k]);
  if(!jobs.length) return toast('总刷新范围是空的，去手机设置里勾几项');
  if(jobs.length===1) return jobs[0].k==='status'?refreshStatus():jobs[0].fn().then(()=>{renderPhone();toast('刷新好了');});
  rfBusy=true;
  let ok=0;
  for(let i=0;i<jobs.length;i++){
    toast(`${i+1}/${jobs.length}　${jobs[i].n}…`);
    try{ if(await jobs[i].fn()) ok++; }catch(e){}
  }
  rfBusy=false;
  show('s-phone'); renderPhone();
  toast(ok===jobs.length?`刷新完了，${ok} 项`:`${ok}/${jobs.length} 项成功，其余失败`);
}

let callState=null, callTimerId=null;

function startCall(){
  const c=characters.find(x=>x.id===curCharId);
  callState={cid:curCharId,lines:[],startedAt:Date.now(),connected:false};
  document.getElementById('callAv').innerHTML=avatarHTML(c.avatar);
  document.getElementById('callName').textContent=c.name;
  document.getElementById('callTimer').textContent='正在呼叫…';
  document.getElementById('callBody').innerHTML='';
  document.getElementById('callInput').value='';
  show('s-call');
  // 1.2~2.4 秒后"接通"
  setTimeout(()=>{
    if(!callState) return;
    callState.connected=true; callState.startedAt=Date.now();
    document.getElementById('callAv').classList.remove('callring');
    tickCall();
    callTimerId=setInterval(tickCall,1000);
    callAsk('（对方刚接起电话，你先开口，一句话）',true);
  },1200+Math.random()*1200);
}
function tickCall(){
  if(!callState||!callState.connected) return;
  const sec=Math.floor((Date.now()-callState.startedAt)/1000);
  document.getElementById('callTimer').textContent=
    String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
function renderCall(){
  document.getElementById('callBody').innerHTML=
    `<div class="calllog">`+callState.lines.map(l=>
      `<div class="callline ${l.who==='me'?'me':'ta'}">${esc(l.text)}</div>`).join('')+`</div>`;
  const b=document.getElementById('callBody'); b.scrollTop=b.scrollHeight;
}
async function callSay(){
  const ta=document.getElementById('callInput');
  const t=ta.value.trim(); if(!t||!callState) return;
  ta.value=''; ta.style.height='auto';
  callState.lines.push({who:'me',text:t});
  renderCall();
  await callAsk(t);
}
async function callAsk(userLine,opening){
  const c=characters.find(x=>x.id===callState.cid), me=personaOf(c);
  try{
    const hist=(await msgsOf(callState.cid)).slice(-12);
    const base=buildSystemPrompt(c,hist);
    const sys=base.split('# **首要规则：输出格式**')[0]+
`# **现在是语音通话**
你正在和「${me.name}」打电话，不是发消息。
- **只输出你说的话本身**，不要 JSON、不要数组、不要引号、不要任何格式
- 一次只说一到两句，像真的在电话里那样短
- 口语化：可以有「嗯」「诶」「那个」这种，可以说半句话
- 不要动作描写、不要旁白、不要写「（笑）」这种
- 听到对方说什么就自然接住，别答非所问`;
    const lines=callState.lines.map(l=>({role:l.who==='me'?'user':'assistant',content:l.text}));
    const payload=[{role:'system',content:sys},...lines];
    if(opening) payload.push({role:'user',content:userLine});
    const txt=(await callAPI(payload)).trim()
      .replace(/^```[\s\S]*?\n/,'').replace(/```$/,'')
      .replace(/^\[?"?/,'').replace(/"?\]?$/,'').trim();
    if(!callState) return;
    callState.lines.push({who:'ta',text:txt});
    renderCall();
  }catch(e){
    if(!callState) return;
    callState.lines.push({who:'ta',text:'（信号不好…'+e.message+'）'});
    renderCall();
  }
}
async function endCall(){
  if(!callState) return;
  clearInterval(callTimerId); callTimerId=null;
  const sec=callState.connected?Math.floor((Date.now()-callState.startedAt)/1000):0;
  const cid=callState.cid, lines=callState.lines;
  const dur=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  callState=null;
  if(lines.length){
    const c=characters.find(x=>x.id===cid), me=personaOf(c);
    await dbPut('messages',{id:uid(),characterId:cid,role:'user',
      content:'通话时长 '+dur, type:'call',
      meta:{dur,lines:lines.map(l=>({who:l.who,text:l.text}))},timestamp:Date.now()});
  }
  show('s-chat'); await renderChat();
}
function showCallLog(id){
  msgsOf(curCharId).then(ms=>{
    const m=ms.find(x=>x.id===id); if(!m||!m.meta.lines) return;
    const c=characters.find(x=>x.id===curCharId), me=personaOf(c);
    _acts=[];
    document.getElementById('sheetTitle').textContent='通话记录';
    document.getElementById('sheetCount').textContent=m.meta.dur;
    document.getElementById('sheetSearchWrap').style.display='none';
    document.getElementById('sheetList').innerHTML=m.meta.lines.map(l=>

        <b style="color:${l.who==='me'?'var(--accent)':'var(--sub)'};flex:0 0 auto;font-weight:600">
          ${l.who==='me'?esc(me.name):esc(c.name)}</b>

发一条朋友圈。真实、日常，10-60 字，可以是吐槽、随手一拍的感想、生活碎片。
**素材从上面的行程和剧情里挑**——今天真做过的事、真发生的心情，
别发一件今天没发生过的事。
不要故作深沉，不要写成文案，不要 @ 任何人，不要直接提对方的名字。

只输出 JSON，不要别的：{"text":"正文","imgDesc":"","self":false}`;
    let t=(await callAPI([{role:'user',content:p}])).trim()

    m2.imgDesc=desc; m2.images=[src];

 {k:'custom',n:'自己写',d:'完全按你写的来'}
];
const ORACLE_RULES=`

要求：
- **简短**，120 字以内，别写小作文
- 结论先行，不要铺垫
- 给建议时给**具体的话术**，不要"你可以试着沟通"这种废话
- 你能看到角色的日记和记忆，但要注意：这些是用户不知道的，可以点破，但要说明"这是他没告诉你的"

async function askOracle(preset){
  const ta=document.getElementById('orInput');
  const q=(preset||ta.value).trim();
  if(!q||!curCharId) return;
  if(!preset){ ta.value=''; ta.style.height='auto'; }
  const oid=oracleId(curCharId);
  await dbPut('messages',{id:uid(),characterId:oid,role:'user',content:q,
    type:'text',meta:{},timestamp:Date.now()});
  await renderOracle();
  const btn=document.getElementById('orSend'); btn.disabled=true;
  try{
    const hist=(await msgsOf(oid)).slice(-10);
    const ctx=await oracleContext();
    const payload=[{role:'system',content:oracleRole()+'\n\n'+ctx},
      ...hist.map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}))];
    const txt=(await callAPI(payload)).trim();
    await dbPut('messages',{id:uid(),characterId:oid,role:'assistant',content:txt,
      type:'text',meta:{},timestamp:Date.now()});
  }catch(e){
    await dbPut('messages',{id:uid(),characterId:oid,role:'assistant',
      content:'（出错了：'+e.message+'）',type:'text',meta:{},timestamp:Date.now()});
  }finally{
    btn.disabled=false;
    await renderOracle();
  }
}

/* 关系评估 —— 由旁白给出阶段和分数，会注入角色的提示词 */
const REL_STAGES=['陌生','认识','熟悉','亲近','暧昧','恋人','疏远','冷战','破裂'];
async function evalRelation(){
  toast('正在评估…');
  try{
    const ctx=await oracleContext();
    const p=`${ctx}

请以第三方视角评估这两个人现在的关系。

阶段只能从这些里选一个：${REL_STAGES.join(' / ')}
分数 0-100，表示亲密程度（陌生≈10，恋人≈85，破裂≈5）。
理由 60 字以内，说清楚判断依据，要指向具体的对话细节。

只输出 JSON，不要任何解释：
{"stage":"熟悉","score":45,"why":"……"}`;
    let t=(await callAPI([{role:'user',content:p}])).trim()
      .replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    const mm=t.match(/\{[\s\S]*\}/); if(mm) t=mm[0];
    const j=JSON.parse(t);
    const c=characters.find(x=>x.id===curCharId);
    c.relation={stage:REL_STAGES.includes(j.stage)?j.stage:'熟悉',
      score:Math.max(0,Math.min(100,Math.round(+j.score)||50)),
      why:String(j.why||'').trim().slice(0,90),at:Date.now()};
    await dbPut('characters',c); characters=await dbAll('characters');
    renderOracle(false); toast('评估完成');
  }catch(e){ toast('失败：'+e.message); }
}

/* 图片缩到 maxW 再存，别把原图塞进设置 */
function fileToDataUrl(file,maxW){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const sc=Math.min(1,maxW/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',.92));
      };
      img.onerror=()=>rej(new Error('图片读不出来'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('文件读不出来'));
    fr.readAsDataURL(file);
  });
}

function vibeFromNai(v,group){

  return {id:uid(),nid:String(v.id||''),name:String(v.name||'vibe').slice(0,14),src:v.thumbnail||'',enc:v.encodings||{},
    info:+ii.information_extracted||1,strength:+ii.strength||0.6,on:true,group:group||''};

function pushVibe(rec){
  if(rec.nid&&(draftImg.vibes||[]).some(x=>x.nid===rec.nid)) return false;
  draftImg.vibes.push(rec); return true;
}
async function importVibeFiles(inp){
  const files=[...(inp.files||[])]; if(!files.length) return;
  draftImg.vibes=draftImg.vibes||[];
  let n=0, bad=0;
  for(const f of files){
    try{
      if(/\.(naiv4vibe|naiv4vibebundle|json)$/i.test(f.name)){
        const j=JSON.parse(await f.text());
        const base=f.name.replace(/\.(naiv4vibe|naiv4vibebundle|json)$/i,'');
        let dup=0;
        if(j.vibeData&&typeof j.vibeData==='object'){
          // 「vibe 组」导出：groups → vibeData，vibePresets 里有人起的名字
          const nameOf={};
          for(const [pn,p] of Object.entries(j.vibePresets||{})) if(p&&p.vibeDataId&&!nameOf[p.vibeDataId]) nameOf[p.vibeDataId]=pn;
          const groups=Object.entries(j.groups||{});
          if(groups.length){
            for(const [gn,gv] of groups){
              for(const it of ((gv&&gv.vibes)||[])){
                const v=j.vibeData[it.vibeDataId]; if(!v) continue;
                const rec=vibeFromNai(v,String(gn).slice(0,12));
                if(nameOf[it.vibeDataId]) rec.name=String(nameOf[it.vibeDataId]).slice(0,14);
                if(Number.isFinite(+it.strength)&&+it.strength>0) rec.strength=+it.strength;
                if(pushVibe(rec)) n++; else dup++;
              }
            }
          }else{
            for(const [vid,v] of Object.entries(j.vibeData)){
              const rec=vibeFromNai(v,base.slice(0,12));
              if(nameOf[vid]) rec.name=String(nameOf[vid]).slice(0,14);
              if(pushVibe(rec)) n++; else dup++;
            }
          }
        }else if(Array.isArray(j.vibes)){
          for(const v of j.vibes){ if(pushVibe(vibeFromNai(v,base.slice(0,12)))) n++; else dup++; }
        }else if(j.encodings||j.thumbnail){
          if(pushVibe(vibeFromNai(j,''))) n++; else dup++;
        }else throw new Error('不是 NovelAI 的 vibe 文件');
        if(dup) toast(f.name+'：'+dup+' 个已经有了，跳过');
      }else if(/^image\//.test(f.type)){
        const d=await fileToDataUrl(f,640);
        draftImg.vibes.push({id:uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,10)||'vibe',src:d,info:1,strength:0.6,on:true,group:''});
        n++;
      }else throw new Error('不认识的文件');
    }catch(e){ bad++; toast(f.name+'：'+e.message); }
  }
  renderImgCfg();
  if(n) toast('加了 '+n+' 个 vibe'+(bad?'，'+bad+' 个没读出来':''));
}

/* 用聊天接口出图：Gemini 图像模型（nano banana 那类）走 /chat/completions，图夹在回复里 */
function imgFromChatReply(j){
  const m=(j&&j.choices&&j.choices[0]&&j.choices[0].message)||{};
  const pick=u=>u&&/^(data:image\/|https?:\/\/)/i.test(String(u))?String(u):null;
  // OpenRouter 风格：message.images[]
  for(const im of (Array.isArray(m.images)?m.images:[])){
    const u=pick((im&&im.image_url&&im.image_url.url)||(im&&im.url)||(im&&im.b64_json&&'data:image/png;base64,'+im.b64_json));
    if(u) return u;
  }
  // 多模态数组 content
  if(Array.isArray(m.content)) for(const part of m.content){
    if(!part) continue;
    const inl=part.inline_data||part.inlineData;
    const u=pick((part.image_url&&part.image_url.url)||part.url||(inl&&inl.data&&`data:${inl.mime_type||inl.mimeType||'image/png'};base64,${inl.data}`));
    if(u) return u;
  }
  // 字符串 content：markdown 里的 data URL 或图片链接
  const s=typeof m.content==='string'?m.content:'';
  let mm=s.match(/data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+/i);
  if(mm) return mm[0].replace(/\s+/g,'');
  mm=s.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/);
  if(mm) return mm[1];
  mm=s.match(/https?:\/\/[^\s)"'<>]+\.(?:png|jpe?g|webp|gif)(?:\?[^\s)"'<>]*)?/i);
  if(mm) return mm[0];
  return null;
}
async function chatImage(ep,model,prompt,negative){
  if(!model) throw new Error('模型没填，填一个图像模型（如 gemini-2.5-flash-image）');
  const text='Generate an image: '+prompt+(negative?'\nAvoid: '+negative:'')+'\nReturn only the image, no text.';
  const body={model,messages:[{role:'user',content:text}],stream:false};
  const post=b=>fetch(ep.base+'/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ep.key},body:JSON.stringify(b)});
  let r=await post({...body,modalities:['image','text']});
  // 有的中转不认 modalities 字段，去掉再试一次
  if(r.status===400) r=await post(body);
  const raw=await r.text();
  let j=null; try{ j=JSON.parse(raw); }catch(e){}
  if(!r.ok) throw new Error(`${r.status} ${(j&&j.error&&j.error.message)||raw.slice(0,160)}`.trim());
  if(j&&j.error&&!j.choices) throw new Error('接口返回了错误：'+(j.error.message||''));
  const img=imgFromChatReply(j);
  if(!img){
    const ch=j&&j.choices&&j.choices[0];
    const t=ch&&typeof ch.message?.content==='string'?ch.message.content.slice(0,120):'';
    throw new Error('回复里没有图片'+(ch&&ch.finish_reason?`（finish_reason: ${ch.finish_reason}）`:'')
      +(t?`，模型说：${t}`:'')+'。确认模型名是图像模型，且这个中转支持它出图。');
  }
  return img;
}

/* 调用生图后端，返回 dataURL */
const stripB64=d=>String(d||'').replace(/^data:[^,]+,/,'');
/* V5 之后官方去掉了 vibe；这里只对 v3 / v4 系列开 */
function vibeSupported(model){
  const m=String(model||'');
  if(/nai-diffusion-5/.test(m)) return false;
  return /nai-diffusion-(3|4)/.test(m);
}
/* NovelAI 导出的 .naiv4vibe 里自带各模型的编码：按当前模型挑一个，挑到就不用再花点数编码 */
function vibeEncFor(v,model){
  const enc=v&&v.enc; if(!enc||typeof enc!=='object') return null;
  const norm=k=>String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
  const m=String(model||'');
  const want=(/4-5/.test(m)?'v45':'v4')+(/curated/.test(m)?'curated':'full');
  const keys=Object.keys(enc);
  const k=keys.find(x=>norm(x)===want)||keys.find(x=>norm(x).includes(want))||null;
  if(!k) return null;
  const bucket=enc[k];
  let e=null;
  if(typeof bucket==='string') e=bucket;
  else if(bucket&&typeof bucket==='object'){
    const entries=bucket.encoding?[bucket]:Object.values(bucket).filter(Boolean);
    // 同一模型可能存了几档信息提取，取离设置值最近的那档
    const want=+v.info||1;
    entries.sort((a,b)=>Math.abs((+(a.params&&a.params.information_extracted)||1)-want)-Math.abs((+(b.params&&b.params.information_extracted)||1)-want));
    const first=entries[0];
    e=first&&(typeof first==='string'?first:first.encoding);
  }
  return typeof e==='string'&&e.length>20?e:null;
}
async function buildVibeParams(g){
  if(!g.vibeOn) return null;
  const on=(g.vibes||[]).filter(v=>v.on!==false&&(v.src||v.enc));
  if(!on.length) return null;
  if(!vibeSupported(g.model)) return null;
  const isV4=/nai-diffusion-4/.test(g.model);
  const imgs=[], used=[];
  for(const v of on){
    if(isV4){
      const pre=vibeEncFor(v,g.model);
      if(pre){ imgs.push(pre); used.push(v); continue; }
      // 文件来的 vibe 只有缩略图，拿它去编码又糊又扣点数：缺当前模型的编码就直接跳过
      if(!v.src||v.enc){ toast('vibe「'+v.name+'」没有当前模型的编码，已跳过'); continue; }
      // 图片来的 vibe：V4 要先编码（这一步扣点数）；反代没这个端点就跳过 vibe，不要让整张图失败
      try{
        const r=await fetch(g.base.replace(/\/+$/,'')+'/ai/encode-vibe',{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+g.key},
          body:JSON.stringify({image:stripB64(v.src),information_extracted:+v.info||1,model:g.model})});
        if(!r.ok) throw new Error(r.status+'');
        const buf=await r.arrayBuffer();
        let bin=''; const u8=new Uint8Array(buf), CH=0x8000;
        for(let k=0;k<u8.length;k+=CH) bin+=String.fromCharCode.apply(null,u8.subarray(k,k+CH));
        imgs.push(btoa(bin)); used.push(v);
      }catch(e){
        console.warn('vibe 编码失败，本次跳过 vibe：',e);
        return null;
      }
    }else if(v.src){ imgs.push(stripB64(v.src)); used.push(v); }
  }
  if(!imgs.length) return null;
  return {
    reference_image_multiple:imgs,
    reference_information_extracted_multiple:used.map(v=>+v.info||1),
    reference_strength_multiple:used.map(v=>+v.strength||0.6)
  };
}

async function generateImage(scene,char,opt){

  if(useSecond){
    const g2=img2Cfg();

  }
  const ep=imgEndpoint(g);
  if(!ep.base) throw new Error(useSecond?'第二后端地址没填':(g.backend==='chat'?'聊天接口地址也没填':'还没配生图地址'));
  // 第二后端只发画面描述：画师串 / 质量词 / 负向都是给 NAI 那类模型准备的
  const prompt=g._plain?String(scene||'').trim():buildImgPrompt(scene,char);
  const negative=g._plain?'':buildImgNegative(char);

  if(g.backend==='chat') return await chatImage(ep,g.model,prompt,negative);

  if(g.backend==='novelai'){
    const vibe=await buildVibeParams(g);
    const isV4=/nai-diffusion-4/.test(g.model);
    const params={
      params_version:3,width:g.w,height:g.h,scale:g.cfg,sampler:g.sampler,steps:g.steps,
      n_samples:1,ucPreset:0,qualityToggle:false,negative_prompt:negative,
      seed:Math.floor(Math.random()*4294967295),
      dynamic_thresholding:false,controlnet_strength:1,legacy:false,add_original_image:true,
      cfg_rescale:0,noise_schedule:'karras',...(vibe||{})};
    if(isV4){
      // V4 系列的正负向要另外用结构化字段再传一次，只给 input/negative_prompt 会 500
      params.use_coords=false;
      params.legacy_v3_extend=false;
      params.skip_cfg_above_sigma=null;
      params.v4_prompt={caption:{base_caption:prompt,char_captions:[]},use_coords:false,use_order:true};
      params.v4_negative_prompt={caption:{base_caption:negative,char_captions:[]},legacy_uc:false};
    }else{ params.sm=false; params.sm_dyn=false; }
    const r=await fetch(g.base.replace(/\/+$/,'')+'/ai/generate-image',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+g.key},
      body:JSON.stringify({input:prompt,model:g.model,action:'generate',parameters:params})});
    if(!r.ok){
      let d=''; try{ d=(await r.text()).slice(0,120); }catch(e){}
      throw new Error(`${r.status} ${d}`.trim());
    }
    return await unzipFirstPng(await r.arrayBuffer());
  }

  if(g.backend==='a1111'){
    const r=await fetch(g.base+'/sdapi/v1/txt2img',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,negative_prompt:negative,width:g.w,height:g.h,
        steps:g.steps,cfg_scale:g.cfg,sampler_name:g.sampler,n_iter:1,batch_size:1})});
    if(!r.ok) throw new Error(r.status+'');
    const j=await r.json();
    if(!j.images||!j.images[0]) throw new Error('没有返回图片');
    return 'data:image/png;base64,'+j.images[0];
  }

  if(g.backend==='openai'){
    const r=await fetch(g.base+'/images/generations',{
      method:'POST',
      headers:{'Content-Type':'application/json',...(g.key?{'Authorization':'Bearer '+g.key}:{})},
      body:JSON.stringify({model:g.model,prompt:prompt+(negative?`\n\nAvoid: ${negative}`:''),
        n:1,size:`${g.w}x${g.h}`,response_format:'b64_json'})});
    if(!r.ok){ let d=''; try{ d=(await r.json()).error?.message||''; }catch(e){}
      throw new Error(`${r.status} ${d}`.trim()); }
    const j=await r.json(), d0=j.data&&j.data[0];
    if(!d0) throw new Error('没有返回图片');
    return d0.b64_json?'data:image/png;base64,'+d0.b64_json:d0.url;
  }

  const r=await fetch(g.base,{method:'POST',
    headers:{'Content-Type':'application/json',...(g.key?{'Authorization':'Bearer '+g.key}:{})},
    body:JSON.stringify({prompt,negative_prompt:negative,width:g.w,height:g.h,
      steps:g.steps,cfg:g.cfg,model:g.model})});
  if(!r.ok) throw new Error(r.status+'');
  const j=await r.json();
  const img=j.image||j.images&&j.images[0]||j.data&&j.data[0]&&(j.data[0].b64_json||j.data[0].url);
  if(!img) throw new Error('返回里没找到图片字段');
  return /^(data:|https?:)/.test(img)?img:'data:image/png;base64,'+img;
}

/* NovelAI 返回的是 zip，取出第一张 png。
   NAI 的 zip 是流式写的：本地文件头里压缩长度是 0（用了 data descriptor），
   真实长度只在文件尾的中央目录里。所以先读中央目录，读不到再退回扫本地头。 */
async function unzipFirstPng(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  const td=new TextDecoder();
  const entries=[];
  // 1) 从文件尾找 EOCD（50 4b 05 06），拿中央目录
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-22-65557);i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd>=0){
    const n=dv.getUint16(eocd+10,true);
    let p=dv.getUint32(eocd+16,true);
    for(let k=0;k<n&&p+46<=u8.length;k++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
      entries.push({method:dv.getUint16(p+10,true), csize:dv.getUint32(p+20,true),
        off:dv.getUint32(p+42,true), name:td.decode(u8.subarray(p+46,p+46+nlen))});
      p+=46+nlen+elen+clen;
    }
  }
  // 2) 没有中央目录就扫第一个本地头（老写法）
  if(!entries.length){
    for(let i=0;i+30<=u8.length;i++){
      if(dv.getUint32(i,true)!==0x04034b50) continue;
      const nlen=dv.getUint16(i+26,true);
      entries.push({method:dv.getUint16(i+8,true), csize:dv.getUint32(i+18,true),
        off:i, name:td.decode(u8.subarray(i+30,i+30+nlen))});
      break;
    }
  }
  if(!entries.length) throw new Error('zip 里没找到图片');
  const e=entries.find(x=>/\.png$/i.test(x.name))||entries[0];
  // 数据起点按本地头算（本地头的名字 / 扩展区长度可能和中央目录不同）
  const lh=e.off;
  if(lh+30>u8.length||dv.getUint32(lh,true)!==0x04034b50) throw new Error('zip 本地头对不上');
  const start=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true);
  let csize=e.csize;
  if(!csize){
    // 两边都是 0：截到下一个 data descriptor / 本地头 / 中央目录签名为止
    let end=u8.length;
    for(let i=start;i+4<=u8.length;i++){
      const sig=dv.getUint32(i,true);
      if(sig===0x08074b50||sig===0x04034b50||sig===0x02014b50){ end=i; break; }
    }
    csize=end-start;
  }
  let data=u8.slice(start,start+csize);
  if(e.method===8){
    if(typeof DecompressionStream==='undefined') throw new Error('浏览器不支持解压，请换别的浏览器');
    try{
      const ds=new DecompressionStream('deflate-raw');
      const ab=await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
      data=new Uint8Array(ab);
    }catch(err){
      // Chrome 把流解压失败也叫 Failed to fetch，换个能看懂的说法
      throw new Error('zip 解压失败（压缩块 '+csize+' 字节，条目 '+e.name+'）：'+(err&&err.message||err));
    }
  }else if(e.method!==0) throw new Error('未知压缩方式 '+e.method);
  if(!(data[0]===0x89&&data[1]===0x50)) throw new Error('解出来的不是 PNG（前两字节 '+data[0]+' '+data[1]+'）');
  let bin=''; const CH=0x8000;
  for(let k=0;k<data.length;k+=CH) bin+=String.fromCharCode.apply(null,data.subarray(k,k+CH));
  return 'data:image/png;base64,'+btoa(bin);
}

let liTab='posts';
/* 「2小时前」这类相对时间 → 绝对时间戳；base 是这段文字写下的时刻 */
function liParseTime(t,base){
  base=base||Date.now(); t=String(t||'').trim();
  let m;
  if(!t||/刚刚|刚才|just/i.test(t)) return base;
  if((m=t.match(/(\d+)\s*(秒)/))) return base-(+m[1])*1e3;
  if((m=t.match(/(\d+)\s*(分钟|分)/))) return base-(+m[1])*6e4;
  if((m=t.match(/(\d+)\s*(小时|时|h)/i))) return base-(+m[1])*36e5;
  if((m=t.match(/(\d+)\s*(天|d)/i))) return base-(+m[1])*864e5;
  if((m=t.match(/(\d+)\s*(周|星期|w)/i))) return base-(+m[1])*7*864e5;
  if((m=t.match(/(\d+)\s*(个月|月)/))) return base-(+m[1])*30*864e5;
  if(/昨天|昨晚/.test(t)) return base-864e5;
  if(/前天/.test(t)) return base-2*864e5;
  if(/上周|上星期/.test(t)) return base-7*864e5;
  if(/上个月|上月/.test(t)) return base-30*864e5;
  const d=Date.parse(t); if(!isNaN(d)) return d;
  return base;
}
/* 相对时间显示：有 at 就按现在算（旧帖会自然变成「3天前」），没有就用当时那句文字 */
function liTime(x){
  if(!x) return '';
  if(!x.at) return x.time||'';
  const d=Date.now()-x.at;
  if(d<6e4) return '刚刚';
  if(d<36e5) return Math.floor(d/6e4)+'分钟前';
  if(d<864e5) return Math.floor(d/36e5)+'小时前';
  if(d<2*864e5) return '昨天';
  if(d<7*864e5) return Math.floor(d/864e5)+'天前';
  const dt=new Date(x.at), y=dt.getFullYear()!==new Date().getFullYear()?dt.getFullYear()+'年':'';
  return y+(dt.getMonth()+1)+'月'+dt.getDate()+'日';
}
/* 老数据没有 at：用上次刷新的时刻做基准把文字时间折算成时间戳，只补一次 */
function liBackfill(L){
  const base=L.at||Date.now();
  for(const k of ['posts','comments','dms'])
    for(const x of (L[k]||[])) if(!x.at) x.at=liParseTime(x.time,base);
  return L;
}

/* ================= 剧情上下文 =================
   TA 手机里所有生成入口（起居注 / 日记 / 朋友圈 / X / 聊天列表 / 状态 / 购物 / 心情）
   以前各拿各的：都只有 bio + 最近几条对话，谁也看不见剧情走到哪、今天做了什么。
   于是起居注的计划和主线对不上，日记不接剧情，朋友圈跟起居注互相矛盾。
   现在统一走这一份，几个入口说的就是同一条故事线。
   skip 用来排掉「自己」，避免生成时照抄上一版。 */
function storyCtx(c,opt){
  opt=opt||{}; const me=personaOf(c), skip=new Set(opt.skip||[]), out=[];
  out.push(`你是"${c.name}"：${c.bio||'（无设定）'}`);
  if(S.timeAware) out.push(String(timeContext(null)).trim());
  out.push(`对方是「${me.name}」${me.gender?'（'+me.gender+'性）':''}${(me.persona||'').trim()?'：'+String(me.persona).trim().slice(0,120):''}`);
  if(c.relation) out.push(`你们的关系：${c.relation.stage}（亲密度 ${c.relation.score}/100）`);

  // 剧情进展 —— 故事线摘要就是"已经发生了什么"，这是联动的骨架
  if(!skip.has('story')){
    const su=sumsOf(c.id).slice(0,3);
    if(su.length) out.push(NLNL+'【剧情进展】你们一路走到现在（从近到远）：'+NL
      +su.map((x,i)=>(i+1)+'. '+x.text).join(NL));
  }
  if(!skip.has('mem')){
    const core=memsOf(c.id).filter(m=>m.type==='core')
      .sort((a,b)=>b.importance-a.importance).slice(0,+opt.mem||6);
    if(core.length) out.push(NLNL+'【你一直记得的事】'+NL+core.map((m,i)=>(i+1)+'. '+m.content).join(NL));
  }
  if(!skip.has('chat')&&(opt.msgs||[]).length){
    const ms=opt.msgs.slice(-(+opt.take||14));
    out.push(NLNL+'【最近的对话】'+NL
      +ms.map(m=>(m.role==='user'?me.name:c.name)+'：'+msgToText(m)).join(NL));
  }
  const th=moodOf(c.id,today(),'char'), my=moodOf(c.id,today(),'user');
  if(th) out.push(NL+'你今天的心情：'+th.emoji+' '+(th.note||''));
  if(my) out.push('对方今天的心情：'+my.emoji+' '+(my.note||''));

  // 今天的行程：分成"已经发生"和"接下来打算"，日记和朋友圈都靠它对齐时间线
  if(!skip.has('journal')){
    const items=journalItems(((c.phone||{}).journal)||{});
    if(items.length){
      const now=jNow();
      const done=items.filter(x=>jMin(x.time)<=now), plan=items.filter(x=>jMin(x.time)>now);
      let t=NLNL+'【你今天的行程】';
      t+=NL+'已经发生：'+NL+(done.length
        ?done.map(x=>x.time+' '+x.what+(x.note?'（'+x.note+'）':'')).join(NL):'（今天还没开始）');
      if(plan.length) t+=NL+'接下来打算：'+NL+plan.map(x=>x.time+' '+x.what).join(NL);
      out.push(t);
    }
  }
  if(!skip.has('diary')){
    const d=diariesOf(c.id).filter(x=>x.who==='char').slice(0,2);
    if(d.length) out.push(NLNL+'【你最近的日记】只有你自己看过，别直接复述：'+NL
      +d.map(x=>x.date+'：'+String(x.content).slice(0,150)).join(NL));
  }
  if(!skip.has('social')){
    const mm=momentsOf(c.id).slice(0,3);
    if(mm.length) out.push(NLNL+'【最近的朋友圈】'+NL
      +mm.map(x=>(x.author==='user'?'对方发：':'你发：')+String(x.text).slice(0,50)).join(NL));
    const lp=((c.li||{}).posts||[]).slice(0,3);
    if(lp.length) out.push(NLNL+'【你 X 小号最近发的】'+NL
      +lp.map(x=>'- '+String(x.text).slice(0,50)).join(NL));
  }
  return out.join(NL);
}

/* ============================================================
   起居注 —— 今天做了什么 / 打算做什么
   ============================================================ */
let jTab='done';
function jGo(t){ jTab=t; renderApp('calendar'); }
/* "09:20" -> 分钟数；解析不了当 -1（永远算已发生） */
function jMin(t){
  const m=String(t||'').match(/(\d{1,2})[:：](\d{2})/);
  return m?(+m[1]*60+ +m[2]):-1;
}
const jNow=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
/* 兼容旧格式：done/plan 合成 items */
function journalItems(J){
  if(Array.isArray(J.items)) return J.items;
  return [...(J.done||[]),...(J.plan||[])];
}
/* 已经发生的 = 时间到了的；意外事件只有时间到了才解锁 */
const jPast=J=>journalItems(J).filter(x=>jMin(x.time)<=jNow());
const jFuture=J=>journalItems(J).filter(x=>jMin(x.time)>jNow());
function renderJournal(box){
  const c=characters.find(x=>x.id===curCharId), p=c.phone||{};
  const J=p.journal||{items:[],at:0};
  const past=jPast(J), future=jFuture(J);
  const locked=future.filter(x=>x.note).length;
  const list=(jTab==='done'?past:future).map(x=>
    jTab==='done'?x:{...x,note:''});   // 未来的意外不给看
  const canShare=past.some(x=>x.note);
  box.innerHTML=`
    <div class="jseg"><div class="seg">
      <div class="${jTab==='done'?'on':''}" onclick="jGo('done')">已经发生　${past.length}</div>
      <div class="${jTab==='plan'?'on':''}" onclick="jGo('plan')">接下来　${future.length}</div>
    </div></div>
    ${jTab==='done'&&canShare?`<div class="jshare" onclick="shareJournal()">
      ${IC('quote',14)} 让 TA 挑一件今天的事讲给你听</div>`:''}
    ${list.length?`<div class="listcard" style="margin:8px 14px">`+list.map(x=>`
      <div class="jrow ${jTab} ${x.done?'done':''}"><span class="jdot"></span>
        <span class="jt">${esc(x.time||'')}</span>
        <div class="jc">
          ${x.tag?`<span class="jtag">${esc(x.tag)}</span>`:''}
          <div class="jw">${esc(x.what||'')}</div>
          ${x.note?`<div class="jn">${esc(x.note)}</div>`:''}
        </div></div>`).join('')+`</div>`
      :`<div class="empty"><p>${jTab==='done'?'今天还没记下什么':'没有安排'}<br>点右上角刷新</p></div>`}
    <div class="hint">${jTab==='done'
      ?'带竖线的那段是过程里的意外——TA 自己知道，你不一定知道。'
      :(locked?`这里面藏着 ${locked} 件意外，到点了才能看到。晚上再来翻，一天的事就都解锁了。`
        :'到点之后这些会挪到「已经发生」里。')}</div>
    <div style="height:20px"></div>`;
}

/* 每天自动生成起居注：过了设定的钟点、当天还没生成过就补一次。
   一轮只做一个角色，避免开着页面一口气打好几次 API */
let jAutoBusy=false;
async function journalAutoTick(){
  if(jAutoBusy||sending||!db) return;
  const now=new Date();
  for(const c of characters){
    const pc=c.phoneCfg||{};
    const at=((c.phone||{}).journal||{}).at||0;
    let due=false;
    // ① 每天补一次
    if(pc.jAuto){
      const h=Number.isFinite(+pc.jHour)?+pc.jHour:8;
      if(now.getHours()>=h&&!(at&&new Date(at).toDateString()===now.toDateString())) due=true;
    }
    // ② 每隔 N 小时滚一次，让 TA 这一天是在往前走的
    const every=Math.max(0,+pc.jEvery||0);
    if(!due&&every&&(!at||Date.now()-at>=every*3600e3)) due=true;
    if(!due) continue;
    const ms=await msgsOf(c.id);
    if(!ms.length) continue;          // 没聊过就没素材，别硬编
    jAutoBusy=true;
    const keep=curCharId; curCharId=c.id;
    try{
      if(await refreshJournal(true)){
        // 刚更新完，按概率让 TA 主动把其中一件事讲给你听
        const push=Math.max(0,Math.min(100,+pc.jPush||0));
        if(push&&Math.random()*100<push) await shareJournal(true);
      }
    }catch(e){}
    curCharId=keep;
    jAutoBusy=false;
    break;
  }
}

  const u=c.li.users[liUserIdx]; if(!u) return;
  toast('拉取中…');
  try{
    const q=u.isMe
      ? `模拟一个社交账号主页的帖子。这个账号的主人是「${me.name}」：${me.persona||'（无设定）'}
生成 3-4 条这个人最近发的帖子，日常、真实、10-50 字。
只输出 JSON 数组：[{"text":"…","time":"2小时前","likes":数字,"replies":数字}]`
      : `模拟一个匿名社交平台上的博主主页。
博主昵称：${u.name}（@${u.handle}），简介「${u.bio||''}」

只输出 JSON 数组：[{"text":"…","time":"2小时前","likes":数字,"replies":数字}]`;

      .replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();

/* 刷新 lithium：第一次生成整份快照；之后每次只生成「这段时间新发生的」，叠在旧内容上面。
   旧帖、旧评论、旧私信全部保留（图、评论、私密状态都在），不会被刷掉。 */
async function refreshLi(silent){
  const c=characters.find(x=>x.id===curCharId), me=personaOf(c);
  if(!silent) toast('正在刷新 lithium…');
  try{
    const ms=(await msgsOf(curCharId)).slice(-14);
    const old=liBackfill(liData(c));
    const oldPosts=old.posts||[];
    const first=!oldPosts.length;
    const autoChange=(c.phoneCfg||{}).autoChange!==false;
    const keep=oldPosts.slice(0,8).map(p=>'- '+(p.private?'（已私密）':'')+p.text+'　（'+liTime(p)+'）').join(NL);
    const p=`${storyCtx(c,{msgs:ms,take:16,skip:['social']})}
${keep?`
你之前发过的帖子（都还挂在主页上，不要重复、不要改写，新帖接着这条时间线往后发）：
${keep}`:''}
${(c.phoneCfg||{}).liPrompt?`
## 额外要求（优先满足）
${(c.phoneCfg||{}).liPrompt}`:''}
${autoChange?`
你偶尔会折腾自己的主页——改签名、把某条旧帖设成私密。
如果这次想改签名，就在 bio 里写个新的；不想改就沿用「${esc0(old.bio||'')}」。
想把哪条旧帖设成私密，就把它开头的 10 个字写进 hideOld；不想动就给空数组。`:`
签名保持「${esc0(old.bio||'')}」不要改。hideOld 给空数组。`}

${first
  ?'生成你这个社交账号此刻的样子。'
  :'距离上次打开这个账号又过了一阵。只生成这段时间**新发生的**：新发的帖子、新收到的评论、新来的私信——旧的都还在，不用重写。'}这是个匿名账号，粉丝不知道你现实里是谁。

只输出 JSON，不要任何解释：
{
  "handle": "账号名",
  "bio": "个人简介，20字内",
  "followers": 粉丝数,
  "following": 关注数,
  "posts": [
    {"text":"帖子正文，10-60字","time":"2小时前","likes":数字,"replies":数字,
     "private":false,"imgDesc":"如果这条配图，写英文 danbooru tag 描述这张图；纯文字帖就留空字符串",
     "self":false}
  ],
  "hideOld": ["要设成私密的旧帖开头10字"],
  "comments": [
    {"who":"评论者昵称","text":"评论内容，15字内","on":"评论的是哪条帖子的前10字","time":"1小时前","unread":true}
  ],
  "dms": [
    {"who":"发私信的人","last":"最后一条内容，20字内","time":"昨天","unread":true,
     "msgs":[{"from":"them","text":"…"},{"from":"me","text":"…"}]}
  ]
}

要求：
${first?`- posts 给 4-6 条，**其中 2-3 条 private:true**（那些是以前尺度大的内容，现在设成私密了，正文可以写得暧昧但不要露骨）
- 公开的那几条是漂亮的画、拍的风景、日常碎片，可以配图（imgDesc 写英文 tag）
- comments 给 4-6 条，来自不同的人
- dms 给 3-4 条`
:`- posts 只给**上次之后新发的 1-3 条**，素材从上面的行程和剧情里挑，time 写离现在多久（"3小时前""昨天"）；大多公开，偶尔一条 private:true；这段时间没什么想发的也可以只给 1 条
- comments 给 3-5 条**新收到的**，可以评在旧帖下面（on 写那条帖子的前 10 字）
- dms 给 1-3 条新的，可以是老对话里那个人又发来了（who 用同一个名字，msgs 只写新增的几句），也可以是新来的人`}
- 评论和私信的语气要杂——有真心夸的、有油腻的、有催更的、有阴阳怪气的，可以有让人不适的
- self：这条的图里有你本人（自拍、镜子里、露出手）才 true；画、风景、东西、猫都是 false
- 昵称要像真实网友，不要"用户A"这种`;
    let t=(await callAPI([{role:'user',content:p}])).trim()
      .replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    const mm=t.match(/\{[\s\S]*\}/); if(mm) t=mm[0];
    const j=JSON.parse(t);
    const S1=x=>String(x==null?'':x).trim();
    const num=x=>Math.max(0,Math.round(+x)||0);
    const now=Date.now();

    // 帖子：新的插到最前，旧的原样保留；同文去重
    const seen=new Set(oldPosts.map(x=>x.text));
    const fresh=(Array.isArray(j.posts)?j.posts:[]).slice(0,first?8:4).map(x=>({
      text:S1(x.text).slice(0,120), time:S1(x.time).slice(0,10), at:liParseTime(x.time,now),
      likes:num(x.likes), replies:num(x.replies), private:!!x.private,
      imgDesc:S1(x.imgDesc).slice(0,160), self:!!x.self, img:null, liked:false, comments:[]}))
      .filter(x=>x.text&&!seen.has(x.text)&&seen.add(x.text));
    const posts=[...fresh,...oldPosts].slice(0,60);
    // 把旧帖设成私密（只动旧的，只动公开的）
    let hid=0;
    if(autoChange) for(const h of (Array.isArray(j.hideOld)?j.hideOld:[]).slice(0,3)){
      const k=S1(h).slice(0,10); if(!k) continue;
      const tgt=oldPosts.find(x=>!x.private&&x.text.startsWith(k));
      if(tgt){ tgt.private=true; hid++; }
    }

    // 评论通知：新的插前面
    const freshC=(Array.isArray(j.comments)?j.comments:[]).slice(0,10).map(x=>({
      who:S1(x.who).slice(0,14), text:S1(x.text).slice(0,60), on:S1(x.on).slice(0,20),
      time:S1(x.time).slice(0,10), at:liParseTime(x.time,now), unread:x.unread!==false}))
      .filter(x=>x.text);
    const comments=[...freshC,...(old.comments||[])].slice(0,40);

    // 私信：同一个人就接在原对话后面并顶到最上，新人就新开一条
    const dms=(old.dms||[]).map(d=>({...d,msgs:[...(d.msgs||[])]}));
    let nd=0;
    for(const x of (Array.isArray(j.dms)?j.dms:[]).slice(0,8)){
      const who=S1(x.who).slice(0,14); if(!who) continue;
      const msgs=(Array.isArray(x.msgs)?x.msgs:[]).slice(0,8)
        .map(y=>({from:y.from==='me'?'me':'them', text:S1(y.text).slice(0,120)})).filter(y=>y.text);
      const last=S1(x.last).slice(0,60)||(msgs.length?msgs[msgs.length-1].text:'');
      if(!last) continue;
      const item={who,last,time:S1(x.time).slice(0,10),at:liParseTime(x.time,now),unread:x.unread!==false};
      const i=dms.findIndex(d=>d.who===who);
      if(i>=0){
        const d=dms.splice(i,1)[0];
        const have=new Set(d.msgs.map(m=>m.from+'|'+m.text));
        const add=msgs.filter(m=>!have.has(m.from+'|'+m.text));
        dms.unshift({...d,...item,msgs:[...d.msgs,...add].slice(-40)});
      } else dms.unshift({...item,msgs});
      nd++;
    }
    dms.splice(12);

    c.li={
      ...old,
      // 账号名一旦有了就不再随刷新变；bio 按开关
      handle:(c.xname||old.handle||S1(j.handle)||c.name||'lithium').slice(0,16),
      bio:(autoChange?S1(j.bio).slice(0,40):'')||old.bio||S1(j.bio).slice(0,40),
      followers:num(j.followers)||old.followers||0, following:num(j.following)||old.following||0,
      posts, comments, dms,
      users:old.users||[], cover:old.cover||'',
      at:now
    };
    await dbPut('characters',c); characters=await dbAll('characters');
    renderLi();
    if(!silent) toast(first?'刷新好了':`新帖 ${fresh.length} · 评论 ${freshC.length} · 私信 ${nd}`+(hid?` · 设私密 ${hid}`:''));
    // 新帖自动配图（公开的、写了 imgDesc 的），一张一张来，失败就停
    if((imgReady()||img2Ready())&&imgCfg().autoPost!==false){
      for(const np of fresh){
        if(np.private||!np.imgDesc||!imgReadyFor(liPersonOf(np)?1:0)) continue;
        try{ np.img=await generateImage(np.imgDesc,liPersonOf(np)?c:null); await dbPut('characters',c); characters=await dbAll('characters'); renderLi(); }
        catch(e){ toast('配图失败：'+e.message); break; }
      }
    }
    // 新发的那条顺手把评论拉起来，老帖子留着点进去再拉
    if(fresh.length && !(c.li.posts[0].comments||[]).length){
      liPostIdx=0;
      await loadPostComments(true);
      if(!silent){ show('s-li'); renderLi(); } else renderLi();
    }
    return true;
  }catch(e){ if(!silent) toast('失败：'+e.message); return false; }
}

/* 这张图里有没有 TA 本人：新帖有 self 字段，老帖按描述猜。没有人就不拼角色外貌词，否则风景照里会站个人 */
const descHasPerson=d=>/\b(1boy|1girl|2boys|2girls|solo|boy|girl|man|woman|male|female|person|people|selfie|self|portrait|face|hands?|body|couple|character|figure)\b/i.test(String(d||''));
const liPersonOf=p=>typeof p.self==='boolean'?p.self:descHasPerson(p.imgDesc);
/* 给某条帖子生成配图 */
function liGenImage(i){
  const c=characters.find(x=>x.id===curCharId), p=c.li.posts[i];
  if(!imgReadyFor(liPersonOf(p)?1:0)) return toast('先去 设置 → 生图 配一下');
  openGen({charId:liPersonOf(p)?curCharId:null,scene:p.imgDesc||'',acceptText:'用作这条帖子的配图',
    back:()=>{ show('s-li'); renderLi(); },
    onAccept:async(src)=>{
      const cc=characters.find(x=>x.id===curCharId);
      cc.li.posts[i].img=src;
      await dbPut('characters',cc); characters=await dbAll('characters');
      show('s-li'); renderLi();
    }});
}

/* ---------- Prompt ---------- */
function timeContext(lastUserTs){
  const d=new Date(), week='日一二三四五六'[d.getDay()], h=d.getHours();
  const period=h<5?'凌晨':h<8?'清晨':h<11?'上午':h<14?'中午':h<17?'下午':h<19?'傍晚':h<23?'晚上':'深夜';
  const m=d.getMonth()+1;
  const season=m>=3&&m<=5?'春季':m>=6&&m<=8?'夏季':m>=9&&m<=11?'秋季':'冬季';
  let s=`\n- **当前时间:** ${d.getFullYear()}年${m}月${d.getDate()}日 星期${week} `
      +`${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
      +`\n- **季节:** ${season}，${period}时分`;
  if(lastUserTs){
    const min=Math.floor((Date.now()-lastUserTs)/60000), hr=Math.floor(min/60), day=Math.floor(hr/24);
    if(day>0)      s+=`\n- **时间流逝:** 用户上次回复是${day}天前，你们已经有${day}天没有聊天了`;
    else if(hr>0)  s+=`\n- **时间流逝:** 用户上次回复是${hr}小时前`;
    else if(min>5) s+=`\n- **时间流逝:** 用户上次回复是${min}分钟前`;
  }
  return s;
}
function memoryText(cid){
  if(!S.memoryEnabled) return '';
  const list=memsOf(cid);
  // 角色级优先，0 跟随全局 —— 和「读取轮数」同一套约定
  const _g=chatCfg(characters.find(x=>x.id===cid));
  const nCore=_g.memCore||S.memCore, nEpi=_g.memEpisodic||S.memEpisodic;
  const core=list.filter(m=>m.type==='core').sort((a,b)=>b.importance-a.importance||b.timestamp-a.timestamp).slice(0,nCore);
  const epi=list.filter(m=>m.type==='episodic').sort((a,b)=>b.timestamp-a.timestamp).slice(0,nEpi);
  let s='';
  if(core.length) s+=`\n\n【核心记忆】关于对方，你一直记得的事：\n`+core.map((m,i)=>`${i+1}. ${m.content}`).join('\n');
  if(epi.length)  s+=`\n\n【情景记忆】最近发生过的事：\n`+epi.map((m,i)=>`${i+1}. ${m.content}`).join('\n');
  // 故事线：离散条目说明"他知道什么"，摘要说明"你们是怎么走到这一步的"
  const su=sumsOf(cid).slice(0,Math.max(1,+((characters.find(x=>x.id===cid)||{}).chat||{}).sumKeep||3));
  if(su.length) s+=`\n\n【最近发生的事】按时间从近到远：\n`
    +su.map((x,i)=>`${i+1}. ${x.text}`).join('\n');
  if(s) s+=`\n\n以上是你与对方的完整记忆，包括不同场景下的互动。回复时自然地延续这些记忆，让对话保持连贯性。`;
  return s;
}
/* 今日心情 + 最近日记，也塞进当前情景 */
function extraContext(char){
  let s='';
  if(char.relation) s+=`\n- **你们的关系:** ${char.relation.stage}（亲密度 ${char.relation.score}/100）`;
  const my=moodOf(char.id,today(),'user'), th=moodOf(char.id,today(),'char');
  if(my) s+=`\n- **对方今天的心情:** ${my.emoji}${my.note?'（'+my.note+'）':''}`;
  if(th) s+=`\n- **你今天的心情:** ${th.emoji}${th.note?'（'+th.note+'）':''}`;
  const ch=((char.phone||{}).chats||[]).filter(x=>x.last).slice(0,3);
  if(ch.length) s+=`\n\n【你手机里其他人的消息】对方不知道这些：\n`
    +ch.map(x=>`- ${x.who}${x.tag?'（'+x.tag+'）':''}：${x.last}`).join('\n');
  const L=char.li;
  if(L&&(L.posts||[]).length){
    const pub=L.posts.filter(x=>!x.private).slice(0,3);
    const pri=L.posts.filter(x=>x.private).length;
    if(pub.length) s+=`\n\n【你 lithium 账号最近发的】对方可能看到，也可能没看到：\n`
      +pub.map(x=>`- ${x.text}（${x.likes||0} 赞）`).join('\n');
    if(pri) s+=`\n（另有 ${pri} 条已设为私密）`;
    const nd=(L.dms||[]).filter(x=>x.unread).length, nc=(L.comments||[]).filter(x=>x.unread).length;
    if(nd||nc) s+=`\n- **账号未读:** ${nd} 条私信、${nc} 条评论没看`;
  }
  const mm=momentsOf(char.id).slice(0,3);
  if(mm.length) s+=`\n\n【最近的朋友圈】\n`+mm.map(x=>{
    const who=x.author==='user'?'对方':'你';
    const cm=(x.comments||[]).map(y=>(y.who==='user'?'对方':'你')+'评论：'+y.text).join('；');
    return `- ${who}发：${x.text}${cm?'（'+cm+'）':''}`;
  }).join('\n');
  const d=diariesOf(char.id).filter(x=>x.who==='char').slice(0,2);
  if(d.length) s+=`\n\n【你最近的日记】只是你自己的想法，对方没看过，不要直接复述：\n`
    +d.map(x=>`${x.date}：${x.content}`).join('\n');
  return s;
}

/* 世界书注入：返回 {before, after} 两段 */
function worldbookParts(char,history){
  const ids=new Set(char.worldbookIds||[]);
  const books=worldbooks.filter(w=>w.global||ids.has(w.id));
  const before=[], after=[];
  for(const w of books){
    const text=history.slice(-(w.scanDepth||6)).map(m=>msgToText(m)).join('\n');
    for(const e of [...w.entries].sort((a,b)=>a.order-b.order)){
      if(!matchEntry(e,text).hit) continue;
      if(e.prob<100 && Math.random()*100>e.prob) continue;
      (e.pos==='before'?before:after).push(e.content.trim());
    }
  }
  const wrap=arr=>arr.length
    ? `\n\n【背景知识/世界观】以下是相关的设定信息，请在对话中自然地运用：\n`
      +arr.map((t,i)=>`${i+1}. ${t}`).join('\n')
    : '';
  return {before:wrap(before), after:wrap(after), count:before.length+after.length};
}

let lastInject={};
function buildSystemPrompt(char,history,splitWb){
  const me=personaOf(char);
  lastInject={};
  const lastUser=[...history].reverse().find(m=>m.role==='user');
  const mem=memoryText(char.id);
  const wb=worldbookParts(char,history);
  const ps=presetParts(char);
  lastPresetJb=ps.jb;
  // EVE 同款：插入位置为「后」的世界书不进 system prompt，由 requestReply 单独下发
  lastWbAfter=splitWb?wb.after:'';

  let p=`${ps.top?ps.top.trim()+'\n\n':''}${wb.before?wb.before.trim()+'\n\n':''}你是一个专业的角色扮演者，能够根据角色人设、记忆和你们的关系，生成真实、自然的回复。

# **你的角色与任务**
你现在扮演一个名为"${char.name}"的角色。

## **角色设定:**
${char.bio||'（未填写）'}${ps.char}

## **当前情景:**`;
  if(S.timeAware) p+=timeContext(lastUser?lastUser.timestamp:null);
  lastInject.bio={label:'角色设定',chars:(char.bio||'').length};
  lastInject.persona={label:'我的身份',chars:me.name.length+(me.persona||'').length};
  lastInject.time={label:'时间感知',chars:S.timeAware?timeContext(lastUser?lastUser.timestamp:null).length:0};
  lastInject.mem={label:'记忆',chars:mem.length,n:mem?(mem.split('\n').filter(x=>/^\d+\. /.test(x)).length):0};
  lastInject.wb={label:'世界书',chars:(wb.before+wb.after).length,n:wb.count};
  lastInject.style={label:'风格示例'+(String(chatCfg(char).styleExamples||'').trim()?' · 专属':''),chars:(String(chatCfg(char).styleExamples||'').trim()||String(S.styleExamples||'').trim()).length};
  const ext=extraContext(char);
  const cross=crossMemText(char);
  const mount=mountedMemText(char);
  const xc=xContext(char);
  lastInject.ext={label:'心情日记',chars:ext.length};
  lastInject.xlog={label:'X 互动',chars:xc.length,n:(char.xlog||[]).slice(-6).length};
  lastInject.sum={label:'故事线摘要',chars:sumsOf(char.id).reduce((a,x)=>a+x.text.length,0),
    n:sumsOf(char.id).length};
  lastInject.cross={label:'跨场景',chars:cross.length};
  lastInject.mount={label:'挂载记忆',chars:mount.length,n:(chatCfg(char).mountIds||[]).length};
  lastInject.preset={label:'预设'+(ps.name?' · '+ps.name:''),chars:ps.chars+ps.jb.length,n:ps.n};
  /* EVE 顺序：当前情景之后立刻压格式规则和忽略异常，
     然后才是对话者身份、记忆（EVE 的 DYNAMIC_MEMORY_PLACEHOLDER 位）、挂载 */
  p+=`

# **首要规则：输出格式**
你的所有回复，**【必须】**、**【严格】**遵循 JSON 数组格式。这是一个绝对的、不可违反的规则。

## **正确格式:**
- 单条：\`["你好"]\`
- 多条：\`["你好", "今天天气不错！", "在干嘛呀"]\`

## **【绝对禁止】的错误格式:**
- **错误1（合并消息）：** \`["你好\\n今天天气不错！"]\` <== 这是最常见的错误，绝对禁止！
- **错误2（非数组）：** \`"你好"\`
- **错误3（外面套代码块，或在数组前后加解释文字）**
- **错误4（拆成多个数组）：** 每行一个 \`["你好"]\` \`["在干嘛"]\` <== 只能有**一个**数组，多条消息放进同一个数组里

## **重要：忽略技术异常**
如果你在用户消息中看到任何乱码、随机字符串或无意义的字符组合，请完全忽略它们，只回应有意义的正常文字部分。`;
  p+=`\n- **对话者身份:** 用户的名字是"${me.name}"${me.gender?`，**${me.gender}性**`:''}`;
  if((me.persona||'').trim()) p+=`。TA 的身份设定：${me.persona.trim()}`;
  p+=`\n- 对方的性别、称呼、身份**只以上面「对话者身份」为准**。身份设定里没写明的，保持中性表达——**绝对不要自行假设对方的性别**，也不要用错人称和称呼`;
  p+=`\n- **任务:** 根据对话上下文，以你的角色身份进行自然回应。`;
  p+=chatCfg(char).sceneMode==='offline'
    ?`\n- **你们现在面对面（线下）**：下面每条消息都是当面说出口的话，不是手机消息。不要提"发消息""回消息""看手机"这类隔着屏幕才有的说法`
    :`\n- 你们现在隔着手机聊天（线上）`;
  // ―― EVE 的记忆占位符位置：核心 → 情景 → 摘要（mem 内部就是这个顺序）→ 动态 ――
  p+=mem;
  p+=ext;
  p+=cross;
  p+=xc;
  p+=mount;
  if(!splitWb) p+=wb.after;
  p+=`

# **聊天方式**

/* ============================================================
   按「轮」取历史
   一轮 = 对方发一次 + 你回一次。角色一次常连发 8-10 条（实测姬照
   平均 8.7、最多 37），所以"最近 30 条"其实只有 2.6 轮 —— 他看不到
   你们刚才在吵什么。按轮取才是人理解对话的方式。
   ============================================================ */
function takeTurns(ms,turns){
  if(!ms.length) return [];
  const want=Math.max(1,turns|0);
  // 从后往前扫，role 每变一次算一段连发，两段算一轮
  let runs=0, last=null, i=ms.length-1;
  for(;i>=0;i--){
    const r=ms[i].role;
    if(r!==last){ runs++; last=r; }
    if(runs>want*2) break;      // 多扫一段，保证第一轮完整
  }
  return ms.slice(i+1);
}
/* 上限：轮数换算的条数再多也不能撑爆请求 */
const HIST_HARD_CAP=400;
function historyFor(c,ms){
  const g=chatCfg(c);
  if(g.histMode==='msg'){                     // 老行为：按条
    const n=g.historyCount||S.historyCount;
    return ms.slice(-n);
  }
  const t=g.histTurns||S.histTurns||12;
  const out=takeTurns(ms,t);
  return out.length>HIST_HARD_CAP?out.slice(-HIST_HARD_CAP):out;
}

/* 历史 -> API messages；最近的真图用多模态格式带上，让模型真的看到 */
const VISION_LOOKBACK=6, VISION_MAX=3;
function toApiMessages(history){
  let budget=VISION_MAX;
  const start=Math.max(0,history.length-VISION_LOOKBACK);
  return history.map((m,i)=>{
    const role=m.role==='user'?'user':'assistant';
    const isReal=m.role==='user'&&m.type==='image'&&m.meta&&m.meta.real&&m.meta.src;
    // 只给用户消息标 ID —— 贴表情只能贴对方发的，标全部纯属浪费 token
    const tag=(m.role==='user'&&m.type!=='scene')?`[ID:${m.id}] `:'';
    if(isReal&&i>=start&&budget>0&&S.visionEnabled!==false){
      budget--;
      return {role,content:[
        {type:'text',text:tag+(m.content?m.content:'（这是我发给你的图片，看看是什么）')},
        {type:'image_url',image_url:{url:m.meta.src}}
      ]};
    }
    return {role,content:tag+msgToText(m)};
  });
}

/* 模型给你的某条消息贴表情 —— 只认 message_id，对不上就丢弃。
   以前用「前几个字」模糊匹配，模型想反应的那句和实际贴上的常常不是同一条 */
async function aiReact(p){
  const mid=String(p.mid||'').trim();
  if(!mid) return;
  const ms=await msgsOf(curCharId);
  const target=ms.find(m=>m.id===mid&&m.role==='user'&&m.type!=='scene');
  if(!target){ console.warn('贴表情的 message_id 对不上，已忽略：',mid); return; }
  const e=String(p.content||'').trim(); if(!e) return;
  target.reactions=[...(target.reactions||[])];
  if(target.reactions.includes(e)) return;      // 已经贴过同一个就不重复
  target.reactions.push(e);
  await dbPut('messages',target);
  await renderChat(false);
}

/* 模型处理你发的转账 */
async function aiTfAct(action){
  const st=action==='accept'||action==='accepted'?'accepted':'rejected';
  const ms=await msgsOf(curCharId);
  for(let i=ms.length-1;i>=0;i--){
    const m=ms[i];
    if(m.role==='user'&&m.type==='transfer'&&(m.meta.status||'pending')==='pending'){
      m.meta={...m.meta,status:st,actedAt:Date.now()};
      await dbPut('messages',m); await renderChat(); return;
    }
  }
}

/* 模型自己撤回：撤掉它最近一条还没被撤回的消息 */
async function doAiRecall(){
  const ms=await msgsOf(curCharId);
  for(let i=ms.length-1;i>=0;i--){
    if(ms[i].role==='assistant'&&!ms[i].recalled){
      ms[i].recalled=true; ms[i].recalledAt=Date.now();
      await dbPut('messages',ms[i]);
      await renderChat();
      await new Promise(r=>setTimeout(r,420));
      return;
    }
  }
}

/* 中文照片描述 → NovelAI 风格英文 tag。角色外貌固定词另外拼，这里只写动作 / 表情 / 服饰 / 场景 / 光线 */
async function descToTags(desc,c){
  const fixed=c&&c.imgPrompt?String(c.imgPrompt).trim():'';
  const q=`把下面这段照片描述转成 NovelAI（danbooru 风格）的英文 tag，给生图用。

描述：${desc}
${fixed?`
角色的外貌固定 tag 已经另外拼上了（${fixed}），**不要写外貌**：发型发色瞳色身材这些一个都不要。`:''}
按这个顺序写：
1. 背景 / 场景 / 光线 / 氛围（在哪、几点、什么天气、什么光）
2. 角色在做什么：姿势、动作、表情、视线、手在干什么、镜头构图（自拍 / 镜子 / 俯拍 / 特写…）
3. 穿着：每件衣服、颜色、材质、配饰、状态（湿的、皱的、半脱的…）
数量不限——画面复杂就多写，把描述里每个细节都落成 tag，别为了凑短而漏东西。
逗号分隔，不要画师名，不要质量词，不要句子，不要解释。只输出 tag。`;
  let t=(await callAPI([{role:'user',content:q}])).trim();
  t=t.replace(/^```[a-z]*\s*/i,'').replace(/```\s*$/,'').replace(/^tags?\s*[:：]\s*/i,'')
     .replace(/[\r\n]+/g,', ').replace(/\s*,\s*/g,', ').replace(/(,\s*)+/g,', ').replace(/^,\s*|,\s*$/g,'').trim();
  if(!t) throw new Error('没转出 tag');
  return t.slice(0,2000);
}

/* 角色发的照片：先出占位卡，后台一张张生成，生成完把图填进气泡 */
const _genQ=[]; let _genBusy=false;

async function runGenQ(){
  _genBusy=true;
  while(_genQ.length){
    const id=_genQ.shift();
    try{
      const m=await dbGet('messages',id);
      if(!m||m.type!=='image'||!m.meta||!m.meta.pending) continue;
      const c=characters.find(x=>x.id===m.characterId);
      const person=m.meta.self!==false;
      const desc=String(m.meta.desc||m.content||'').trim();
      if(!c||chatCfg(c).charImg===false||!imgReadyFor(person?1:0)||(!m.meta.tags&&!desc)){
        m.meta.pending=false; await dbPut('messages',m);
        if(m.characterId===curCharId) await renderChat();
        continue;
      }
      let src=null, err='', tags=String(m.meta.tags||'').trim();
      // 第二步：模型写的是中文描述，先转成 NAI 的英文 tag（角色固定词、画师串、质量词、vibe 由 generateImage 按装配顺序拼）
      if(!tags||/[\u4e00-\u9fff]/.test(tags)){
        try{ tags=await descToTags(tags?tags+'。'+desc:desc,person?c:null); }
        catch(e){ tags=tags||desc; }
        const mt=await dbGet('messages',id); if(mt){ mt.meta={...mt.meta,tags}; await dbPut('messages',mt); }
      }
      try{ src=await generateImage(tags,person?c:null); }catch(e){ err=String(e&&e.message||e); }
      const m2=await dbGet('messages',id); if(!m2) continue;
      m2.meta={...m2.meta,pending:false,tags};
      if(src){ m2.meta.src=src; delete m2.meta.genErr; } else m2.meta.genErr=err.slice(0,80);
      await dbPut('messages',m2);
      if(src) await addCharPhoto(c.id,src,m2.content||'',
        'chat');
      if(m2.characterId===curCharId) await renderChat();
      if(!src) toast('照片生成失败：'+err.slice(0,60));
    }catch(e){ console.warn('genChatImage',e); }
  }
  _genBusy=false;
}

/* 片段 -> 消息记录；表情包按描述去库里找图 */
function toMsg(p){
  if(p.type==='sticker'){
    const st=stickers.find(x=>x.name===p.content)
      ||stickers.find(x=>x.name&&p.content.includes(x.name));
    return st?{type:'sticker',content:st.name,meta:{src:st.src}}
             :{type:'text',content:'['+p.content+']',meta:{}};
  }
  if(p.type==='transfer') return {type:'transfer',content:p.content,
    meta:{amount:p.amount,status:'pending'}};
  if(p.type==='image') return {type:'image',content:p.content,
    meta:{real:false,gen:true,tags:p.tags||'',desc:p.desc||'',self:!!p.self,pending:true}};
  if(p.type==='voice') return {type:'voice',content:p.content,
    meta:{dur:Math.max(1,Math.round(p.content.length/3.6))}};
  if(p.type==='xsh'){
    const c=characters.find(x=>x.id===curCharId)||{};
    const who=((c.li||{}).handle)||c.xname||c.name||'?';
    return {type:'xsh',content:p.content,meta:{who,text:p.xtext.slice(0,200)}};
  }
  return {type:'text',content:p.content,meta:{}};
}
