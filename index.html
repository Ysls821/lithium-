/* ---------- 左滑引用 ----------
   在气泡上横向拖，超过阈值松手就把这条设成引用 */
let swQ=null;
function initSwipeQuote(){
  const box=document.getElementById('chatBody');
  if(!box) return;
  const start=(el,x,y)=>{ swQ={el,id:el.dataset.lpid,x,y,on:false}; };
  const move=(x,y,ev)=>{
    if(!swQ) return;
    const dx=x-swQ.x, dy=y-swQ.y;
    if(!swQ.on){
      if(Math.abs(dy)>14){ swQ=null; return; }     // 在竖着滚列表，放手
      if(dx>-16) return;                           // 还没算左滑
      swQ.on=true; swQ.el.classList.add('swiping');
    }
    // 认定是左滑之后就把手势吃掉，别让页面跟着横向晃
    if(ev&&ev.cancelable) ev.preventDefault();
    const off=Math.max(-84,Math.min(0,dx));
    swQ.el.style.transform=`translateX(${off}px)`;
    swQ.el.classList.toggle('swready',off<=-52);
  };
  const end=async()=>{
    if(!swQ) return;
    const {el,id,on}=swQ; swQ=null;
    if(!on) return;
    const ready=el.classList.contains('swready');
    el.classList.remove('swiping','swready');
    el.style.transform='';
    if(!ready) return;
    try{ navigator.vibrate&&navigator.vibrate(10); }catch(e){}
    const m=(await msgsOf(curCharId)).find(x=>x.id===id);
    if(m) setQuote(m);
  };
  /* iOS 上滚动容器里的 pointer 事件一开始滚就被 pointercancel 掉，
     所以主用 touch 事件；桌面鼠标再走 pointer 那套 */
  box.addEventListener('touchstart',e=>{
    if(selectMode||e.touches.length!==1) return;
    const el=e.target.closest('.msg[data-lpid]'); if(!el) return;
    start(el,e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!swQ||e.touches.length!==1) return;
    move(e.touches[0].clientX,e.touches[0].clientY,e);
  },{passive:false});
  box.addEventListener('touchend',end);
  box.addEventListener('touchcancel',end);

  box.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch') return;            // 触摸交给上面那套
    if(selectMode) return;
    const el=e.target.closest('.msg[data-lpid]'); if(!el) return;
    start(el,e.clientX,e.clientY);
  });
  box.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch') return;
    move(e.clientX,e.clientY,null);
  });
  box.addEventListener('pointerup',e=>{ if(e.pointerType!=='touch') end(); });
  box.addEventListener('pointercancel',e=>{ if(e.pointerType!=='touch') end(); });
}

/* ---------- 键盘：iOS 上键盘弹出后 100vh 不变，底部会空出一条 ----------
   用 visualViewport 把机身高度压到真正可见的那部分 */
let kbInfo={}, kbLog=[], kbApply=null;
function initKeyboardFix(){
  const vv=window.visualViewport;
  if(!vv) return;
  const phone=document.getElementById('phone');
  let raf=0;
  const reset=()=>{
    phone.style.height='';
    phone.classList.remove('kbup');
    document.body.classList.remove('kbup');
  };
  const pin=()=>{
    // 直接钉在可视视口上：不管浏览器是哪种模式，vv 描述的永远是真正看得见的那块。
    // max-width/max-height 也要解开，否则 400×868 的上限会重新切出空白
    phone.style.position='fixed';
    phone.style.top=vv.offsetTop+'px';
    phone.style.left=vv.offsetLeft+'px';
    phone.style.width=vv.width+'px';
    phone.style.height=vv.height+'px';
    phone.style.maxWidth='none';
    phone.style.maxHeight='none';
    phone.classList.add('kbup');
    document.body.classList.add('kbup');
  };
  const unpin=()=>{
    phone.style.position=''; phone.style.top=''; phone.style.left=''; phone.style.width='';
    phone.style.maxWidth=''; phone.style.maxHeight='';
  };
  const apply=()=>{
    raf=0;
    const mode=S.kbMode||'auto';
    // 用布局视口（html 的 clientHeight）当基准，不要用 window.innerHeight ——
    // 有的浏览器键盘弹出后 innerHeight 不变，但布局视口其实已经被自己压过了
    const layoutH=document.documentElement.clientHeight;
    const kb=Math.max(0,layoutH-vv.height-vv.offsetTop);
    kbInfo={inner:window.innerHeight,layout:layoutH,vv:Math.round(vv.height),
            off:Math.round(vv.offsetTop),kb:Math.round(kb)};
    // 视口每次明显变化都留一条，事后才能看到键盘弹起那一刻的数
    const prev=kbLog[kbLog.length-1];
    if(!prev||Math.abs(prev.vv-kbInfo.vv)>20||Math.abs(prev.layout-kbInfo.layout)>20){
      kbLog.push({...kbInfo,at:new Date().toTimeString().slice(0,8)});
      if(kbLog.length>10) kbLog.shift();
    }

    kbInfo.mode=mode;

    // 关闭：完全不插手，交给浏览器
    if(mode==='off'){ kbInfo.act='off'; unpin(); reset(); return; }

    // 钉住：无条件贴合可视视口。
    // 之前这里写了 kb>80 才 pin，可浏览器自己压布局时 kb 恒为 0 —— 等于这一档从没生效过
    if(mode==='pin'){
      kbInfo.act='pin';
      pin();
      if(document.getElementById('s-chat').classList.contains('active')) pinChatBottom();
      return;
    }

    // 自动 ① 浏览器自己已经把布局压到键盘之上了（Via、部分安卓内核、支持
    //    interactive-widget 的新浏览器都是这样）—— 这时布局高度已经约等于可视高度。
    //    我们再压一次就是压两遍，底下会空出一条，露出浏览器自己的背景色。
    if(kb<=80){ kbInfo.act='让浏览器管'; unpin(); reset(); return; }

    // 自动 ② 浏览器没管（iOS Safari 这类）—— 由我们把机身压到可视区
    kbInfo.act='本程序压高度';
    unpin();
    phone.style.height=vv.height+'px';
    phone.classList.add('kbup');
    document.body.classList.add('kbup');
    if(document.getElementById('s-chat').classList.contains('active')) pinChatBottom();
  };
  kbApply=apply;                       // 切档后要能立刻重算，不能干等视口事件
  const on=()=>{ if(!raf) raf=requestAnimationFrame(apply); };
  vv.addEventListener('resize',on);
  vv.addEventListener('scroll',on);
  window.addEventListener('resize',on);          // 小窗 ↔ 全屏切换只会触发这个
  window.addEventListener('orientationchange',()=>setTimeout(apply,260));
  // 切换过程中浏览器分几帧报尺寸，补几拍才不会停在中间态
  ['resize','orientationchange'].forEach(ev=>
    window.addEventListener(ev,()=>{ setTimeout(apply,120); setTimeout(apply,400); }));
  apply();
}

function kbDiag(){
  const vv=window.visualViewport;

  // 记录里 vv 最小的那条，就是键盘顶得最高的时候
  const low=kbLog.length?kbLog.reduce((a,b)=>b.vv<a.vv?b:a):null;
  const lines=[

      :'  （还没记到 —— 先去聊天页点一下输入框把键盘调出来，再回来点这里）',
    '',
    low&&low.vv<now.vv-40
      ? `【结论】键盘顶起时 vv=${low.vv}、layout=${low.layout}、算出 kb=${low.kb}\n`+
        (low.kb<=80
          ? '  → 布局视口跟着一起变矮了，说明浏览器自己会处理，本程序没有介入。正确。'
          : '  → 布局视口没变矮，由本程序把机身压到了可视高度。')
      : '【结论】还没记录到键盘弹起 —— 去聊天页点开输入框，等键盘完全弹出，再回来点这里。',
    '',
    'ua: '+navigator.userAgent.slice(0,110)
  ].join('\n');
  try{ navigator.clipboard&&navigator.clipboard.writeText(lines); }catch(e){}
  alert('键盘诊断（已复制）\n\n'+lines);

/* ---------- 背景亮度检测：决定沉浸模式用浅色还是深色前景 ---------- */
const bgToneCache={};
function bgTone(src){
  if(!src) return Promise.resolve('dark');
  const k=src.length+'_'+src.slice(-24);
  if(bgToneCache[k]) return Promise.resolve(bgToneCache[k]);
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const w=24,h=48;
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d'); cx.drawImage(img,0,0,w,h);
        const d=cx.getImageData(0,0,w,h).data;
        const lum=(y0,y1)=>{let t=0,n=0;
          for(let y=y0;y<y1;y++) for(let x=0;x<w;x++){
            const i=(y*w+x)*4;
            t+=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255; n++; }
          return t/n; };
        // 上下两条是导航栏/输入栏所在区域，权重更高；再算上遮罩的影响
        const top=lum(0,7), bot=lum(h-8,h), mid=lum(7,h-8);
        const chrome=(top+bot)/2*0.7+mid*0.3;
        // 深色遮罩会把亮度再压掉约 4 成；只有本来就很亮才需要翻成深色前景
        const tone=chrome*0.62>0.55?'light':'dark';
        bgToneCache[k]=tone; res(tone);
      }catch(e){ res('dark'); }
    };
    img.onerror=()=>res('dark');
    img.src=src;
  });
}

  const t=await bgTone(src);
  document.getElementById('phone').classList.toggle('lightbg',t==='light');
}

/* 够用的 markdown 渲染：标题 / 列表 / 表格 / 代码块 / 行内格式 */
function mdRender(src){
  const esc2=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inline=x=>esc2(x)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const lines=src.split('\n');
  const out=[];
  let i=0, inCode=false, code=[];
  const flushCode=()=>{ if(code.length){ out.push('<pre><code>'+esc2(code.join('\n'))+'</code></pre>'); code=[]; } };
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){ if(inCode){ flushCode(); inCode=false; } else inCode=true; i++; continue; }
    if(inCode){ code.push(L); i++; continue; }
    if(/^\s*$/.test(L)){ i++; continue; }
    if(/^---+\s*$/.test(L)){ out.push('<hr>'); i++; continue; }
    let m;
    if((m=L.match(/^(#{1,4})\s+(.*)$/))){
      const lv=Math.min(4,m[1].length+1);
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue;
    }
    if(/^>\s?/.test(L)){
      const buf=[];
      while(i<lines.length&&/^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>'); continue;
    }
    if(/^\s*\|/.test(L)&&/^\s*\|/.test(lines[i+1]||'')&&/-{2,}/.test(lines[i+1]||'')){
      const cells=x=>x.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(y=>y.trim());
      const head=cells(L); i+=2;
      const rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw2"><table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')
        +'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')
        +'</tbody></table></div>'); continue;
    }
    if(/^\s*[-*]\s+/.test(L)||/^\s*\d+\.\s+/.test(L)){
      const ord=/^\s*\d+\./.test(L);
      const buf=[];
      while(i<lines.length&&(/^\s*[-*]\s+/.test(lines[i])||/^\s*\d+\.\s+/.test(lines[i]))){
        buf.push(lines[i].replace(/^\s*(?:[-*]|\d+\.)\s+/,'')); i++;
      }
      out.push(`<${ord?'ol':'ul'}>`+buf.map(x=>`<li>${inline(x)}</li>`).join('')+`</${ord?'ol':'ul'}>`);
      continue;
    }
    const buf=[L];
    i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*\||>|---)/.test(lines[i])){
      buf.push(lines[i]); i++;
    }
    out.push('<p>'+inline(buf.join('\n')).replace(/\n/g,'<br>')+'</p>');
  }
  flushCode();
  return out.join('\n');
}

/* 酒馆预设：prompts[] 里带 marker 的是占位符（chatHistory / charDescription…），跳过；
   role=user 的塞到对话最后，其余当成规则 */
function parsePresetJSON(j,fallbackName){
  const name=String(j.name||j.preset_name||fallbackName||'导入的预设').slice(0,24);
  let src=[];
  if(Array.isArray(j.prompts)) src=j.prompts;
  else if(Array.isArray(j.items)) src=j.items;
  else if(Array.isArray(j)) src=j;
  const items=[];
  for(const x of src){
    if(!x||x.marker) continue;
    const content=String(x.content||x.prompt||'').trim();
    if(!content) continue;
    let pos=x.pos&&PRESET_POS.some(p=>p.k===x.pos)?x.pos
      :(x.role==='user'?'jb':(x.injection_position===1?'end':'rules'));
    items.push({id:uid(),name:String(x.name||x.identifier||'未命名').slice(0,24),
      content:content.slice(0,4000),pos,
      on:x.on!==undefined?!!x.on:(x.enabled!==false)});
  }
  return {id:uid(),name,items:items.slice(0,40)};
}

/* EVE 里有的 content 不是字符串，而是多模态数组 [{type:'text',text:'…'},{type:'image_url'…}] */
function eveText(v){
  if(v==null) return '';
  if(typeof v==='string') return v;
  if(Array.isArray(v))
    return v.map(x=>typeof x==='string'?x:(x&&(x.text||x.content)||'')).filter(Boolean).join('');
  if(typeof v==='object') return String(v.text||v.content||'');
  return String(v);
}
/* EVE 的一条消息 -> 小手机的消息 */
function eveMsg(m,cid){
  const md=m.messageData||{};
  const role=md.sender==='sent'?'user':'assistant';
  const t=md.type||'';
  const base={id:'eve_'+(md.id||m.id),characterId:cid,role,
    timestamp:m.timestamp||md.timestamp||Date.now(),meta:{}};
  // 系统提示类（撤回提示、通话记录、邀请…）统一转成本地的"系统行"
  if(md.sender==='system'){
    if(t==='recalled_message')
      return {...base,role:'assistant',type:'text',
        content:eveText(md.originalContent)||eveText(md.content),
        recalled:true,recalledAt:base.timestamp};
    return null;   // 通话记录/邀请这类提示不导，避免噪音
  }
  if(t==='voice_message'){ const vc=eveText(md.content);
    return {...base,type:'voice',content:vc,meta:{dur:Math.max(1,Math.round(vc.length/3.6))}}; }
  if(t==='transfer') return {...base,type:'transfer',content:eveText(md.note)||eveText(md.content)||'转账',
    meta:{amount:+md.amount||0,status:'pending'}};
  if(t==='location') return {...base,type:'location',content:md.locationName||'位置',
    meta:{addr:md.coordinates||''}};
  if(t==='ai_image'||t==='user_photo')
    return {...base,type:'fake',
      content:eveText(md.imageDescription)||eveText(md.photoDescription)||eveText(md.content)};
  if(md.isEmoji&&md.emojiDescription)
    return {...base,type:'sticker',content:md.emojiDescription,meta:{}};
  const c=eveText(md.content).trim();
  if(!c) return null;
  return {...base,type:'text',content:c};
}

async function doEveImport(){
  if(!eveData||!evePick) return;
  const src=(eveData.characters||[]).find(c=>c.id===evePick);
  if(!src) return toast('找不到这个角色');
  toast('导入中…');
  try{
    // ① 角色：新建，或并入已有的
    const cid=eveInto||uid();
    if(eveInto){
      const ex=characters.find(x=>x.id===eveInto);
      if(!ex) return toast('目标角色不见了');
    } else {
    const persona=personas[0];
    const ch={id:cid,name:src.name||'导入的角色',bio:src.bio||'',
      avatar:src.avatarUrl||'',images:[],personaId:persona?persona.id:'',
      worldbookIds:[],pinned:false,lastRead:Date.now(),createdAt:Date.now(),
      chat:{...DEFAULT_CHAT}};
    if(src.background) ch.chat.chatBg=src.background;
    await dbPut('characters',ch);
    }

    // ② 记忆：默认不导（多数情况已经手动导过了），勾了才导
    const st=x=>Math.max(1,Math.min(5,Math.round((+x.importance||0.5)*5)));
    let mn=0;
    for(const [arr,ty] of (eveMem?[[eveData.coreMemories||[],'core'],
                           [eveData.episodicMemories||[],'episodic']]:[])){
      for(const m of arr){
        if(m.characterId!==evePick) continue;
        const txt=String(m.fact||m.content||'').trim();
        if(!txt) continue;
        await dbPut('memories',{id:uid(),characterId:cid,type:ty,content:txt,
          importance:st(m),source:'eve',timestamp:m.timestamp||Date.now()});
        mn++;
      }
    }

    // ③ 聊天记录：按时间排序取最近 N 条
    let cn=0;
    if(eveTake>0){
      const all=(eveData.chatMessages||[]).filter(m=>m.characterId===evePick)
        .sort((a,b)=>(a.messageOrder||a.timestamp||0)-(b.messageOrder||b.timestamp||0));
      for(const m of all.slice(-eveTake)){
        const row=eveMsg(m,cid);
        if(!row) continue;
        await dbPut('messages',row);
        cn++;
      }
    }

    characters=await dbAll('characters');
    memories=await dbAll('memories');
    // 已经有记忆了，别让自动提取又把这批对话再嚼一遍
    const cc=characters.find(x=>x.id===cid);
    if(cc){ cc.memAt=cn; await dbPut('characters',cc); characters=await dbAll('characters'); }
    eveData=null; evePick=null;
    toast(`导入完成：${mn} 条记忆、${cn} 条消息`);
    tab('s-chats');
  }catch(e){ toast('导入失败：'+e.message); }
}

/* 白底 / 纯色底的框图自动抠成透明：从四角和正中心做泛洪，和底色接近的连通区域变透明。
   已经有透明像素的（真 PNG）不动。 */
async function frameCutout(src,maxW){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('图片读不出来')); i.src=src; });
  const sc=Math.min(1,(maxW||512)/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
  const id=ctx.getImageData(0,0,w,h), d=id.data, N=w*h;
  let transparent=0;
  for(let i=0;i<N;i+=37){ if(d[i*4+3]<250) transparent++; }
  if(transparent>3) return {src:cv.toDataURL('image/png'),cut:false};
  const bg=[d[0],d[1],d[2]];
  const dist2=(i,c)=>{ const dr=d[i*4]-c[0],dg=d[i*4+1]-c[1],db=d[i*4+2]-c[2]; return dr*dr+dg*dg+db*db; };
  const TH=42*42*3;
  const visited=new Uint8Array(N);
  const seeds=[0,w-1,(h-1)*w,(h-1)*w+w-1,(h>>1)*w+(w>>1)];
  for(const s0 of seeds){
    if(visited[s0]) continue;
    // 种子只有和左上角底色接近才当底：中心落在图案上就不从中心抠
    if(dist2(s0,bg)>TH) continue;
    const stack=[s0]; visited[s0]=1;
    while(stack.length){
      const p=stack.pop(); d[p*4+3]=0;
      const x=p%w, y=(p/w)|0;
      if(x>0){ const q=p-1; if(!visited[q]&&dist2(q,bg)<TH){ visited[q]=1; stack.push(q); } }
      if(x<w-1){ const q=p+1; if(!visited[q]&&dist2(q,bg)<TH){ visited[q]=1; stack.push(q); } }
      if(y>0){ const q=p-w; if(!visited[q]&&dist2(q,bg)<TH){ visited[q]=1; stack.push(q); } }
      if(y<h-1){ const q=p+w; if(!visited[q]&&dist2(q,bg)<TH){ visited[q]=1; stack.push(q); } }
    }
  }
  // 边缘羽化：紧挨着透明区、颜色偏底色的像素给半透明，去掉那圈白边
  const FE=110*110*3;
  for(let p=0;p<N;p++){
    if(visited[p]) continue;
    const x=p%w, y=(p/w)|0;
    const nearT=(x>0&&visited[p-1])||(x<w-1&&visited[p+1])||(y>0&&visited[p-w])||(y<h-1&&visited[p+w]);
    if(!nearT) continue;
    const dd=dist2(p,bg);
    if(dd<FE) d[p*4+3]=Math.round(255*Math.min(1,dd/FE));
  }
  ctx.putImageData(id,0,0);
  return {src:cv.toDataURL('image/png'),cut:true};
}

/* ---------- 字体：文件 / CSS 链接，都缓存进 IndexedDB，之后不联网、不挂梯子也能显示 ---------- */
let fonts=[];
const DEFAULT_FONT_STACK='-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif';
const fmtKB=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
/* 把 CSS 里的 @font-face 拆出来：每块取一个 url（优先 woff2），保留字重 / 样式 / unicode-range */
function parseFontFaces(css,baseUrl){
  const out=[]; const re=/@font-face\s*\{([^}]*)\}/g; let m;
  while((m=re.exec(css))){
    const b=m[1];
    const g=k=>{ const r=new RegExp(k+'\\s*:\\s*([^;]+)','i').exec(b); return r?r[1].trim():''; };
    const urls=[...g('src').matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)(?:\s*format\(\s*["']?([^"')]+)["']?\s*\))?/g)]
      .map(x=>{ try{ return {u:new URL(x[1],baseUrl).href,f:(x[2]||'').toLowerCase()}; }catch(e){ return null; } }).filter(Boolean);
    if(!urls.length) continue;
    const pick=urls.find(x=>/woff2/.test(x.f)||/\.woff2(\?|$)/i.test(x.u))
      ||urls.find(x=>/woff/.test(x.f)||/\.woff(\?|$)/i.test(x.u))||urls[0];
    out.push({family:g('font-family').replace(/^["']|["']$/g,''),weight:g('font-weight')||'normal',
      style:g('font-style')||'normal',unicodeRange:g('unicode-range')||'',url:pick.u});
  }
  return out;
}
/* 把一条字体记录注册进 document.fonts，返回成功的 face 数 */
async function registerFont(rec){
  const faces=rec.kind==='file'?[{blob:rec.blob,weight:'normal',style:'normal'}]:(rec.faces||[]);
  let n=0;
  for(const f of faces){
    if(!f.blob) continue;
    try{
      const desc={weight:f.weight||'normal',style:f.style||'normal'};
      if(f.unicodeRange) desc.unicodeRange=f.unicodeRange;
      const ff=new FontFace(rec.family,await f.blob.arrayBuffer(),desc);
      await ff.load(); document.fonts.add(ff); n++;
    }catch(e){ console.warn('字体加载失败',rec.name,e); }
  }
  return n;
}
let _fontLoaded={};   // id -> 已注册的 face 数
/* 设置页打开时把没注册的字体都注册上，列表里的名字才能用它自己的字体显示 */
let _warming=false;
async function warmFonts(){
  if(_warming) return;
  const todo=fonts.filter(f=>_fontLoaded[f.id]===undefined);
  if(!todo.length) return;
  _warming=true;
  try{ for(const f of todo) _fontLoaded[f.id]=await registerFont(f); }
  finally{ _warming=false; }
  const sc=document.getElementById('s-settings');
  if(sc&&sc.classList.contains('active')) renderSettings();
}
async function applyFont(){
  const root=document.documentElement;
  const rec=fonts.find(f=>f.id===S.fontId);
  const link=document.getElementById('extFontLink');
  if(!rec){ root.style.removeProperty('--font-stack'); if(link) link.remove(); return; }
  if(_fontLoaded[rec.id]===undefined) _fontLoaded[rec.id]=await registerFont(rec);
  if(_fontLoaded[rec.id]>0){
    if(link) link.remove();
    root.style.setProperty('--font-stack',`"${rec.family}",${DEFAULT_FONT_STACK}`);
  }else if(rec.kind==='css'&&rec.url){
    // 一个文件都没缓存到：退回在线引用，联网时才显示
    let l=link;
    if(!l){ l=document.createElement('link'); l.id='extFontLink'; l.rel='stylesheet'; document.head.appendChild(l); }
    l.href=rec.url;
    root.style.setProperty('--font-stack',`"${rec.cssFamily||rec.family}",${DEFAULT_FONT_STACK}`);
  }else{
    root.style.removeProperty('--font-stack'); toast('这个字体文件读不出来');
  }
}

async function addFontCss(){
  let u=prompt('粘贴字体的 CSS 链接（Google Fonts 那种 css2?family=…），或字体文件的直链（.ttf / .woff2）。整段 <link …> 标签贴进来也行：','');
  if(u===null) return; u=u.trim();
  const mh=u.match(/href\s*=\s*["']([^"']+)["']/i); if(mh) u=mh[1];
  const mi=u.match(/url\(\s*["']?([^"')]+)["']?\s*\)/i); if(mi) u=mi[1];
  if(!/^https?:\/\//i.test(u)) return toast('要以 http:// 或 https:// 开头');
  const id=uid(); toast('下载中…');
  try{
    if(/\.(ttf|otf|woff2?)(\?|$)/i.test(u)){
      const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
      const blob=await r.blob();
      const name=decodeURIComponent(u.split('/').pop().split('?')[0]).replace(/\.(ttf|otf|woff2?)$/i,'')||'网络字体';
      await dbPut('fonts',{id,name,kind:'file',family:'uf_'+id,blob,size:blob.size,url:u,at:Date.now()});
    }else{
      const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status);
      const css=await r.text();
      const list=parseFontFaces(css,u);
      if(!list.length) throw new Error('这个 CSS 里没有 @font-face');
      const cssFamily=list[0].family;
      // 并行 6 路下载：Google Fonts 的中文字体是几十个小文件，串行要半分钟
      const faces=new Array(list.length); let size=0, fail=0, done=0, idx=0;
      await Promise.all(Array.from({length:Math.min(6,list.length)},async()=>{
        while(idx<list.length){
          const i=idx++, f=list[i];
          try{ const rr=await fetch(f.url); if(!rr.ok) throw new Error(rr.status);
            const blob=await rr.blob(); size+=blob.size; faces[i]={...f,blob}; }
          catch(e){ fail++; faces[i]={...f,blob:null}; }
          done++; if(done%10===0) toast('下载中 '+done+'/'+list.length);
        }
      }));
      const cached=faces.filter(f=>f.blob).length;
      const nm=u.match(/family=([^&:]+)/i);
      const name=nm?decodeURIComponent(nm[1]).replace(/\+/g,' '):(cssFamily||'网络字体');
      await dbPut('fonts',{id,name,kind:'css',family:'uf_'+id,cssFamily,url:u,faces,size,cached:cached>0,at:Date.now()});
      if(!cached) toast('字体文件下载不了（对方不允许跨域），已改成在线引用，联网才显示');
      else if(fail) toast('缓存了 '+cached+'/'+list.length+' 个字体文件');
    }
    fonts=await dbAll('fonts'); S.fontId=id; await dbPut('settings',S);
    try{ await applyFont(); }catch(e){ toast('字体应用失败：'+e.message); }
    renderSettings(); toast('字体已添加');
  }catch(e){
    toast('添加失败：'+e.message+'。这个站可能不允许跨域下载，把文件下载到本地再用「上传字体文件」');
  }
}

function applyTheme(hex){
  const c=/^#?[0-9a-fA-F]{3,6}$/.test(String(hex||''))?hex:'#7A68F0';
  const rgb=hex2rgb(c);
  const light=mixTo(c,[255,255,255],.16), dark=mixTo(c,[0,0,0],.20);
  const r=document.documentElement.style;
  r.setProperty('--accent',c);
  r.setProperty('--accent-soft',`rgba(${rgb.join(',')},.12)`);
  r.setProperty('--grad',`linear-gradient(165deg,${light} 0%,${dark} 100%)`);
  const meta=document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content',c);
}

/* ---------- 图片裁剪 ---------- */
const CROP_RATIOS=[
  {n:'方形',   r:1},
  {n:'竖屏',   r:9/19.5},
  {n:'3:4',    r:3/4},
  {n:'横幅',   r:3},
  {n:'16:9',   r:16/9},
  {n:'自由',   r:0}
];
let crState=null;
function openCropper(src,opt){
  return new Promise(res=>{
    const img=document.getElementById('crImg');
    crState={src,ratio:opt.ratio||1,maxW:opt.maxW||900,q:opt.q||.85,
      tx:0,ty:0,k:1,base:1,nw:0,nh:0,cw:0,ch:0,resolve:res,free:false};
    document.getElementById('crTitle').textContent=opt.title||'裁剪';
    document.getElementById('crRatios').innerHTML=CROP_RATIOS.map((x,i)=>
      `<span class="${Math.abs((x.r||0)-crState.ratio)<0.01?'on':''}"
        onclick="crSetRatio(${i})">${x.n}</span>`).join('');
    img.onload=()=>{
      crState.nw=img.naturalWidth; crState.nh=img.naturalHeight;
      // 必须先显示再量尺寸，display:none 时 clientWidth 是 0，会算出负数的裁剪窗
      document.getElementById('cropper').classList.add('open');
      void document.getElementById('crStage').offsetHeight;   // 强制 reflow 再量
      crLayout();
    };
    img.onerror=()=>{ toast('图片读不出来'); res(null); };
    img.src=src;
  });
}
function crLayout(){
  const st=crState, stage=document.getElementById('crStage');
  const ph=document.getElementById('phone');
  // 页面隐藏或还没布局时量出来是 0，用机身尺寸兜底
  const SW=stage.clientWidth||ph.clientWidth||360;
  const SH=stage.clientHeight||Math.max(240,ph.clientHeight-160);
  const pad=24;
  let ratio=st.ratio;
  if(!ratio){ ratio=st.nw/st.nh; st.free=true; } else st.free=false;
  // 裁剪窗按比例塞进舞台
  let cw=SW-pad*2, ch=cw/ratio;
  if(ch>SH-pad*2){ ch=SH-pad*2; cw=ch*ratio; }
  st.cw=cw; st.ch=ch;
  const win=document.getElementById('crWin');
  win.style.width=cw+'px'; win.style.height=ch+'px';
  win.style.left=((SW-cw)/2)+'px'; win.style.top=((SH-ch)/2)+'px';
  // 图片基准尺寸 = 刚好盖住裁剪窗
  st.base=Math.max(cw/st.nw,ch/st.nh);
  const img=document.getElementById('crImg');
  img.style.width=(st.nw*st.base)+'px';
  img.style.height=(st.nh*st.base)+'px';
  img.style.left=((SW-st.nw*st.base)/2)+'px';
  img.style.top=((SH-st.nh*st.base)/2)+'px';
  st.k=1; st.tx=0; st.ty=0;
  document.getElementById('crZoom').value=100;
  crApply();
}
function crClamp(){
  const st=crState;
  const dw=st.nw*st.base*st.k, dh=st.nh*st.base*st.k;
  const mx=Math.max(0,(dw-st.cw)/2), my=Math.max(0,(dh-st.ch)/2);
  st.tx=Math.max(-mx,Math.min(mx,st.tx));
  st.ty=Math.max(-my,Math.min(my,st.ty));
}
function crApply(){
  crClamp();
  const st=crState;
  document.getElementById('crImg').style.transform=
    `translate(${st.tx}px,${st.ty}px) scale(${st.k})`;
}
function crSetZoom(k){ crState.k=Math.max(1,Math.min(4,k)); crApply(); }
function crSetRatio(i){
  crState.ratio=CROP_RATIOS[i].r;
  document.querySelectorAll('#crRatios span').forEach((el,j)=>
    el.classList.toggle('on',j===i));
  crLayout();
}
function crCancel(){
  document.getElementById('cropper').classList.remove('open');
  const r=crState&&crState.resolve; crState=null;
  if(r) r(null);
}
function crDone(){
  const st=crState; if(!st) return;
  const scale=st.base*st.k;
  const sw=st.cw/scale, sh=st.ch/scale;
  const sx=(st.nw-sw)/2-st.tx/scale;
  const sy=(st.nh-sh)/2-st.ty/scale;
  const outW=Math.min(st.maxW,Math.round(sw));
  const outH=Math.round(outW*sh/sw);
  const cv=document.createElement('canvas');
  cv.width=outW; cv.height=outH;
  const cx=cv.getContext('2d');
  cx.imageSmoothingQuality='high';
  cx.drawImage(document.getElementById('crImg'),
    Math.max(0,sx),Math.max(0,sy),sw,sh,0,0,outW,outH);
  const out=cv.toDataURL('image/jpeg',st.q);
  document.getElementById('cropper').classList.remove('open');
  const r=st.resolve; crState=null;
  if(r) r(out);
}
/* 拖动 */
(function(){
  let dragging=false,lx=0,ly=0,pinch=0,pk=1;
  const stage=()=>document.getElementById('crStage');
  document.addEventListener('pointerdown',e=>{
    if(!crState) return;
    const st=stage(); if(!st||!st.contains(e.target)) return;
    dragging=true; lx=e.clientX; ly=e.clientY;
    try{ st.setPointerCapture(e.pointerId); }catch(_){}
  });
  document.addEventListener('pointermove',e=>{
    if(!dragging||!crState) return;
    crState.tx+=e.clientX-lx; crState.ty+=e.clientY-ly;
    lx=e.clientX; ly=e.clientY; crApply();
  });
  ['pointerup','pointercancel'].forEach(ev=>
    document.addEventListener(ev,()=>{ dragging=false; }));
  document.addEventListener('wheel',e=>{
    if(!crState) return;
    const st=stage(); if(!st||!st.contains(e.target)) return;
    e.preventDefault();
    crSetZoom(crState.k*(e.deltaY>0?0.94:1.06));
    document.getElementById('crZoom').value=Math.round(crState.k*100);
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    if(!crState||e.touches.length!==2) return;
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);
    if(!pinch){ pinch=d; pk=crState.k; return; }
    crSetZoom(pk*d/pinch);
    document.getElementById('crZoom').value=Math.round(crState.k*100);
  },{passive:false});
  document.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=0; });
})();

/* ---------- 图片 ---------- */
/* opt: {ratio, title} 传了就先进裁剪；不传保持原来的直接压缩 */
function pickImage(cb,maxW=760,q=.82,opt){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  // 挂进 DOM 再点，游离的 input 在部分浏览器里第二次不触发 change
  inp.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0';
  document.body.appendChild(inp);
  const cleanup=()=>{ try{ inp.remove(); }catch(e){} };
  setTimeout(cleanup,120000);
  inp.onchange=()=>{
    const f=inp.files[0];
    if(!f){ cleanup(); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,maxW/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        const out=cv.toDataURL('image/jpeg',q);
        cleanup();
        if(opt&&opt.ratio!==undefined)
          openCropper(rd.result,{ratio:opt.ratio,maxW,q,title:opt.title})
            .then(r=>{ if(r) cb(r); });
        else cb(out);
      };
      img.onerror=()=>{ cleanup(); toast('这张图片读不出来'); };
      img.src=rd.result;
    };
    rd.onerror=()=>{ cleanup(); toast('文件读取失败'); };
    rd.readAsDataURL(f);
  };
  inp.value='';
  inp.click();
}

const DEFAULT_ENTRY={name:'',keys:'',keys2:'',content:'',always:false,enabled:true,
  pos:'after',order:0,prob:100};

/* 兼容旧结构 {keyword,content,always} */
function normEntry(e,i){
  return {...DEFAULT_ENTRY, ...e,
    id:e.id||('e'+i+'_'+Math.random().toString(36).slice(2,6)),
    keys:e.keys!==undefined?e.keys:(e.keyword||''),
    enabled:e.enabled!==false,
    order:e.order!==undefined?e.order:i,
    prob:e.prob===undefined?100:e.prob};
}
const normBook=w=>({scanDepth:6,...w,entries:(w.entries||[]).map(normEntry)
  .sort((a,b)=>a.order-b.order)});

function renderWbList(){
  const box=document.getElementById('wbList');
  box.innerHTML=worldbooks.length
    ? `<div class="listcard">`+worldbooks.map(w=>{
        const on=w.entries.filter(e=>e.enabled).length;
        return `<div class="row" onclick="editWb('${w.id}')">
          <div class="avatar" style="background:var(--accent-soft);color:var(--accent)">
            ${ICO_BOOK.replace('<svg','<svg style="width:24px;height:24px;stroke:currentColor"')}</div>
          <div class="main"><div class="name">${esc(w.name)}${w.global?'<span class="tagmini">全局</span>':''}</div>
            <div class="desc">${on}/${w.entries.length} 条启用 · 扫描最近 ${w.scanDepth} 条</div></div>${CHEV}
        </div>`;}).join('')+`</div>`
    : emptyState(ICO_BOOK,'还没有世界书','点右上角新建：自己写<br>或直接导入酒馆格式的 .json');

function newWb(){
  actionSheet('新建世界书',[
    {ic:'pencil',t:'自己写',fn:()=>editWb(null)},
    {ic:'download',t:'导入酒馆世界书（.json）',fn:()=>importWbFile()}
  ]);
}

function importWbFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const raw=JSON.parse(await f.text());
      const book=parseSTBook(raw,f.name.replace(/\.json$/i,''));
      if(!book.entries.length) return toast('没解析出任何条目，格式可能不支持');
      draftWb=book; editingWbId=null;
      renderWbEdit(); show('s-wbEdit');
      toast(`解析到 ${book.entries.length} 条，确认后点保存`);
    }catch(e){ toast('解析失败：'+e.message); }
  };
  inp.click();
}

/* 兼容多种导出格式：
   1. 酒馆世界书  {entries:{"0":{...}}}
   2. 数组形式    {entries:[...]} / [...]
   3. 角色卡 V2   {character_book:{entries:[...]}} / {data:{character_book:{...}}}  */
function parseSTBook(raw,fallbackName){
  let src=raw, name=fallbackName||'导入的世界书';
  if(src&&src.data&&src.data.character_book) { name=src.data.name||name; src=src.data.character_book; }
  else if(src&&src.character_book){ name=src.name||name; src=src.character_book; }
  if(src&&src.name) name=src.name;

  let list=[];
  if(Array.isArray(src)) list=src;
  else if(src&&Array.isArray(src.entries)) list=src.entries;
  else if(src&&src.entries&&typeof src.entries==='object') list=Object.values(src.entries);
  else if(Array.isArray(raw)) list=raw;

  const toStr=v=>Array.isArray(v)?v.filter(Boolean).join(', '):(typeof v==='string'?v:'');
  const entries=list.map((e,i)=>{
    if(!e||typeof e!=='object') return null;
    const content=String(e.content??e.entry??'').trim();
    if(!content) return null;

    // position: 酒馆用数字（0=角色设定前 1=角色设定后 2+=按深度插）；V2 用字符串
    let pos='after';
    if(e.position===0||e.position==='before_char'||e.position==='before') pos='before';

    const prob=(e.useProbability===false)?100
      :(e.probability===undefined||e.probability===null?100:Math.max(0,Math.min(100,+e.probability||100)));

    return {
      id:uid(),
      name:String(e.comment||e.name||e.title||'').trim(),
      keys:toStr(e.key??e.keys??e.keywords),
      keys2:toStr(e.keysecondary??e.secondary_keys),
      content,
      always:!!(e.constant??e.always),
      enabled:!(e.disable===true||e.enabled===false),
      pos,
      order:(e.order??e.insertion_order??e.displayIndex??i),
      prob
    };
  }).filter(Boolean).sort((a,b)=>a.order-b.order).map((e,i)=>({...e,order:i}));

  const depth=+(src&&(src.scan_depth??src.scanDepth))||6;
  return {id:uid(),name:String(name).slice(0,40),global:false,
    scanDepth:Math.max(1,Math.min(50,depth)),entries};
}

    return `<div class="hitline">
      <span class="dot2" style="background:${r.hit?'var(--ok)':'var(--sub2)'}"></span>
      <span>${esc(e.name||e.keys||'未命名')}</span>

/* 单条命中判定 */
function matchEntry(e,text){
  if(!e.enabled) return {hit:false,why:'已停用'};
  if(!e.content.trim()) return {hit:false,why:'没有内容'};
  if(e.always) return {hit:true,why:'常驻'};
  const k1=e.keys.split(/[,，]/).map(k=>k.trim()).filter(Boolean);
  if(!k1.length) return {hit:false,why:'没有关键词'};
  const got=k1.find(k=>text.includes(k));
  if(!got) return {hit:false,why:'主关键词未命中'};
  const k2=e.keys2.split(/[,，]/).map(k=>k.trim()).filter(Boolean);
  if(k2.length){
    const got2=k2.find(k=>text.includes(k));
    if(!got2) return {hit:false,why:`命中「${got}」但缺次要词`};
    return {hit:true,why:`${got} + ${got2}`};
  }
  return {hit:true,why:got};
}

/* 记忆包格式：
   { "type":"xiaoshouji-memories", "memories":[
       {"type":"core|episodic","content":"…","importance":1-5,"date":"2026-04-24"} ] }
   也吃裸数组，以及 importance 写成 0-100 百分比的情况 */
function importMemories(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const raw=JSON.parse(await f.text());
      const list=Array.isArray(raw)?raw:(raw.memories||raw.data||[]);
      if(!Array.isArray(list)||!list.length) return toast('没解析出记忆条目');

      const have=new Set(memsOf(memCharId).map(m=>m.content.trim()));
      let core=0,epi=0,skip=0;
      for(const it of list){
        if(!it) continue;
        const content=String(it.content||it.text||it.fact||'').trim();
        if(!content){ skip++; continue; }
        if(have.has(content)){ skip++; continue; }
        let imp=+it.importance;
        if(!Number.isFinite(imp)) imp=3;
        else if(imp>5) imp=imp>=90?5:imp>=80?4:imp>=65?3:imp>=50?2:1;   // 百分比
        imp=Math.max(1,Math.min(5,Math.round(imp)));
        const type=(String(it.type||'').toLowerCase().startsWith('epi'))?'episodic':'core';
        let ts=Date.now();
        const d=it.date||it.time;
        if(d){ const p=Date.parse(String(d).replace(/[年月]/g,'-').replace(/日/,'')); if(!isNaN(p)) ts=p; }
        await dbPut('memories',{id:uid(),characterId:memCharId,type,content,
          importance:imp,source:'import',timestamp:ts});
        have.add(content);
        type==='core'?core++:epi++;
      }
      memories=await dbAll('memories');
      renderMemory();
      toast(`导入 ${core} 条核心 / ${epi} 条情景${skip?`，跳过 ${skip} 条重复`:''}`);
    }catch(e){ toast('导入失败：'+e.message); }
  };
  inp.click();
}

async function exportMemories(){
  const c=characters.find(x=>x.id===memCharId);
  const list=memsOf(memCharId).sort((a,b)=>a.timestamp-b.timestamp).map(m=>({
    type:m.type,content:m.content,importance:m.importance,
    date:new Date(m.timestamp).toISOString().slice(0,10)}));
  const data={type:'xiaoshouji-memories',version:1,
    name:(c?c.name:'')+' 的记忆',exportedAt:new Date().toISOString(),memories:list};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=(c?c.name:'记忆')+'_记忆包.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);

async function extractMemories(){

/* 核心：给定角色，从最近 N 条对话里抽记忆存库。返回新增条数，失败返回 -1。
   手动按钮和后台自动提取共用这一份 */
async function runExtract(cid,take){
  const c=characters.find(x=>x.id===cid);
  if(!c) return -1;
  const me=personaOf(c);
  const ms=(await msgsOf(cid)).slice(-(take||40));
  if(ms.length<2) return 0;
  const memCharId=cid;   // 下面的模板沿用这个名字
  try{
    const known=memsOf(memCharId).map(m=>'- '+m.content).join('\n')||'（暂无）';
    const convo=ms.map(m=>(m.role==='user'?me.name:c.name)+'：'+m.content).join('\n');
    const prompt=`你是一个记忆整理器。阅读下面这段对话，提取值得长期记住的信息。

## 两种类型
- **core（核心记忆）**：稳定的事实、偏好、身份、关系状态
- **episodic（情景记忆）**：具体发生过的事件，带情境

## 规则
- 只提取对话里**明确出现**的信息，禁止推测、联想、编造
- 每条 30 字以内，客观陈述，不要文学化描写
- 下面「已有记忆」里已经记过的，不要重复提取
- 如果没有值得记的，返回空数组 []

## 重要度 importance（1-5）
5 = 身份/健康/重大关系　4 = 稳定偏好、长期状态　3 = 一般事实　2 = 次要细节　1 = 可有可无

## 已有记忆
${known}

## 对话
${convo}

只输出 JSON 数组，不要任何解释文字：
[{"type":"core","content":"…","importance":4}]`;
    const raw=await callAPI([{role:'user',content:prompt}]);
    let t=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
    const mm=t.match(/\[[\s\S]*\]/); if(mm) t=mm[0];
    const arr=JSON.parse(t);
    if(!Array.isArray(arr)) throw new Error('返回格式不对');
    const have=new Set(memsOf(memCharId).map(m=>m.content.trim()));
    let added=0;
    for(const it of arr){
      const content=String(it.content||'').trim();
      if(!content||have.has(content)) continue;
      await dbPut('memories',{id:uid(),characterId:memCharId,
        type:(it.type==='episodic')?'episodic':'core', content,
        importance:Math.min(5,Math.max(1,parseInt(it.importance)||3)),
        source:'auto',timestamp:Date.now()});
      have.add(content); added++;
    }
    memories=await dbAll('memories');
    return added;
  }catch(e){
    console.warn('记忆提取失败',e);
    return -1;
  }
}

/* ============================================================
   第二层：滚动摘要（对应 EVE 的 memorySummaries / 工作记忆）
   离散记忆条目是「档案卡片」——他知道你怕什么；
   摘要是「故事线」——他记得你们是怎么走到这一步的。
   EVE 的原文要求：50-100 字、第三人称、重点记录重要事件和情感变化。
   ============================================================ */
const sumsOf=cid=>summaries.filter(x=>x.characterId===cid).sort((a,b)=>b.at-a.at);

async function runSummary(cid,take){
  const c=characters.find(x=>x.id===cid); if(!c) return -1;
  const me=personaOf(c);
  const all=await msgsOf(cid);
  const ms=all.slice(-(take||30));
  if(ms.length<6) return 0;
  try{
    const prev=sumsOf(cid).slice(0,2).map(x=>x.text).join('\n');
    const convo=ms.map(m=>(m.role==='user'?me.name:c.name)+'：'+msgToText(m)).join('\n');
    const p=`你是一个客观的记录员，专门生成简洁的记忆摘要。请直接输出摘要文本，不要使用JSON格式或聊天回复格式。

${prev?`## 之前的摘要（新摘要要接着往下写，不要重复）\n${prev}\n`:''}
## 这段对话
${convo}

请生成一份 50-100 字的客观记忆摘要，要求：
1. 使用第三人称客观描述
2. 用"用户"指代用户，用"${c.name}"指代角色
3. 重点记录重要事件和情感变化
4. 不要使用"我"、"你"等第一、第二人称
5. 直接输出摘要文本，不要JSON格式，不要聊天回复格式

摘要：`;
    const t=(await callAPI([{role:'user',content:p}])).trim().slice(0,300);
    if(!t) return 0;
    await dbPut('summaries',{id:uid(),characterId:cid,text:t,at:Date.now(),n:all.length});
    summaries=await dbAll('summaries');
    // 只留最近几条，老的丢掉（EVE 也会清理过期摘要）
    const keep=Math.max(1,+chatCfg(c).sumKeep||3);
    const mine=sumsOf(cid);
    for(const x of mine.slice(keep)) await dbDel('summaries',x.id);
    summaries=await dbAll('summaries');
    return 1;
  }catch(e){ console.warn('摘要失败',e); return -1; }
}

let sumBusy=false;
async function sumAutoTick(){
  if(sumBusy||sending||!db) return;
  for(const c of characters){
    const g=chatCfg(c);
    if(g.memAuto===false||g.sumAuto===false) continue;
    const every=Math.max(10,+g.sumEvery||30);
    const ms=await msgsOf(c.id);
    if(ms.length<every) continue;
    if(ms.length-(c.sumAt||0)<every) continue;
    sumBusy=true;
    const n=await runSummary(c.id,Math.min(60,ms.length-(c.sumAt||0)+8));
    if(n>=0){ c.sumAt=ms.length; await dbPut('characters',c); characters=await dbAll('characters'); }
    sumBusy=false;
    break;
  }
}

/* ============================================================
   第三层：跨场景 + 挂载（对应 EVE 的 getCrossAppMemories / getMountedMemories）
   ============================================================ */
/* 别的地方发生的事：朋友圈、日记、TA 手机里的聊天、X 互动 —— 汇成一段 */
function crossMemText(char){
  if(chatCfg(char).crossMem===false) return '';
  const bits=[];
  const mm=momentsOf(char.id).slice(0,3);
  if(mm.length) bits.push('朋友圈：'+mm.map(x=>
    (x.author==='user'?'对方发「':'你发「')+String(x.text).slice(0,40)+'」').join('；'));
  const L=char.li;
  if(L&&(L.posts||[]).length)
    bits.push('你的 lithium：'+L.posts.slice(0,2).map(x=>'「'+String(x.text).slice(0,36)+'」').join('；'));
  const xl=(char.xlog||[]).slice(-3);
  if(xl.length) bits.push('X 上：'+xl.map(x=>
    x.kind==='dm'?'私信往来':'评论互动').join('、'));
  const ph=((char.phone||{}).chats||[]).filter(x=>x.last).slice(0,2);
  if(ph.length) bits.push('你和别人：'+ph.map(x=>x.who+'「'+String(x.last).slice(0,26)+'」').join('；'));
  if(!bits.length) return '';
  return `\n\n【其他场景】不是在这个对话里发生的，但你都记得：\n`+bits.map(x=>'- '+x).join('\n');
}

/* 挂载：把和别的角色的记忆也给这个角色看 */
function mountedMemText(char){
  const ids=chatCfg(char).mountIds||[];
  if(!ids.length) return '';
  const out=[];
  for(const id of ids){
    const oc=characters.find(x=>x.id===id);
    if(!oc||oc.id===char.id) continue;
    const top=memsOf(id).filter(m=>m.type==='core')
      .sort((a,b)=>b.importance-a.importance).slice(0,4);
    if(top.length) out.push(`- 关于「${oc.name}」：`+top.map(m=>m.content).join('；'));
  }
  if(!out.length) return '';
  return `\n\n【你也知道的事】这些来自你和其他人的往来：\n`+out.join('\n');
}

/* ---------- 记忆自动提取 ----------
   EVE 的"它记得我"就靠这个：聊够一定轮数就在后台把这段对话嚼成记忆，
   下次对话由 memoryText() 自动注回提示词。用户不用管。 */
let memAutoBusy=false;
async function memAutoTick(){
  if(memAutoBusy||sending||!db||!S.memAuto) return;
  for(const c of characters){
    const _g=chatCfg(c);
    if(_g.memAuto===false) continue;  // 这个角色单独关掉了（比如纯记事用的）
    const every=Math.max(4,+_g.memEvery||+S.memEvery||12);   // 角色级优先
    const ms=await msgsOf(c.id);
    if(ms.length<every) continue;
    const done=c.memAt||0;                    // 上次提取时处理到第几条
    if(ms.length-done<every) continue;        // 又攒够一批才提
    memAutoBusy=true;
    const n=await runExtract(c.id,Math.min(60,ms.length-done+6));
    if(n>=0){
      c.memAt=ms.length;
      await dbPut('characters',c);
      characters=await dbAll('characters');
      // 只有正在看这个角色时才提示，后台默默记就行，别打断你在别处干的事
      if(n&&curCharId===c.id&&document.getElementById('s-chat').classList.contains('active'))
        toast(`记住了 ${n} 件事`);
    }
    memAutoBusy=false;
    break;                                    // 一轮只处理一个角色
  }
}

/* ============================================================
   设置页整理：把每个 .hint 收进对应分组标题旁的小问号里。
   规则：hint 归属最近的上一个 grouptitle（可用 data-tip-for 点名）；
   带 id 的 hint 是动态内容（测试结果、通知状态），留在原地不动。
   ============================================================ */
let _tips=[];
function collapseHints(bodyId){
  const body=document.getElementById(bodyId);
  if(!body) return;
  _tips=[];
  const kids=[...body.children];
  const titles=[];
  const byName={};
  for(const el of kids) if(el.classList.contains('grouptitle')){
    titles.push(el); byName[el.textContent.trim()]=el;
  }
  let lastTitle=null;
  for(const el of kids){
    if(el.classList.contains('grouptitle')){ lastTitle=el; continue; }
    if(!el.classList.contains('hint')||el.id) continue;
    if(el.dataset.keep) continue;
    const target=el.dataset.tipFor?byName[el.dataset.tipFor]:lastTitle;
    if(!target) continue;
    let btn=target.querySelector('.tipbtn');
    if(!btn){
      btn=document.createElement('span');
      btn.className='tipbtn';
      btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.6 2.6 0 114.4 1.9c-.8.7-1.7 1.1-1.7 2.3"/><circle cx="12" cy="16.8" r=".4" fill="currentColor"/></svg>';
      btn.dataset.tip=String(_tips.length);
      _tips.push('');
      btn.onclick=e=>{ e.stopPropagation(); showTip(+btn.dataset.tip,btn); };
      target.appendChild(btn);
    }
    const i=+btn.dataset.tip;
    _tips[i]=(_tips[i]?_tips[i]+'<br><br>':'')+el.innerHTML;
    el.remove();
  }
}
function showTip(i,btn){
  hideTip();
  const pop=document.createElement('div');
  pop.className='tippop'; pop.id='tipPop';
  pop.innerHTML=_tips[i]||'';
  document.getElementById('phone').appendChild(pop);
  const ph=document.getElementById('phone').getBoundingClientRect();
  const r=btn.getBoundingClientRect();
  pop.style.top=(r.bottom-ph.top+8)+'px';
  setTimeout(()=>document.addEventListener('click',hideTip,{once:true}),0);
}
function hideTip(){ const p=document.getElementById('tipPop'); if(p) p.remove(); }

async function testConnection(){
  const base=document.getElementById('s-base').value.trim().replace(/\/+$/,'');
  const key=document.getElementById('s-key').value.trim();
  const model=document.getElementById('s-model').value.trim();
  const res=document.getElementById('testResult'), btn=document.getElementById('s-test');
  if(!base) return toast('先填 API 地址');
  if(!key)  return toast('先填 API Key');
  if(!model) return toast('先填模型名');
  btn.textContent='测试中…'; btn.disabled=true;
  res.innerHTML='正在发送一次最小请求…';
  const t0=performance.now();
  try{
    const r=await fetch(base+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model,messages:[{role:'user',content:'hi'}],max_tokens:5,stream:false})
    });
    const ms=Math.round(performance.now()-t0);
    if(!r.ok){
      let d=''; try{ d=(await r.json()).error?.message||''; }catch(e){}
      const tips={401:'Key 不对或没权限',403:'Key 没有这个模型的权限',404:'地址或模型名不对（检查是否少了 /v1）',
        429:'限流或余额不足',500:'服务端错误',502:'网关错误',503:'服务暂时不可用'}[r.status]||'';
      res.innerHTML=`<b style="color:var(--danger)">✕ 失败 ${r.status}</b>　${esc(tips)}<br>${esc(d||'（接口没有返回错误详情）')}`;
      toast('连接失败 '+r.status);
    }else{
      const j=await r.json();
      const used=j.model||model;
      res.innerHTML=`<b style="color:var(--ok)">✓ 连接成功</b>　${ms}ms<br>实际响应模型：<code>${esc(used)}</code>`;
      toast(`连接成功 · ${ms}ms`);
    }
  }catch(e){
    res.innerHTML=`<b style="color:var(--danger)">✕ 请求发不出去</b><br>${esc(e.message)}<br>
      常见原因：地址写错、跨域被拦、或者网络不通。`;
    toast('请求失败');
  }finally{ btn.textContent='测试连接'; btn.disabled=false; }
}

let modelList=[];
async function fetchModels(){
  const base=document.getElementById('s-base').value.trim().replace(/\/+$/,'');

  if(!base) return toast('先填 API 地址');
  if(!key)  return toast('先填 API Key');
  const btn=document.getElementById('s-fetch'), old=btn.textContent;
  btn.textContent='拉取中'; btn.disabled=true;
  try{
    const r=await fetch(base+'/models',{headers:{'Authorization':'Bearer '+key}});
    if(!r.ok){ let d=''; try{d=(await r.json()).error?.message||''}catch(e){} throw new Error(`${r.status} ${d}`.trim()); }
    const j=await r.json();
    const raw=j.data||j.models||(Array.isArray(j)?j:[]);
    modelList=[...new Set(raw.map(m=>typeof m==='string'?m:(m.id||m.name||'')).filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b));
    if(!modelList.length) throw new Error('接口没有返回任何模型');
    openModelSheet();
  }catch(e){ toast('拉取失败：'+e.message); }
  finally{ btn.textContent=old; btn.disabled=false; }
}

/* 把一条消息渲染成气泡内容 */
function bubbleHTML(m,cfg,isMe){
  const style=`style="${isMe?(cfg.bubbleMe?`background:${cfg.bubbleMe};box-shadow:0 2px 10px ${cfg.bubbleMe}44;`:''):
    (cfg.bubbleTa?`background:${cfg.bubbleTa};`:'')}font-size:${cfg.fontSize}px"`;
  if(m.type==='image'){
    if(m.meta&&m.meta.src)
      return `<div class="bubble img pad0" ${style}>
        <img src="${esc(m.meta.src)}" onclick="event.stopPropagation();openMsgImage('${m.id}')" alt="">
        ${m.meta.real?'<span class="realtag">可识别</span>':''}
        ${m.content?`<div class="cap">${esc(m.content)}</div>`:''}</div>`;
    // 假图：没有真实图片，画一张占位卡 + 描述；角色发的会先显示「拍照中」，失败了点一下重来
    const mt=m.meta||{};
    return `<div class="bubble fake" ${style} ${mt.gen&&!mt.pending?`onclick="event.stopPropagation();retryChatImage('${m.id}')"`:''}>
      <div class="ph">${mt.pending?`<span class="spin"></span><small>拍照中…</small>`
        :`${IC('image',30)}<small>${mt.gen?(mt.genErr?'没生成出来，点一下重试':'点一下生成'):'图片'}</small>`}</div>
      <div class="cap2">${esc(m.content||'（没有描述）')}</div></div>`;
  }
  if(m.type==='voice'){
    const dur=m.meta.dur||Math.max(1,Math.round(m.content.length/3.6));
    const bars=Math.min(14,Math.max(5,Math.round(dur*1.1)));
    const wave=Array.from({length:bars},(_,i)=>
      `<i style="height:${4+((i*7)%11)}px"></i>`).join('');
    return `<div class="bubble voice" ${style} onclick="event.stopPropagation();this.classList.toggle('open')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
      <span class="wave">${wave}</span><span class="dur">${dur}"</span>
      <div class="vtext">${esc(m.content)}</div></div>`;
  }
  if(m.type==='xsh'){
    const x=m.meta||{};
    return `<div class="bubble xsh" ${style}>
      <div class="xh"><b>@${esc(x.who||'?')}</b><span>𝕏</span></div>
      ${x.img?`<img class="xi" src="${esc(x.img)}">`:''}
      <div class="xt">${esc(x.text||'')}</div>
      ${m.content?`<div class="cap">${esc(m.content)}</div>`:''}</div>`;
  }
  if(m.type==='call')
    return `<div class="bubble call" ${style} onclick="event.stopPropagation();showCallLog('${m.id}')">
      ${IC('call',17)}<span>通话 ${esc(m.meta.dur||'')}</span></div>`;
  if(m.type==='transfer'){
    const st=m.meta.status||'pending';
    const cls=st==='accepted'?' done':(st==='rejected'?' rejected':'');
    const foot=st==='accepted'?'已收下':(st==='rejected'?'已退回':(isMe?'等待对方收下':'等你收下'));
    const canAct=!isMe&&st==='pending';
    return `<div class="bubble tf${cls}">
      <div class="tt"><i>${IC('money',18)}</i><div>
        <div class="amt">¥${esc(String(m.meta.amount))}</div>
        <div class="nt2">${esc(m.content||'转账')}</div></div></div>
      ${canAct?`<div class="tfbtns">
        <button onclick="event.stopPropagation();tfAct('${m.id}','accepted')">收下</button>
        <button class="gray" onclick="event.stopPropagation();tfAct('${m.id}','rejected')">退回</button></div>`:''}
      <div class="ft">${IC('check',12)}${foot}</div></div>`;
  }
  if(m.type==='sticker')
    return m.meta&&m.meta.src
      ? `<div class="bubble sticker"><img src="${esc(m.meta.src)}" alt="${esc(m.content)}"></div>`
      : `<div class="bubble" ${style}>[表情包：${esc(m.content)}]</div>`;
  if(m.type==='location')
    return `<div class="bubble loc" ${style}><div class="lmap"></div>
      <div class="ltxt"><div class="lname">${esc(m.content)}</div>
      ${m.meta.addr?`<div class="laddr">${esc(m.meta.addr)}</div>`:''}</div></div>`;
  return `<div class="bubble" ${style}>${esc(m.content)}</div>`;
}

  }
  const box=document.getElementById('chatBody');
  refreshImm(document.querySelector('.screen.active')?.id||'s-chat');
  const prevH=box.scrollHeight, prevTop=box.scrollTop;

  let html=total>chatShown?`<div class="loadmore" onclick="loadMore()">加载更早的 ${Math.min(PAGE,total-chatShown)} 条</div>`:'';
  html+=slice.map(m=>{
    const day=new Date(m.timestamp).toDateString();
    let sep='';
    if(day!==lastDay){ lastDay=day; sep=`<div class="daysep">${fmtTime(m.timestamp)}</div>`; }
    if(m.type==='scene'){ html+=sep+`<div class="daysep scene">— ${esc(m.content)} —</div>`; return; }
    const isMe=m.role==='user';
    if(m.recalled)
      return sep+`<div class="sysline" data-lp="recallMenu" data-lpid="${m.id}"
        ${selectMode?'':`onclick="peekRecalled('${m.id}')"`}>
        ${isMe?'你':esc(c.name)}撤回了一条消息<b>点击查看</b></div>`;
    const q=m.quote?`<div class="quote"><b>${esc(m.quote.name)}</b>${esc(m.quote.text)}</div>`:'';
    const rc=(m.reactions&&m.reactions.length)
      ?`<div class="reacts">${m.reactions.map((r,ri)=>
        `<span onclick="event.stopPropagation();rmReact('${m.id}',${ri})">${esc(r)}</span>`).join('')}</div>`:'';
    const hasR=rc?' hasreact':'';
    return sep+`<div class="msg ${isMe?'me':''}${hasR}" data-lp="msgMenu" data-lpid="${m.id}"
      ${selectMode?`onclick="toggleSel('${m.id}')"`:''}>
      <span class="selbox ${selected.has(m.id)?'on':''}"></span>
      <div class="av${isMe?'':' pv'}" ${isMe?'':`onclick="event.stopPropagation();showPov('${m.id}')"`}>${avatarHTML(isMe?me.avatar:c.avatar)}</div>
      <div class="msgwrap"><span class="bwrap">${q?`<div class="bubble" style="font-size:${cfg.fontSize}px;${
        isMe?(cfg.bubbleMe?`background:${cfg.bubbleMe};color:#fff`:''):(cfg.bubbleTa?`background:${cfg.bubbleTa};color:#fff`:'')}">${q}${esc(m.content)}</div>`
        :bubbleHTML(m,cfg,isMe)}${rc}</span></div>
      ${m.fav?`<span class="favstar">${IC('star',13,1)}</span>`:''}</div>`;
  }).join('');
  if(lastFail) html+=`<div class="failbar"><span class="t">${esc(lastFail)}</span>
    <b onclick="copyFail()">复制</b><b onclick="retry()">重试</b></div>`;
  box.innerHTML=html;
  if(typingOn){ const t=typingOn; typingOn=false; setTyping(t); }
  if(toBottom!==false) pinChatBottom();
  else box.scrollTop=box.scrollHeight-prevH+prevTop;
  onChatScroll();
  if(selectMode) updateSelBar();
}

/* ---------- 手动拆 / 合 ----------
   自动兜底会漏（比如没有标点的长句），留个手动出口 */
/* 手动拆分的分级兜底：句末标点 → 换行 → 逗号/分号/破折号。
   自动兜底要保守（不能见逗号就断），但手动是用户主动要拆，能拆开才是本分 */
function splitHard(t){
  const s0=String(t||'').trim();
  let a=splitSentences(s0);
  if(a.length>1) return a;
  a=s0.split(/(?:\r)?\n+/).map(x=>x.trim()).filter(Boolean);
  if(a.length>1) return a;
  // 句末标点一个都没有的长句：按逗号类切，标点跟着前半句
  const out=[]; let buf='', depth=0, dq=false;
  for(let i=0;i<s0.length;i++){
    const ch=s0[i]; buf+=ch;
    if(ch==='"'||ch==="'") dq=!dq;
    else if('（(【“「《'.includes(ch)) depth++;
    else if('）)】”」》'.includes(ch)) depth=Math.max(0,depth-1);
    else if(depth===0&&!dq&&'，,；;'.includes(ch)){
      const v=buf.trim(); if(v.length>=6){ out.push(v); buf=''; }
    }
  }
  const tail=buf.trim(); if(tail) out.push(tail);
  return out.length>1?out:[s0];
}
async function splitMsg(id){
  const ms=await msgsOf(curCharId), m=ms.find(x=>x.id===id);
  if(!m) return;
  const parts=splitHard(m.content);
  if(parts.length<2) return toast('这条实在拆不开：整句没有任何标点');
  // 第一段占用原消息，其余按 1ms 递增插在后面，保证顺序
  m.content=parts[0];
  await dbPut('messages',m);
  for(let i=1;i<parts.length;i++)
    await dbPut('messages',{...m,id:uid(),content:parts[i],
      timestamp:m.timestamp+i,quote:null,fav:false,react:null});
  await renderChat(false);
  toast(`拆成了 ${parts.length} 条`);
}
async function mergeMsg(id){
  const ms=await msgsOf(curCharId);
  const i=ms.findIndex(x=>x.id===id);
  const a=ms[i], b=ms[i+1];
  if(!a||!b||b.role!==a.role) return toast('下面没有同一个人的消息');
  a.content=String(a.content).trim()+String(b.content).trim();
  await dbPut('messages',a);
  await dbDel('messages',b.id);
  await renderChat(false);
  toast('已合并');
}

/* 挂载别的角色的记忆 */
function renderCsMount(){
  const box=document.getElementById('cs-mount'); if(!box) return;
  const set=new Set(draftCfg.mountIds||[]);
  const others=characters.filter(c=>c.id!==curCharId);
  box.innerHTML=others.length
    ? others.map(c=>`<span class="chip ${set.has(c.id)?'on':''}" data-id="${c.id}"
        onclick="this.classList.toggle('on');syncCsMount()">${esc(c.name)}
        <b style="font-weight:500;opacity:.6;margin-left:5px">${memsOf(c.id).length}</b></span>`).join('')
    : `<div class="hint" style="margin:0 0 8px;padding:0 2px">还没有别的角色</div>`;
}
function syncCsMount(){
  draftCfg.mountIds=[...document.querySelectorAll('#cs-mount .chip.on')].map(e=>e.dataset.id);
}

/* 聊天设置里的世界书挂载区 */
function renderCsWb(){
  const c=characters.find(x=>x.id===curCharId);
  const set=new Set(draftCfg._wbs||c.worldbookIds||[]);
  const local=worldbooks.filter(w=>!w.global), globals=worldbooks.filter(w=>w.global);
  document.getElementById('cs-wbs').innerHTML=local.length
    ? local.map(w=>`<span class="chip ${set.has(w.id)?'on':''}" data-id="${w.id}"
        onclick="this.classList.toggle('on');syncCsWb()">${esc(w.name)}
        <b style="font-weight:500;opacity:.6;margin-left:5px">${w.entries.length}条</b></span>`).join('')
    : `<div class="hint" style="margin:0 0 8px;padding:0 2px">还没有可挂载的世界书，去「世界书」页建一本</div>`;

/* ---------- 角色主动发消息 ---------- */
async function proactiveTick(){
  if(sending||!db) return;
  const today=new Date().toDateString();
  for(const c of characters){
    const g=chatCfg(c);
    if(!g.proEnabled) continue;
    const log=c.proLog||{};
    if(log.date===today&&(log.count||0)>=g.proDaily) continue;
    const ms=await msgsOf(c.id);
    if(!ms.length) continue;
    const last=ms[ms.length-1];
    if(Date.now()-last.timestamp < g.proMinutes*60000) continue;
    try{ await proactiveSend(c,ms,g); }catch(e){ console.warn('主动消息失败',e); }
    break; // 一轮只处理一个，避免同时打一堆请求
  }
}
async function proactiveSend(c,ms,g){
  const history=historyFor(c,ms);
  const gapMin=Math.floor((Date.now()-ms[ms.length-1].timestamp)/60000);
  const gap=gapMin>=1440?`${Math.floor(gapMin/1440)}天`:gapMin>=60?`${Math.floor(gapMin/60)}小时`:`${gapMin}分钟`;
  const sys=buildSystemPrompt(c,history)+`

# **本次任务：主动发起对话**
对方已经 ${gap} 没有跟你说话了。现在由**你**主动发消息过去。
- 可以是关心、分享自己刚才在做什么、想起一件事、或者只是想找 TA 说话
- 要符合你的性格和你们现在的关系，不要客套、不要像客服
- 不要问"你还在吗"这种空话，说点具体的
- 仍然遵守上面的 JSON 数组格式`;
  const payload=[{role:'system',content:sys},...toApiMessages(history)];
  let parts=parseReply(await callAPI(payload));
  const _pv=parts.find(p=>p.type==='pov');
  parts=parts.filter(p=>p.type!=='pov'&&p.type!=='recall'&&p.type!=='transfer_action');
  if(!parts.length) return;
  for(const p of parts){
    const row={id:uid(),characterId:c.id,role:'assistant',...toMsg(p),timestamp:Date.now()};
    if(_pv) row.meta={...row.meta,pov:String(_pv.content||'').slice(0,300)};
    await dbPut('messages',row);
    if(row.type==='image') genChatImage(row.id);
  }
  const today=new Date().toDateString();
  const log=c.proLog||{};
  c.proLog={date:today,count:(log.date===today?(log.count||0):0)+1,lastAt:Date.now()};
  await dbPut('characters',c);
  characters=await dbAll('characters');
  pushNotify(c,parts.map(x=>x.content||x).join(' ').slice(0,120),true);
  if(curCharId===c.id) await renderChat();
  else if(document.getElementById('s-chats').classList.contains('active')) renderChatList();
}

/* 缩到 240px 存 dataURL。网络图跨域画不了 canvas 时保留原 URL（显示没问题，模型只认描述） */
function shrinkSticker(src){
  return new Promise(res=>{
    const img=new Image();
    if(!String(src).startsWith('data:')) img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const sc=Math.min(1,240/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/png'));
      }catch(e){ res(String(src).startsWith('data:')?null:src); }
    };
    img.onerror=()=>res(String(src).startsWith('data:')?null:src);
    img.src=src;
  });
}
/* 打包文件：小手机自己的 {type:'stickerPack',stickers:[{name,src}]}；
   EVE 的 {library,emojis,libraryItems}；裸数组 [{name,src}]；整机备份里的 stickers 也认 */
function packItemsFrom(j){
  if(Array.isArray(j)) return j;
  if(j&&Array.isArray(j.stickers)) return j.stickers;
  if(j&&Array.isArray(j.emojis)){
    let list=j.emojis;
    if(Array.isArray(j.libraryItems)&&j.libraryItems.length){
      const ids=new Set(j.libraryItems.map(x=>String(x.emojiId)));
      const sub=list.filter(e=>ids.has(String(e.id)));
      if(sub.length) list=sub;
    }
    return list;
  }
  return null;
}
function importStickerPack(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    toast('读取中…');
    try{
      const j=JSON.parse(await f.text());
      const items=packItemsFrom(j);
      if(!items) throw new Error('不认识这个文件的格式');
      const have=new Set(stickers.map(x=>x.name+'|'+x.src));
      let n=0,skip=0,bad=0;
      for(const e of items){
        if(!e) continue;
        const name=String(e.name||e.description||e.desc||e.text||'').trim().slice(0,20);
        const rawSrc=e.src||e.url||e.data||e.dataUrl||e.imageUrl||e.image||'';
        if(!name||!rawSrc){ bad++; continue; }
        const src=await shrinkSticker(rawSrc);
        if(!src){ bad++; continue; }
        if(have.has(name+'|'+src)){ skip++; continue; }
        await dbPut('stickers',{id:uid(),name,src,createdAt:Date.now()});
        have.add(name+'|'+src); n++;
      }
      stickers=await dbAll('stickers'); renderStickers();
      toast(`导入 ${n} 张`+(skip?`，跳过重复 ${skip}`:'')+(bad?`，${bad} 条读不出图`:''));
    }catch(e){ toast('导入失败：'+e.message); }
  };
  inp.click();
}
function exportStickerPack(){
  const pack={app:'小手机',type:'stickerPack',version:1,exportedAt:new Date().toISOString(),

  toast('已导出 '+stickers.length+' 张');
}

/* 定时自动写日记：每分钟跟主动消息一起检查 */
async function autoDiaryTick(){
  if(sending||!db) return;
  const h=new Date().getHours(), d=today();
  for(const c of characters){
    const g=diaryCfg(c);
    if(!g.auto||h<g.hour) continue;
    if(diaries.some(x=>x.characterId===c.id&&x.date===d&&x.who==='char')) continue;
    const ms=await msgsOf(c.id);
    if(!ms.some(m=>new Date(m.timestamp).toDateString()===new Date().toDateString())) continue;
    const keep=curCharId; curCharId=c.id;
    await askDiary(true);
    curCharId=keep;
    break;
  }
}

const MOODS=['😊','🥰','😌','🤩','😐','😑','😔','😢','😠','😰','😴','🤒'];
const moodOf=(cid,date,who)=>moods.find(m=>m.characterId===cid&&m.date===date&&m.who===who);
let moodMonth=null;
function openMood(){ moodMonth=null; goTo('s-mood',renderMood); }
function shiftMonth(d){
  const base=moodMonth?new Date(moodMonth+'-01'):new Date();
  base.setMonth(base.getMonth()+d);
  moodMonth=base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
  renderMood();
}
function renderCalendar(cid,me,c){
  const now=new Date();
  const ym=moodMonth||(now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  const [Y,M]=ym.split('-').map(Number);
  const first=new Date(Y,M-1,1), days=new Date(Y,M,0).getDate();
  const lead=first.getDay();
  const isNow=(Y===now.getFullYear()&&M===now.getMonth()+1);
  const cells=[];
  for(let i=0;i<lead;i++) cells.push('<div class="calday blank"></div>');
  const tally={};
  for(let d=1;d<=days;d++){
    const ds=`${Y}-${String(M).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const a=moodOf(cid,ds,'user'), b=moodOf(cid,ds,'char');
    if(a) tally[a.emoji]=(tally[a.emoji]||0)+1;
    if(b) tally[b.emoji]=(tally[b.emoji]||0)+1;
    const isToday=isNow&&d===now.getDate();
    cells.push(`<div class="calday ${isToday?'today':''}" onclick="moodDay('${ds}')">
      <span class="dn">${d}</span>
      <span class="e1">${a?a.emoji:''}</span><span class="e2">${b?b.emoji:''}</span></div>`);
  }
  const top=Object.entries(tally).sort((x,y)=>y[1]-x[1]).slice(0,5);
  return `<div class="calhead">
      <div class="calnav" onclick="shiftMonth(-1)">${IC('chevL',16)}</div>
      <b>${Y} 年 ${M} 月</b>
      <div class="calnav ${isNow?'off':''}" onclick="shiftMonth(1)">${IC('chevR',16)}</div>
    </div>
    <div class="calgrid">${['日','一','二','三','四','五','六'].map(w=>
      `<div class="calw">${w}</div>`).join('')}${cells.join('')}</div>
    ${top.length?`<div class="calstat">${top.map(([e,n])=>
      `<span class="cs">${e}<b>${n}</b></span>`).join('')}</div>`:''}
    <div class="callegend">每格上面是${esc(me.name)}，下面是${esc(c.name)}。点格子可以补记那天的心情。</div>`;
}
