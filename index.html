<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0A0A0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<link rel="manifest" href='data:application/manifest+json,{"name":"%E5%B0%8F%E6%89%8B%E6%9C%BA","short_name":"%E5%B0%8F%E6%89%8B%E6%9C%BA","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%230A0A0C","theme_color":"%230A0A0C"}'>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小手机</title>
<style>
:root{
  --font-stack:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --bg:#F2F2F7; --card:#FFFFFF;
  --text:#0B0B0F; --sub:#8A8A8E; --sub2:#B6B6BB;
  --line:rgba(60,60,67,.10); --line2:rgba(60,60,67,.16);
  --accent:#7A68F0; --accent-soft:rgba(122,104,240,.12);
  --grad:linear-gradient(165deg,#8E7BF8 0%,#6A56E8 100%);
  --bubble-ta:#FFFFFF; --bubble-ta-text:#0B0B0F;
  --chat-bg:linear-gradient(180deg,#F6F3FF 0%,#F2F2F7 42%,#F2F2F7 100%);
  --nav:rgba(255,255,255,.78);
  --shadow-s:0 1px 3px rgba(16,14,40,.07);
  --danger:#FF3B30; --ok:#34C759;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --card:#1B1B1F;
    --text:#F5F5F7; --sub:#8E8E93; --sub2:#5C5C61;
    --line:rgba(120,120,128,.20); --line2:rgba(120,120,128,.30);
    --accent:#9A8AFF; --accent-soft:rgba(154,138,255,.16);
    --bubble-ta:#26262C; --bubble-ta-text:#F5F5F7;
    --chat-bg:linear-gradient(180deg,#16122B 0%,#0A0A0F 46%,#000 100%);
    --nav:rgba(22,22,26,.76);
    --shadow-s:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A0A0C}
@media (prefers-color-scheme:light){ html{background:#E7E5EF} }
html,body{height:100%;margin:0;overscroll-behavior:none}
body.kbup{align-items:flex-start}
/* 兜底：机身没铺满时，露出来的是 body 自己的底色，不是浏览器的背景。
   之前绿条就是因为这块交给浏览器画了 */
body{background:var(--bg)!important}
@media (prefers-color-scheme:dark){ body{background:#0A0A0C!important} }
/* 注意：这里不要用 100dvh，也不要在 viewport meta 里写 interactive-widget=resizes-content。
   两者都会让浏览器把页面缩到键盘之上 —— 一旦它算多了，缝隙里露出的是浏览器自己的底色，
   页面完全涂不到（Via 上就是一条绿带）。保持 height:100%，让键盘盖在页面上，
   缝隙在物理上就不可能出现，再由 initKeyboardFix 把内容顶上去。 */
body{background:#0A0A0C;color:var(--text);
  font:15px/1.5 var(--font-stack);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
@media (prefers-color-scheme:light){ body{background:#E7E5EF} }

#phone{width:100%;max-width:400px;height:100%;max-height:868px;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:440px) and (min-height:900px){
  #phone{height:100%;border-radius:46px;box-shadow:0 0 0 2px rgba(255,255,255,.09),0 0 0 11px #16161A,
    0 0 0 12px rgba(0,0,0,.5),0 30px 70px -12px rgba(0,0,0,.55)}
  #island{display:block}
}
#island{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:96px;height:27px;background:#000;border-radius:16px;z-index:60;pointer-events:none}

#statusbar{flex:0 0 auto;height:46px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 7px;font-size:13.5px;font-weight:600;letter-spacing:.2px;
  position:relative;z-index:50;color:var(--text);background:var(--nav);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
#statusbar .icons{display:flex;align-items:center;gap:5px;opacity:.9}
#statusbar svg{display:block}

#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex}
.screen.overlay{z-index:20;animation:slideIn .26s cubic-bezier(.32,.72,0,1)}
@keyframes slideIn{from{transform:translateX(22px);opacity:.4}to{transform:none;opacity:1}}

.navbar{flex:0 0 auto;height:46px;display:flex;align-items:center;padding:0 8px;background:var(--nav);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--line);position:relative;z-index:10}
.navbar .title{position:absolute;left:0;right:0;text-align:center;font-size:16px;font-weight:600;
  letter-spacing:-.2px;pointer-events:none}
.navbar button{background:none;border:none;color:var(--accent);font:inherit;font-size:16px;
  padding:8px 10px;cursor:pointer;position:relative;z-index:2;border-radius:10px;transition:opacity .15s}
.navbar button:active{opacity:.45}
.navbar .sp{flex:1}
.navbar .lead{display:flex;align-items:center;gap:2px}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#phone *{scrollbar-width:thin;scrollbar-color:rgba(125,125,145,.3) transparent}
#phone *::-webkit-scrollbar{width:2.5px;height:2.5px}
#phone *::-webkit-scrollbar-thumb{background:rgba(125,125,145,.32);border-radius:2px}
#phone *::-webkit-scrollbar-track{background:transparent}
#phone .body{scrollbar-width:none}
#phone .body::-webkit-scrollbar{width:0;height:0}
#chatInput{scrollbar-width:none}
#chatInput::-webkit-scrollbar{width:0;height:0}
.body::-webkit-scrollbar{width:0;height:0}
.body.pad{padding:16px 16px 40px}

.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-s);overflow:hidden;margin-bottom:18px}
.grouptitle{font-size:12.5px;color:var(--sub);letter-spacing:.4px;margin:2px 0 8px 14px;font-weight:500}
.secband{display:flex;align-items:center;gap:12px;margin:30px 2px 16px;
  font-size:13.5px;font-weight:700;letter-spacing:2.5px;color:var(--text)}
.secband:first-child{margin-top:4px}
.secband::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--grad)}
.secband::after{content:"";flex:1;height:.5px;background:var(--line2)}
#phone.himm .secband{color:var(--hfg);text-shadow:var(--hsh)}
#phone.himm .secband::after{background:var(--hline)}
.cell{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;cursor:pointer}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.cell:active{background:var(--accent-soft)}
.cell.static{cursor:default}.cell.static:active{background:none}
.cell .lbl{flex:1;font-size:15.5px}
.cell .val{color:var(--sub);font-size:15px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{width:8px;height:13px;flex:0 0 auto;opacity:.32}

.row{display:flex;align-items:center;gap:13px;padding:11px 16px;position:relative;cursor:pointer;
  user-select:none;-webkit-user-select:none}
.row+.row::before{content:"";position:absolute;top:0;left:74px;right:0;height:.5px;background:var(--line)}
.row:active{background:var(--accent-soft)}
.row.pin{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.avatar{width:50px;height:50px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:23px;color:#fff;
  box-shadow:0 2px 8px rgba(106,86,232,.22)}
.avatar img{width:100%;height:100%;object-fit:cover}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;font-size:16px;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
.row .name .pinico{font-size:11px;opacity:.5}
.tagmini{font-size:10.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);
  padding:1.5px 7px;border-radius:8px;flex:0 0 auto}
.desc{color:var(--sub)}
.row .desc{color:var(--sub);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;align-self:flex-start;margin-top:3px}
.row .time{color:var(--sub2);font-size:12px}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;
  font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
.listcard{background:var(--card);margin:14px;border-radius:var(--r);box-shadow:var(--shadow-s);overflow:hidden}

.searchwrap{padding:10px 14px 4px}
.searchwrap input{width:100%;padding:9px 14px;border-radius:12px;border:none;background:var(--card);
  color:var(--text);font:inherit;font-size:15px;outline:none;box-shadow:var(--shadow-s)}

.empty{padding:64px 34px;text-align:center;color:var(--sub)}
.empty .art{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center}
.empty .art svg{width:36px;height:36px;stroke:var(--accent)}
/* 深色模式下 12% 主题色叠在近黑底上就是一块黑砖，图标也看不清 */
@media(prefers-color-scheme:dark){
  .empty .art{background:rgba(255,255,255,.075)}
  .empty .art svg{stroke:rgba(255,255,255,.88)}
}
.empty h4{margin:0 0 6px;font-size:16.5px;font-weight:600;color:var(--text)}
.empty p{margin:0;font-size:13.5px;line-height:1.7}

#tabbar{flex:0 0 auto;height:70px;display:flex;padding:9px 22px 8px;gap:6px;background:var(--nav);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-top:.5px solid var(--line);position:relative;z-index:30}
#tabbar .t{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:500;color:var(--sub);cursor:pointer;transition:color .18s}
#tabbar .t svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
#tabbar .t.on{color:var(--accent)}
#tabbar .t.on svg{transform:translateY(-1px) scale(1.04)}

/* 背景挂在整屏上（高度恒定），不要挂 .body —— .body 高度一变 cover 就会重新居中，背景跳版 */
#s-chat{background:var(--chat-bg);background-size:cover;background-position:center}
#s-chat .body{background:transparent}

/* ── 沉浸模式：背景通栏，上下栏浮在图上 ──
   前景色不写死，按背景图亮度自动在 深色前景 / 浅色前景 之间切换 */
#phone.imm{
  --imm-fg:#fff;
  --imm-dim:rgba(255,255,255,.72);
  --imm-sh:0 1px 5px rgba(0,0,0,.58);
  --imm-glass:rgba(255,255,255,.13);
  --imm-edge:rgba(255,255,255,.22);
  --imm-line:rgba(255,255,255,.16);
  --imm-veil:rgba(0,0,0,.34);
  --imm-chip:rgba(255,255,255,.14);
  --imm-scrim-top:linear-gradient(180deg,rgba(0,0,0,.46) 0%,rgba(0,0,0,.30) 42%,rgba(0,0,0,.10) 76%,transparent 100%);
  --imm-scrim-bot:linear-gradient(0deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.26) 44%,rgba(0,0,0,.08) 78%,transparent 100%);
}
#phone.imm.lightbg{
  --imm-fg:#0C0C11;
  --imm-dim:rgba(0,0,0,.58);
  --imm-sh:0 1px 4px rgba(255,255,255,.75);
  --imm-glass:rgba(255,255,255,.44);
  --imm-edge:rgba(255,255,255,.72);
  --imm-line:rgba(0,0,0,.10);
  --imm-veil:rgba(255,255,255,.62);
  --imm-chip:rgba(255,255,255,.5);
  --imm-scrim-top:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.4) 42%,rgba(255,255,255,.14) 76%,transparent 100%);
  --imm-scrim-bot:linear-gradient(0deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.34) 44%,rgba(255,255,255,.1) 78%,transparent 100%);
}
#chatBg{position:absolute;inset:0;z-index:0;display:none;background-size:cover;background-position:center}
/* 状态栏那 46px 也要盖到 —— 否则沉浸时顶上会露出一条纯色带 */
#phone.imm #chatBg{display:block}
#homeBg{position:absolute;inset:0;z-index:0;display:none;background-size:cover;background-position:center}
#weatherCv{position:absolute;inset:0;z-index:0;display:none;width:100%;height:100%}
#phone.himm.wxlive #weatherCv,#phone.imm.wxlive #weatherCv{display:block}
#phone.himm.wxlive #homeBg{background-image:none!important}
/* 聊天页同步：天气画布替掉 chatBg 的图，遮罩(::before/::after)留在上面 */
/* 只有天气画布真的在渲染（wxlive）时才让它接管背景；
   否则保留 chatBg 的图，避免天气没跑起来时顶部露出一条纯色带 */
#phone.imm.wxlive #chatBg{background-image:none!important}
#phone.imm.wxlive #chatBg::before,#phone.imm.wxlive #chatBg::after{z-index:1}
#homeBg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(20,18,34,.30),rgba(20,18,34,.12) 30%,rgba(20,18,34,.34))}
#phone.himm #homeBg{display:block}
/* ── 系统沉浸：四个 tab 全铺背景，每个模块都是液态玻璃 ──
   玻璃配方来自 sanctuary：blur+saturate+brightness 的 backdrop、
   白色渐变底、半透明描边、顶部 1px 高光（inset）——这条高光是"液态"感的关键 */
#phone.himm{
  --hfg:#fff; --hfg-dim:rgba(255,255,255,.72); --hfg-faint:rgba(255,255,255,.48);
  --hline:rgba(255,255,255,.15); --hsh:0 1px 6px rgba(0,0,0,.45);
  --lg-bg:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.045) 100%);
  --lg-bd:rgba(255,255,255,.16);
  --lg-shadow:0 6px 22px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.18);
  --lg-in:rgba(255,255,255,.10);
}
#phone.himm.lightbg2{
  --hfg:#221f38; --hfg-dim:rgba(34,31,56,.72); --hfg-faint:rgba(34,31,56,.48);
  --hline:rgba(34,31,56,.13); --hsh:0 1px 6px rgba(255,255,255,.5);
  --lg-bg:linear-gradient(135deg,rgba(255,255,255,.58) 0%,rgba(255,255,255,.34) 100%);
  --lg-bd:rgba(255,255,255,.6);
  --lg-shadow:0 6px 22px rgba(40,36,80,.13),inset 0 1px 0 rgba(255,255,255,.7);
  --lg-in:rgba(255,255,255,.42);
}
#phone.himm #statusbar{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;
  color:var(--hfg);text-shadow:var(--hsh);position:relative;z-index:2}
#phone.himm #screens{position:relative;z-index:1}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings){background:transparent}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) .navbar{background:transparent;
  border-bottom:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) .navbar .title,
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) .navbar button{
  color:var(--hfg);text-shadow:var(--hsh)}
/* ── 模块：sanctuary .glass-bubble 的完整层叠，铺平到卡片上 ──
   五层背景：左上焦散白 → 右下冷色晕 → 中央青绿微光 → 虹彩 conic → 白渐变打底。
   边框和阴影跟着 lg-iridescent 慢慢换色（蓝→青→紫→蓝），
   ::before 是一块会漂移的焦散高光，::after 是右下角的虹彩边缘光。 */
@keyframes lg-iridescent{
  0%,100%{border-color:rgba(200,230,255,.30);
    box-shadow:0 8px 30px rgba(0,0,0,.24),0 0 0 1px rgba(200,230,255,.06),
      inset 0 2px 8px rgba(255,255,255,.30),inset 0 -3px 10px rgba(100,180,255,.10),
      inset 0 0 20px rgba(0,20,40,.05)}
  25%{border-color:rgba(180,240,220,.34);
    box-shadow:0 8px 30px rgba(0,0,0,.24),0 0 8px rgba(120,255,200,.09),
      inset 0 2px 8px rgba(220,255,240,.30),inset 0 -3px 10px rgba(100,220,200,.12),
      inset 0 0 20px rgba(0,30,30,.05)}
  50%{border-color:rgba(220,200,255,.32);
    box-shadow:0 8px 30px rgba(0,0,0,.24),0 0 8px rgba(180,150,255,.08),
      inset 0 2px 8px rgba(240,230,255,.30),inset 0 -3px 10px rgba(160,140,255,.10),
      inset 0 0 20px rgba(10,0,30,.05)}
  75%{border-color:rgba(180,220,255,.34);
    box-shadow:0 8px 30px rgba(0,0,0,.24),0 0 8px rgba(100,200,255,.09),
      inset 0 2px 8px rgba(220,240,255,.30),inset 0 -3px 10px rgba(80,180,255,.12),
      inset 0 0 20px rgba(0,10,40,.05)}
}
@keyframes lg-caustic{
  0%,100%{top:-14%;left:6%;width:52%;height:46%;opacity:.9}
  25%{top:-10%;left:12%;width:46%;height:42%;opacity:.65}
  50%{top:-17%;left:4%;width:56%;height:50%;opacity:.85}
  75%{top:-12%;left:9%;width:49%;height:40%;opacity:.75}
}
@keyframes lg-rim{
  0%,100%{bottom:-8%;right:4%;opacity:.9}
  30%{bottom:-5%;right:9%;opacity:.6}
  60%{bottom:-10%;right:2%;opacity:.8}
  80%{bottom:-4%;right:6%;opacity:.7}
}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard){
  position:relative;
  background:
    radial-gradient(ellipse at 22% 12%,rgba(255,255,255,.30) 0%,transparent 44%),
    radial-gradient(ellipse at 76% 85%,rgba(100,200,255,.10) 0%,transparent 52%),
    radial-gradient(ellipse at 50% 50%,rgba(120,220,200,.045) 0%,transparent 70%),
    conic-gradient(from 160deg at 50% 50%,
      rgba(140,220,255,.075) 0deg,rgba(100,255,220,.055) 60deg,
      rgba(180,200,255,.075) 120deg,rgba(120,240,230,.05) 180deg,
      rgba(160,180,255,.065) 240deg,rgba(100,230,210,.055) 300deg,
      rgba(140,220,255,.075) 360deg),
    linear-gradient(160deg,rgba(255,255,255,.15) 0%,rgba(200,240,255,.05) 50%,rgba(255,255,255,.085) 100%);
  border:1px solid rgba(200,230,255,.30);
  -webkit-backdrop-filter:blur(26px) saturate(1.75) brightness(1.12);
  backdrop-filter:blur(26px) saturate(1.75) brightness(1.12);
  animation:lg-iridescent 9s ease-in-out infinite}
/* 焦散高光：一团模糊的白，在卡片左上方慢慢漂 */
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard)::before{
  content:"";position:absolute;top:-14%;left:6%;width:52%;height:46%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,rgba(240,250,255,.34) 0%,rgba(200,230,255,.10) 42%,transparent 70%);
  filter:blur(3px);pointer-events:none;
  animation:lg-caustic 6.5s ease-in-out infinite}
/* 右下角虹彩边缘光 */
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard)::after{
  content:"";position:absolute;bottom:-8%;right:4%;width:42%;height:30%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,rgba(120,200,255,.14) 0%,rgba(100,240,220,.08) 40%,transparent 70%);
  pointer-events:none;
  animation:lg-rim 7.5s ease-in-out infinite}
/* 相邻卡片错开呼吸节奏，别一起闪 */
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard):nth-of-type(2n){
  animation-delay:-3s}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard):nth-of-type(2n)::before{
  animation-delay:-2.4s}
#phone.himm :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard):nth-of-type(3n)::after{
  animation-delay:-4.1s}
/* 浅色背景图：虹彩收敛、白底加浓，字才压得住 */

/* 底栏：玻璃面板 */

      rgba(175,195,255,.07) 220deg,rgba(140,220,255,.07) 360deg),
    linear-gradient(135deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.045) 100%);

.lgcv{position:absolute;inset:0;z-index:0;pointer-events:none}
#phone.himm .lgon{background:none!important;border-color:transparent!important;

#phone.himm.gfrost :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard){

#phone.himm.gfrost :is(#s-chats,#s-chars,#s-wbs,#s-settings) :is(.group,.listcard,.pcard)::after{display:none}

/* 遮罩画成一整块盖在背景图上，跨过状态栏+导航栏；
   分别挂在两个元素上会在交界处切出一条硬边 */
#chatBg::before,#chatBg::after{content:"";position:absolute;left:0;right:0;pointer-events:none}
#chatBg::before{top:0;height:170px;background:var(--imm-scrim-top)}
#chatBg::after{bottom:0;height:185px;background:var(--imm-scrim-bot)}
/* 没开沉浸、但设了聊天背景图时，也给上下加同样的渐变蒙层，
   让顶栏和输入栏区域的文字压得住 —— 纯渐变，不会切出硬边 */
/* 顶底的模糊蒙层：backdrop-filter 把背景糊掉，再用 mask 让模糊本身渐隐，
   所以没有硬边 —— 这就是输入栏那种毛玻璃质感，不是压暗的色块。
   z-index:2 让它盖在气泡之上（气泡滚进去会糊掉，像滑进雾里）。 */

#phone.imm #screens{position:relative;z-index:1}
#phone.imm #s-chat{background:transparent}

  color:var(--imm-fg);text-shadow:var(--imm-sh)}

  border-bottom:none}

  border-top:none}

#phone.imm #chatInput{background:rgba(255,255,255,.86);border-color:transparent;color:#111;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

#phone.imm .ibtn.plus,#phone.imm .ibtn.push{background:rgba(255,255,255,.86);border-color:transparent;

#phone.imm .daysep{background:var(--imm-veil);color:var(--imm-fg)}
#phone.imm .reacts span{border-color:transparent}
#phone.imm #homebar{color:var(--imm-fg)}

#chatBody{padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
.loadmore{align-self:center;margin:2px 0 10px;padding:6px 16px;border-radius:20px;background:var(--card);

.msg{display:flex;gap:8px;align-items:flex-end;animation:pop .24s cubic-bezier(.3,1.3,.6,1);
  user-select:none;-webkit-user-select:none;position:relative}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse}
.msg .av{width:34px;height:34px;border-radius:var(--av-r,50%);flex:0 0 auto;overflow:hidden;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
.msg .av img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:73%;padding:9px 14px;border-radius:var(--br,20px);font-size:15.5px;line-height:1.45;
  background:var(--bubble-ta);color:var(--bubble-ta-text);white-space:pre-wrap;word-break:break-word;
  box-shadow:var(--shadow-s);border-bottom-left-radius:var(--br-t,7px)}
.msg.me .bubble{background:var(--grad);color:#fff;border-bottom-left-radius:var(--br,20px);
  border-bottom-right-radius:var(--br-t,7px);box-shadow:0 2px 10px rgba(106,86,232,.28)}
#s-chat.cta .msg:not(.me) .bubble{color:var(--tx-ta)}
#s-chat.cme .msg.me .bubble{color:var(--tx-me)}
.msg{transition:transform .22s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
.msg.swiping{transition:none}
.msg::after{content:"";position:absolute;right:6px;top:50%;width:26px;height:26px;
  margin-top:-13px;border-radius:50%;background:var(--accent);opacity:0;
  transition:opacity .16s;pointer-events:none;
  -webkit-mask:center/15px no-repeat url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8.5 8 9.4 9.4 0 01-3.7-.8L4 21l1.8-4.4A7.8 7.8 0 014 12a8 8 0 018.5-8A8 8 0 0121 12z"/></svg>');
          mask:center/15px no-repeat url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8.5 8 9.4 9.4 0 01-3.7-.8L4 21l1.8-4.4A7.8 7.8 0 014 12a8 8 0 018.5-8A8 8 0 0121 12z"/></svg>')}

/* 输入动效：角色气泡里 + 顶栏副标题 */
.bubble.typing3{display:flex;gap:5px;align-items:center;padding:13px 15px}

  repeating-linear-gradient(90deg,rgba(122,104,240,.16) 0 1px,transparent 1px 22px),

/* 开发日志 */
.logbody{padding:16px 18px 30px;font-size:14.5px;line-height:1.8}
.logbody h2{font-size:17px;margin:26px 0 10px;padding-bottom:8px;
  border-bottom:.5px solid var(--line)}
.logbody h3{font-size:15.5px;margin:22px 0 8px;color:var(--accent)}
.logbody p{margin:0 0 10px}
.logbody ul{margin:0 0 12px;padding-left:20px}
.logbody li{margin-bottom:5px}
.logbody code{background:var(--accent-soft);color:var(--accent);padding:1px 5px;
  border-radius:5px;font-size:12.5px;word-break:break-all}
.logbody pre{background:var(--card);border-radius:12px;padding:12px 14px;overflow-x:auto;
  font-size:12.5px;line-height:1.65;margin:0 0 12px;box-shadow:var(--shadow-s)}
.logbody pre code{background:none;color:var(--text);padding:0}
.logbody .tw2{overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.logbody .tw2::-webkit-scrollbar{height:0}
.logbody table{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}
.logbody td:first-child,.logbody th:first-child{white-space:nowrap}
.logbody td:first-child code{white-space:nowrap}
.logbody th,.logbody td{padding:7px 9px;border-bottom:.5px solid var(--line);text-align:left;
  vertical-align:top}
.logbody th{color:var(--sub);font-weight:500;font-size:12px}
.logbody blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--accent-soft);
  color:var(--sub);font-size:13.5px}
.logbody hr{border:none;border-top:.5px solid var(--line);margin:20px 0}
.logbody strong{font-weight:600}

/* 图片查看 */
#viewer{position:absolute;inset:0;background:rgba(0,0,0,.94);z-index:90;display:none;
  align-items:center;justify-content:center;animation:fade .2s}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:88%;object-fit:contain}
#viewer .close{position:absolute;top:14px;right:18px;color:#fff;font-size:26px;cursor:pointer;opacity:.8}

/* 底部面板 */
#sheet{position:absolute;inset:0;z-index:80;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:fade .22s}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet .card{position:absolute;left:8px;right:8px;bottom:8px;max-height:74%;background:var(--card);
  border-radius:24px;box-shadow:0 -8px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;
  overflow:hidden;animation:up .3s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
#sheet .head{padding:16px 18px 10px;display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
#sheet .head b{font-size:17px}
#sheet .head span#sheetCount{font-size:13px;color:var(--sub);flex:1}
#sheet .head .x{color:var(--accent);font-size:15px;cursor:pointer}
#sheet .search{margin:0 14px 10px;flex:0 0 auto}
#sheet .search input{width:100%;padding:9px 14px;border-radius:12px;border:none;background:var(--bg);
  color:var(--text);font:inherit;font-size:15px;outline:none}
#sheet .list{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:8px}
#sheet .list::-webkit-scrollbar{width:0}
#sheet .it{padding:13px 18px;font-size:15.5px;cursor:pointer;position:relative;display:flex;
  align-items:center;gap:10px;word-break:break-all}
#sheet .it+.it::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--line)}
#sheet .it:active{background:var(--accent-soft)}
#sheet .it.cur{color:var(--accent);font-weight:600}
#sheet .it.danger{color:var(--danger)}
#sheet .it .tick{margin-left:auto;flex:0 0 auto;opacity:0}
#sheet .it.cur .tick{opacity:1}
#sheet .it .mav{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex:0 0 auto}
#sheet .it .mav img{width:100%;height:100%;object-fit:cover}
#sheet .none{padding:34px;text-align:center;color:var(--sub);font-size:14px}

/* 表情包 */
.bubble.sticker{background:transparent!important;box-shadow:none!important;padding:0!important}
.bubble.sticker img{width:110px;height:110px;object-fit:contain;display:block}
.stgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.stcard{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--card);
  box-shadow:var(--shadow-s);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stcard img{width:100%;height:100%;object-fit:contain}
.stcard .nm{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:9.5px;padding:2px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stcard .del{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:19px;text-align:center}
.stadd{aspect-ratio:1;border-radius:14px;border:1.6px dashed var(--line2);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);
  font-size:11px;cursor:pointer}

/* 日记 */
.dnote{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-s);
  padding:14px 16px;margin:0 14px 12px}
.dnote .dh{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dnote .who{font-size:12px;font-weight:600;padding:2px 9px;border-radius:8px;color:#fff}
.dnote .dt{font-size:11.5px;color:var(--sub2);margin-left:auto}
.dnote .dc{font-size:14.5px;line-height:1.72;white-space:pre-wrap}

/* 心情 */
.moodtoday{display:flex;gap:12px;padding:14px}
.moodcard{flex:1;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-s);
  padding:16px 12px;text-align:center;cursor:pointer}
.moodcard .em{font-size:40px;line-height:1.15;min-height:46px}
.moodcard .who2{font-size:12px;color:var(--sub);margin-top:6px}
.moodcard .nt{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.5;min-height:18px}
.moodrow{display:flex;align-items:center;gap:10px;padding:9px 16px;position:relative}
.moodrow+.moodrow::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.moodrow .d{width:52px;font-size:12px;color:var(--sub)}
.moodrow .p{flex:1;display:flex;gap:14px;font-size:21px}
.moodpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 16px 14px}
.moodpick span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;
  border-radius:13px;cursor:pointer;border:2px solid transparent}
.moodpick span.on{border-color:var(--accent);background:var(--accent-soft)}

/* TA 的手机 —— 模拟一块屏 */
.pscreen{margin:12px 14px 16px;border-radius:26px;overflow:hidden;position:relative;
  background:linear-gradient(165deg,#4A4470,#2A2740 55%,#1B1930);
  box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.08);
  padding:14px 14px 18px;color:#fff}
.pscreen .pbar{display:flex;align-items:center;justify-content:space-between;
  font-size:11.5px;opacity:.82;padding:0 4px 12px;letter-spacing:.3px}
.pscreen .pbar .bt{display:flex;align-items:center;gap:5px}
.batt{width:26px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);
  position:relative;padding:1.5px}
.batt i{display:block;height:100%;border-radius:1.5px;background:#fff}
.batt.low i{background:#FF6B6B}
.batt::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;
  border-radius:0 2px 2px 0;background:rgba(255,255,255,.5)}
.pnow{font-size:15px;line-height:1.65;padding:2px 4px 14px;opacity:.95}
.papps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.papp{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;
  opacity:.9;cursor:pointer;position:relative}
.papp i{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .15s}
.papp:active i{transform:scale(.9)}
.papp .bdg{position:absolute;top:-3px;right:8px;min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:#FF3B30;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.pwidget{background:rgba(255,255,255,.11);border-radius:18px;padding:12px 14px;margin-bottom:10px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:.5px solid rgba(255,255,255,.13)}
.pwidget h6{margin:0 0 7px;font-size:11px;opacity:.6;font-weight:500;letter-spacing:.5px}
.pwidget .li{font-size:13.5px;line-height:1.7;opacity:.94;display:flex;gap:8px}
.pwidget .li span:first-child{opacity:.55;flex:0 0 auto}
.pmusic{display:flex;align-items:center;gap:11px}
.pmusic .cov{width:44px;height:44px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,#8E7BF8,#FF9500);display:flex;align-items:center;
  justify-content:center}
.pmusic .mt{flex:1;min-width:0}
.pmusic .mt b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.pmusic .mt small{font-size:11.5px;opacity:.6}
.pbars{display:flex;gap:2px;align-items:flex-end;height:15px}
.pbars i{width:2.5px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.pbars i:nth-child(2){animation-delay:.15s}.pbars i:nth-child(3){animation-delay:.3s}
.pbars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:15px}}

/* vibe */
.vibegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:2px 0 6px}
.vibecard{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:var(--card);
  box-shadow:var(--shadow-s);cursor:pointer;border:2.5px solid transparent}
.vibecard.on{border-color:var(--accent)}
.vibecard.sel{outline:2px solid var(--accent);outline-offset:2px}
/* 头像框：叠在头像上；容器放开裁切，头像图自己按容器圆角裁 */
.avframe{position:absolute!important;left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;
  width:var(--frame-scale,135%)!important;height:var(--frame-scale,135%)!important;
  transform:translate(-50%,-50%)!important;max-width:none!important;max-height:none!important;
  pointer-events:none;z-index:3;object-fit:contain!important;border-radius:0!important}
*:has(> .avframe){position:relative;overflow:visible!important}
*:has(> .avframe)>img:not(.avframe){border-radius:inherit}
.framegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:2px 0 6px}
.framecard{background:var(--card);border-radius:13px;padding:8px 4px 6px;text-align:center;font-size:11px;color:var(--sub);
  box-shadow:var(--shadow-s);cursor:pointer;overflow:hidden}
.framecard.on{outline:2px solid var(--accent);outline-offset:-2px}
.framecard .fdemo{width:40px;height:40px;border-radius:50%;background:var(--grad);margin:8px auto 10px}
.framecard span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frameadd{border-radius:13px;border:1.6px dashed var(--line2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--sub);font-size:11px;cursor:pointer;min-height:76px}
.vibecard img{width:100%;height:100%;object-fit:cover}
.vibecard .vibeph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:16px}
.vibecard.off .vibeph{opacity:.4}
.vibecard .vtag{position:absolute;top:5px;left:5px;font-size:9.5px;padding:1px 5px;border-radius:5px;
  background:rgba(0,0,0,.55);color:#fff}
.vibecard.off img{filter:grayscale(1);opacity:.4}
.vibecard .vn{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;
  font-size:9.5px;padding:2px 4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vibeadd{aspect-ratio:1;border-radius:13px;border:1.6px dashed var(--line2);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);
  font-size:11px;cursor:pointer}
.diag{background:var(--card);border-radius:14px;box-shadow:var(--shadow-s);overflow:hidden;margin-bottom:14px}
.diagrow{display:flex;align-items:center;gap:10px;padding:11px 15px;font-size:14px;position:relative}
.diagrow+.diagrow::before{content:"";position:absolute;top:0;left:15px;right:0;height:.5px;background:var(--line)}
.diagrow .dot3{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--sub2)}
.diagrow.ok .dot3{background:var(--ok)}
.diagrow.bad .dot3{background:var(--danger)}
.diagrow.run .dot3{background:var(--accent);animation:blink 1s infinite}
.diagrow .dmsg{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;max-width:58%}
.diaghint{font-size:12.5px;color:var(--sub);line-height:1.75;padding:0 2px 14px}
.diaghint b{color:var(--danger)}

/* 心情日历 */
.calhead{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.calhead b{font-size:17px;flex:1}
.calnav{width:32px;height:32px;border-radius:10px;background:var(--card);box-shadow:var(--shadow-s);
  display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer}
.calnav.off{opacity:.3;pointer-events:none}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.calw{text-align:center;font-size:11px;color:var(--sub2);padding:4px 0 6px}
.calday{aspect-ratio:.82;border-radius:11px;background:var(--card);box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:4px 0 0;gap:0;cursor:pointer;position:relative}
.calday.blank{background:transparent;box-shadow:none;pointer-events:none}
.calday.today{outline:2px solid var(--accent);outline-offset:-2px}
.calday .dn{font-size:10px;color:var(--sub2);line-height:1.3}
.calday .e1,.calday .e2{font-size:14px;line-height:1.15}
.calday .e2{opacity:.95}
.calstat{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px 4px}
.calstat .cs{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:20px;
  padding:5px 12px;box-shadow:var(--shadow-s);font-size:13px}
.calstat .cs b{font-weight:600;color:var(--accent)}
.callegend{font-size:12px;color:var(--sub);padding:8px 18px 0;line-height:1.7}

/* 生图 */
.gpreview{width:100%;aspect-ratio:.72;max-height:340px;border-radius:18px;overflow:hidden;
  background:var(--card);box-shadow:var(--shadow-s);display:flex;align-items:center;
  justify-content:center;color:var(--sub);font-size:13px;margin-bottom:14px;position:relative}
.gpreview img{width:100%;height:100%;object-fit:cover}
.gpreview .load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;background:rgba(0,0,0,.4);color:#fff;font-size:13px}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.albgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 14px}
.albcard{position:relative;aspect-ratio:.75;border-radius:12px;overflow:hidden;background:var(--card);
  box-shadow:var(--shadow-s);cursor:pointer}
.albcard img{width:100%;height:100%;object-fit:cover}
.albcard .cap3{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);
  color:#fff;font-size:10.5px;padding:14px 6px 5px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 手机主屏 */
#phoneWall{position:absolute;inset:0;z-index:0;display:none;background-size:cover;
  background-position:center;background-color:#241F3A}
#phone.pimm #phoneWall{display:block}
#phoneWall::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.12) 22%,
    rgba(0,0,0,.06) 60%,rgba(0,0,0,.34) 100%)}
#phone.pimm #screens{position:relative;z-index:1}
#phone.pimm #statusbar{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;
  color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.6)}
#phone.pimm .phscreen{background:transparent}
#phone.pimm .phscreen .navbar{background:transparent;-webkit-backdrop-filter:none;
  backdrop-filter:none;border-bottom:none}
#phone.pimm .phscreen .navbar .title,
#phone.pimm .phscreen .navbar button{color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.55)}
#phone.pimm #homebar{color:#fff}
#s-phone{background:linear-gradient(170deg,#4A4470,#2A2740 52%,#191728)}
#s-phone .body{background:transparent}
#s-phone .navbar{background:rgba(30,28,48,.55);border-bottom:none;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
#s-phone .navbar .title,#s-phone .navbar button{color:#fff}
#chatsNav.flat{background:var(--bg);border-bottom-color:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none}
.hs{padding:6px 18px 18px;color:#fff;display:flex;flex-direction:column;
  min-height:100%;box-sizing:border-box}
.hs .hbar{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;
  opacity:.8;padding:0 2px 14px;letter-spacing:.3px}
.hs .hclock{text-align:center;padding:10px 0 20px}
.hs .hclock b{display:block;font-size:52px;font-weight:300;letter-spacing:-1px;line-height:1}
.hs .hclock span{font-size:13px;opacity:.7}
.hwid{background:rgba(255,255,255,.12);border-radius:20px;padding:14px 16px;margin-bottom:12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:.5px solid rgba(255,255,255,.14);cursor:pointer}
.hwid h6{margin:0 0 7px;font-size:10.5px;opacity:.6;font-weight:500;letter-spacing:.6px}
.hwid .hn{font-size:14.5px;line-height:1.6}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:6px 4px 26px}
.happ{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;
  color:rgba(255,255,255,.92);cursor:pointer;position:relative}
.happ i img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.happ i{overflow:hidden;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.3);transition:transform .15s}
.happ:active i{transform:scale(.88)}
.happ .hb{position:absolute;top:-4px;right:6px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:#FF3B30;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(30,28,48,.6)}
.hdock{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:auto 0 0;padding:12px 6px;
  position:sticky;bottom:2px;z-index:4;
  background:rgba(255,255,255,.13);border-radius:24px;
  border:.5px solid rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}

.hexrow{display:flex;align-items:center;gap:9px;margin-top:11px}
.hexdot{width:26px;height:26px;border-radius:8px;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.xcbar{flex:0 0 auto;display:flex;gap:9px;padding:9px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--nav);border-top:.5px solid var(--line);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.xcbar input{flex:1;min-width:0;height:38px;border-radius:19px;border:none;outline:none;
  background:var(--bg);color:var(--text);font-size:14.5px;padding:0 15px;font-family:inherit}
.xcbar button{flex:none;padding:0 16px;border-radius:19px;border:none;background:var(--grad);
  color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.xcbar button:disabled{opacity:.5}
.xdmbtn{margin-top:10px;padding:7px 18px;border-radius:17px;border:.5px solid var(--line2);
  background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.xfollow{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px}
.xfitem{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px 7px 8px;
  border-radius:19px;background:var(--card);box-shadow:var(--shadow-s);cursor:pointer;

#phone.imm #s-chatSet .cell .val,

#phone.imm #s-chatSet .field+.field::before,

#phone.imm #s-chatSet .switch i{background:var(--imm-line)}

/* ── 微信式功能面板 ── */
#plusPanel{flex:0 0 auto;max-height:0;overflow:hidden;background:transparent;
  transition:max-height .32s cubic-bezier(.32,.72,0,1)}
#plusPanel.open{max-height:360px}
.ppgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;
  margin:0 10px 12px;padding:18px 10px 20px;border-radius:26px;
  background:var(--nav);box-shadow:0 8px 30px rgba(16,14,40,.14);
  border:.5px solid var(--line);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.ppitem{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  font-size:11.5px;color:var(--sub)}
.ppitem i{width:56px;height:56px;border-radius:17px;background:var(--card);box-shadow:var(--shadow-s);
  display:flex;align-items:center;justify-content:center;color:var(--accent);transition:transform .16s}
.ppitem:active i{transform:scale(.9)}
#phone.imm #plusPanel{background:transparent}
#phone.imm .ppgrid{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);
  box-shadow:0 10px 32px rgba(0,0,0,.22)}
#phone.imm .ppitem{color:var(--imm-fg);text-shadow:var(--imm-sh)}
#phone.imm .ppitem i{background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ibtn.plus svg{transition:transform .28s cubic-bezier(.32,.72,0,1)}
.ibtn.plus.on svg{transform:rotate(45deg)}

/* ── 多选 ── */
.selbox{position:absolute;left:0;top:50%;transform:translateY(-50%);width:21px;height:21px;
  border-radius:50%;border:1.8px solid var(--sub2);display:none;background:var(--card)}
#s-chat.sel .selbox{display:block}
#s-chat.sel .msg{padding-left:32px}
#s-chat.sel .bubble{cursor:pointer}
.selbox.on{background:var(--accent);border-color:var(--accent)}
.selbox.on::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
#selectBar{display:none;flex:0 0 auto;padding:10px 8px 14px;background:var(--nav);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-top:.5px solid var(--line)}
#s-chat.sel #selectBar{display:flex}
#s-chat.sel #chatInputBar,#s-chat.sel #quoteBar,#s-chat.sel #plusPanel{display:none}
#selectBar .sb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11.5px;color:var(--accent);cursor:pointer;padding:4px}
#selectBar .sb.danger{color:var(--danger)}
#selectBar .sb.off{opacity:.35;pointer-events:none}
#selectBar .sb:active{opacity:.5}

#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:rgba(20,20,24,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;
  opacity:0;transition:.26s cubic-bezier(.3,1.2,.6,1);pointer-events:none;z-index:99;max-width:82%;
  text-align:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#phone.kbup{max-height:none}
#phone.kbup #chatInputBar{padding-bottom:8px}
#homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:4.5px;
  border-radius:3px;background:currentColor;opacity:.22;z-index:70;pointer-events:none}
/* 聊天页不画：输入栏已经贴底，再来一根就像个多余的拖拽把手 */
#phone.inchat #homebar{display:none}
</style>
</head>

  <script type="text/plain" id="changelogSrc"># 小手机 · 开发日志

单文件 AI 聊天壳。所有数据存在浏览器 IndexedDB，不上传。
本文件只记录变更和规则，不影响运行——`index.html` 是唯一的程序文件。

---

## 数据结构

| Store | 主键 | 字段 |
|---|---|---|
| `characters` | id | name, avatar, bio, greeting, images[], personaId, worldbookIds[], chat{}, pinned, lastRead, proLog, status |
| `personas` | id | name, avatar, persona |
| `messages` | id | characterId, role, content, type, meta{}, quote, fav, reactions[], thoughts, timestamp |
| `worldbooks` | id | name, global, scanDepth, entries[] |
| `memories` | id | characterId, type(core/episodic), content, importance(1-5), source |
| `stickers` | id | name(=描述), src |
| `diaries` | id | characterId, date, who(user/char), content |
| `moods` | `{cid}_{date}_{who}` | characterId, date, who, emoji, note |

`characters.chat` 是每个角色独立的聊天设置：气泡色、字号、背景、沉浸开关、历史条数、主动发消息、注入管理器开关。

**DB 版本历史**：v1 基础 → v2 加 memories → v3 加 personas → v4 加 stickers/diaries/moods → … → v8 加 fonts（自定义字体 Blob）→ v9 加 frames（头像框）。升级是增量建表，旧数据不动。

---

## 提示词拼装顺序

```
# 你的角色与任务
你现在扮演"{名字}"。{世界书 pos=before}

## 角色设定:
{bio}

## 当前情景:
- 当前时间 / 季节 / 时间流逝（距上次回复多久）
- 对话者：{绑定身份的名字 + 人设}
【核心记忆】按 importance 排序取前 N
【情景记忆】按时间倒序取前 N
- 今天双方心情
【你最近的日记】最近 2 篇
{世界书 pos=after，命中关键词的条目}

# 首要规则：输出格式        ← JSON 数组，含 4 条反例
# 聊天方式                  ← 2~N 条、禁止动作神态心理描写、括号规则
# 记忆的用法                ← 防"我记得你说过"台词腔
# 表情包                    ← 有表情包库时才出现
# 语气与用词示例            ← few-shot，最影响像不像真人
# 忽略技术异常
# 最后重申
```

历史消息另外按条数拼在 system 之后。

---

## 关键规则

**消息解析（parseReply）** 四层兜底，任一层成功就返回：
1. 整体是一个 JSON 数组
2. 文本里夹着一个数组（正则抓 `[...]`）
3. **模型输出了多个数组**（每行一个）→ 全部拆开合并
4. 按行拆，剥掉外层 `[ ]` 和引号

第 3 层是踩过坑补的：模型经常每行输出一个 `["..."]`，原来会原样显示成消息内容。

**世界书命中** = 启用 && 有内容 && (常驻 || (主关键词命中 && (无次关键词 || 次关键词也命中)))，再过一道 `probability`。扫描范围只看最近 `scanDepth` 条消息。

**真图 / 假图**：真图存 dataURL 并在 `meta.real=true`，请求时最近 6 条里最多 3 张走多模态 `image_url`；假图只有描述，渲染成虚线占位卡，给模型的是 `[图片：描述]`。

**表情包**：模型靠 `name`（描述）识别，提示词里列出全部可用描述并要求一字不差；回来后按描述回查库拿图，查不到就降级成文本。

**沉浸模式**：背景挂在 `#chatBg` 独立图层（跨状态栏通栏），遮罩画成一整块 `::before/::after`，不能分别挂在导航栏/输入栏上——那样会在交界处切出硬边。前景色由背景图亮度自动判定（canvas 采样，上下两条权重 0.7、中间 0.3，再乘遮罩衰减 0.62，>0.55 判为浅色背景 → 翻成深色前景）。

**布局雷区**：
- `.bubble` 有 `white-space:pre-wrap`，非纯文本气泡必须 `white-space:normal`，否则模板里的换行缩进会被渲染成空行
- 聊天背景不能挂在 `.body` 上——`.body` 高度一变（比如显示输入指示器）`cover` 会重新居中，背景跳版
- `.msgwrap` 包住气泡后，`.bubble` 的 `max-width:73%` 会变成"73% 的 73%"，必须改成 100% 由外层管宽度

---

## 变更记录

### 2026-08-30

**基础** — 单文件 + IndexedDB 起步：消息列表 / 角色 / 世界书 / 设置四个 tab，iOS 风格视觉（毛玻璃导航、inset 分组列表、SVG 状态栏图标、薰衣草紫渐变气泡）。

**模型拉取** — 设置页「拉取」按钮打 `GET /models`，底部面板可搜索、当前项打勾。兼容 `{data:[]}` / `{models:[]}` / 裸数组三种返回。

**消息列表 / 聊天页** — 搜索（同时搜角色名和内容）、置顶、未读红点、长按菜单；聊天页分页加载（每次 40，加载后保持滚动位置）、失败重试条、回到底部按钮。

**记忆矩阵** — 类型 × 重要度 的 2×5 网格，格子按数量着色、可点筛选；手动增删改 + AI 从对话中提取（禁止推测、去重、按 importance 排序注入）。

**身份系统** — 新增 personas 表，角色绑定身份，聊天时用绑定身份的名字/人设/头像。设置页的「我」移到「角色 → 我的身份」。旧数据自动迁移成第一个身份。

**角色页重做** — 大头像选择器（上传/emoji）、角色图片相册（最多 12 张，压到 760px）、底部大保存按钮。

**测试连接** — 真发一次 `max_tokens:5` 的最小请求，显示耗时和**实际响应模型**（能看出中转有没有偷换模型），失败时翻译状态码。

**双发送键** — `↑` 只上屏不调 API（可以连发攒着），`▶` 才真的请求；`▶` 上的角标显示欠着几条没回。回车 = 上屏。

**聊天设置** — 每个角色独立：气泡色（含实时预览）、字号、背景图、沉浸开关、历史条数、角色主动发消息（间隔 + 每日上限）。

**世界书重做** — 拆成「书 → 条目」两层。条目支持：条目名、启用开关、常驻、主关键词（或）、次关键词（且）、插入位置、触发概率。加了「测试命中」逐条显示命中原因。支持导入酒馆格式（`{entries:{}}` / 角色卡 V2 `character_book` / 裸数组）。

**注入管理器** — 开关打开后聊天页顶部出现胶囊，点开是分段条形图：角色设定 / 身份 / 时间 / 记忆 / 世界书 / 心情日记 / 风格示例 / 历史，各占多少字。

**消息级操作** — 引用回复（带进提示词）、贴表情（贴在气泡角上）、收藏、编辑、重生成、**重生成并附加要求**、**查看该句心声**（第一人称内心活动，缓存在消息上）、存为记忆、多选（收藏/复制/删除）。删除全部加了二次确认。

**微信式功能面板** — `+` 展开把输入栏顶上去，`+` 转 45° 变 ×，8 格图标网格：图片 / 表情包 / 语音 / 位置 / 日记 / 心情 / TA的手机 / 收藏。

**图标系统** — 全站 emoji 换成统一的线性 SVG（24 格、currentColor、1.8 描边）。只保留表情反应和心情的 emoji——那是内容不是装饰。

**真图 / 假图** — 真图走多模态让模型真看到（限最近 6 条内 3 张，可在设置关闭），气泡带「可识别」角标；假图只写描述，渲染虚线占位卡。

**表情包** — 设置页导入（多选、压到 240px、文件名当默认描述、可改可删），输入框面板里选发，角色也能发。

**日记** — 每天一篇，你写 + 让 TA 写（AI 按当天对话生成，要求写没说出口的心思、不复述对话）。TA 的最近 2 篇会注入提示词，并注明"对方没看过"。

**心情（suki）** — 每天双方各记一个 emoji + 一句话，你手选、TA 由 AI 从当天对话判断。最近 14 天并排显示。当天心情会注入提示词。

**TA 的手机** — 聚合页：此刻在做什么（AI 生成可刷新）、今天的心情、最近一篇日记、相册。

### 2026-08-30（续）

**撤回** — 长按自己或角色的消息可撤回；模型也能主动撤回，格式 `{"type":"recall"}`，撤掉它最近一条未撤回的消息。撤回后界面只留一条居中小提示。

规则：**撤回的内容不再进入发给模型的历史**——`msgToText` 对撤回消息返回 `[对方撤回了一条消息]`，原文只留在本机。所以"他不知道你撤回了什么"。点提示可以查看原文、撤销撤回、彻底删除。

提示词里写了用法和玩法（先发真心话再撤回），并要求低频使用。

**日记设置** — 每个角色独立：自由额外提示词（原样追加，优先级高于默认要求）、字数上下限、每天定时自动写。自动写的三道保险：到点才写、当天没写过才写、**当天有过对话才写**（没聊过不写，避免凭空编）。

**TA 的手机重做** — 从聚合卡片改成模拟一块屏：状态栏（时间/步数/电量条，低电量变红）、此刻在做什么、正在播放（带跳动音柱）、备忘录、接下来的日程、最近看过、8 个 App 图标带未读小红点。

刷新时让模型按当前时间、心情、最近对话生成一整份 JSON 快照（status/battery/steps/music/notes/schedule/recent/badges），前端做长度和类型裁剪后渲染。每次刷新内容都不一样。

App 图标可点：备忘录/浏览器/日程/音乐弹出完整列表，心情/日记跳对应页面，相册开图。

**新增字段**：`characters.diary{extra,minLen,maxLen,auto,hour}`、`characters.phone{...,at}`、`messages.recalled/recalledAt`。

### 2026-08-30（三）

**转账** — 消息类型 `transfer`，橙金卡片。你发的对方可收可退，角色发的你点卡片上的「收下/退回」。状态写回消息并带进提示词（`还没处理` / `对方已收下` / `被退回了`）。

模型侧两个格式：`{"type":"transfer","amount":52,"note":"..."}` 发钱、`{"type":"transfer_action","action":"accept|reject"}` 处理你发的钱。提示词里写了判断依据（性格、经济状况、关系），并明确禁止主动要钱。

**语音通话** — 全屏通话页，呼叫时头像有扩散光环，1.2~2.4 秒随机延迟后「接通」并开始计时。接通后角色先开口。

通话的提示词是**截断重建**的：拿角色的 system prompt 但砍掉「输出格式」以下全部，换成通话专用规则——只输出说的话本身、不要 JSON、一次一到两句、可以有语气词和半句话。挂断后在聊天里落一条通话记录气泡，点开看全文；发给模型时会带上完整通话内容。

**朋友圈** — 新增 `moments` 表（DB v5）。封面 + 动态流，你能发、能赞、能评论；角色能发（按当前心情和最近对话）、能评论你的动态（按当前关系阶段）。

**回流**：最近 3 条动态连同评论会注入聊天提示词。这是补上「角色有公开生活」这一环——之前角色有日记有手机，但那些都是私密的，朋友圈是双方都看得到的共同话题。

**旁白** — 一个只有你能看到的第三方观察者，独立对话（存在 messages 表里，characterId 前缀 `_oracle_`）。

它能看到：角色人设、你的身份、前 12 条重要记忆、今天双方心情、**角色的日记（你没看过的）**、最近 40 条对话。

角色设定要求：120 字以内、结论先行、给具体话术不给「你可以试着沟通」这种废话、能点破日记里的内容但要说明「这是他没告诉你的」。6 个快捷问题：他这是怎么了 / 我该怎么回 / 我们现在算什么关系 / 刚才哪句说错了 / 他是不是在生气 / 怎么把话题拉回来。

**关系评估** — 旁白顺带维护。9 个阶段（陌生/认识/熟悉/亲近/暧昧/恋人/疏远/冷战/破裂）+ 0-100 分 + 判断理由，显示在旁白页顶部，并注入角色的提示词。

**新增字段**：`characters.relation{stage,score,why,at}`、`messages.type='transfer'|'call'`、`moments` 表。

### 2026-08-30（四）

**功能面板圆角** — 从贴底直角改成浮起的圆角卡片（26px 圆角 + 左右留白 + 投影 + 细边框），沉浸模式下换成毛玻璃。

**发送按钮去掉角标** — 未回复计数移除。

**TA 的手机：App 做成真页面** — 原来点 App 只弹一个文字列表，现在每个 App 有自己的界面：

- **备忘录** — 黄色便签卡片，标题 + 正文 + 时间
- **音乐** — 播放器：渐变封面、歌名歌手专辑、进度条（按 progress 算出当前时间）、播放/暂停键、下一首播放列表
- **浏览器** — 历史记录列表，彩色首字母图标 + 标题 + 网站名 + 时间
- **日程** — 竖向时间轴，已过去的项目置灰划线
- 相册 / 心情 / 日记跳已有页面

首页的 widget 也变成可点，直接进对应 App。

**生成的数据结构升级** —— 从扁平字符串数组改成对象：

```
notes:   [{title, body, time}]
browser: [{title, site, time}]
schedule:[{time, what, done}]
music:   {title, artist, album, dur, progress, playing, playlist:[{title,artist}]}
```

2. 高度改成直接用 `visualViewport.height`，不再拿"总高减差值"算；`max-height:868px` 在键盘态解除，否则窄屏上会二次截断。
3. 视口 meta 加了 `interactive-widget=resizes-content` —— 让浏览器自己把布局视口压到键盘之上，新版 Safari / Chrome 支持后根本不用 JS 兜。

**左滑引用在 iOS 上完全不触发** — 两个原因叠一起：
- `.msg` 没设 `touch-action`，浏览器默认把横向手势当成自己的滚动/返回手势收走，JS 收不到 move。加 `touch-action:pan-y` 显式让出横向。
- iOS 的 `-webkit-overflow-scrolling:touch` 容器里，pointer 事件一开始滚就被 `pointercancel` 掉。改成主用 touch 事件（`touchstart/move/end`，move 里 `passive:false` + 认定左滑后 `preventDefault`），桌面鼠标继续走 pointer 那套，两边按 `pointerType` 分流互不干扰。

用真 `TouchEvent` 回归通过：`touch-action:pan-y`、滑过阈值 `swready`、松手成功设为引用。


### 2026-08-31（二十七）· 键盘空隙的真正原因

**是我今早那个键盘修复自己造出来的**，而且只在部分浏览器（用户那台是 Via）复现，换浏览器就没有——和消息条数、角色无关。

根因：判断键盘高度时用了 `window.innerHeight` 当基准。**有的浏览器键盘弹出后 `innerHeight` 不变，但布局视口其实已经被浏览器自己压到键盘之上了**。于是我算出一个几百像素的"键盘高度"，又把机身压了一遍——**压两遍**，底下就空出一条，露出浏览器自己的背景色（她那台 Via 主题是绿的，所以是绿框）。

改法：基准换成 `document.documentElement.clientHeight`（真正的布局视口）。算出来的键盘高度 ≤80px 就说明浏览器已经自己处理过了，我们完全不介入；只有布局视口没被压（iOS Safari 这类）才由我们把机身压到 `visualViewport.height`。两种分支都模拟验证过。

另外加了 **设置 → 关于 → 键盘诊断**（跟开发日志一个开关）：弹出 innerHeight / 布局高度 / 可视高度 / 偏移 / 算出的键盘高度 / 机身实际高度 / UA，并复制到剪贴板。以后排版对不上直接取数，不用猜。

### 2026-08-31（三十四）· 绿框真凶：是我自己加的那行 meta

**罪魁祸首是 `interactive-widget=resizes-content`** —— 今早为了「让浏览器自己处理键盘」加进 viewport meta 的那一行。它让浏览器把**布局视口**压到键盘之上；Via 的实现压多了，多出来的缝露出浏览器自己的底色（她那台主题是绿的）。

这一条解释了之前所有对不上的现象：

| 现象 | 原因 |
|---|---|
| 今早才出现 | 就是今早加的这行 |
| 三档开关全没用 | 压缩是**浏览器**按 meta 做的，跟我的 JS 无关，所以关 JS 当然没用 |
| 页面涂红那条不变红 | 那块被排除在布局视口**之外**，body 根本不延伸过去，涂不到 |
| 退小窗时闪一下红 | 切换瞬间布局视口短暂恢复全高，页面盖住了那块 |
| 别的浏览器正常 | 它们要么正确实现、要么直接忽略这个属性 |

**改法**：把这行删掉，回到浏览器默认的 `resizes-visual` —— 布局视口保持全高，**键盘盖在页面上**，缝隙在物理上就不可能出现。然后由 `initKeyboardFix` 按 `visualViewport` 把内容顶上去（这套逻辑本来就在，之前被 meta 架空了）。

顺手把上一版加的 `100dvh` 也删了 —— 它和 `resizes-content` 是同一种失败模式：都让页面缩到键盘之上，一旦浏览器算多了就留缝，而缝里是页面涂不到的地方。CSS 里留了注释说明为什么不能用这两个。

**记忆自动提取加了每角色开关** — 用户有个「需求机」角色是当记事本用的（往里丢待办、需求），自动提取跑到它头上，既没意义又弹 toast 打扰、还白烧额度。

- toast 改成只在「正在看这个角色的聊天页」时才弹；后台给别的角色提取时默默进行，不打断你手头的事

实测：两个角色各喂 14 条消息，开着的提取了 1 条记忆，关掉的 0 调用 0 记忆、`memAt` 保持 0。

**绿框：上一版的结论是错的。** 用户澄清「今早有的时候是还没开始用你的时候有的」—— 绿框在我改 viewport meta **之前**就存在，所以 `interactive-widget=resizes-content` 不是原因（不过删掉它本身没有坏处，保持删除）。

改成按轮读之后历史变长（12 轮 ≈ 130 条），出现新问题：**模型不守格式了，几句话堆在一个元素里发出来**。

典型的长上下文格式衰减 —— 格式规则写在提示词开头，一百多条历史把它冲得太远，模型转而模仿历史里的说话方式，忘了输出约定。两头一起修：

**② 代码：兜底从"按换行拆"升级成"按句拆"**
原来的 `sanitizeParts` 只按 `

- 在句末标点（。！？…）后切，标点跟着前句走
- **引号和括号内部不切** —— 「"怕你拒绝我吧"。」不会被拆碎

1. **天气画布在聊天页沉浸下压根没显示** —— 规则只写了 `#phone.himm.wxon #weatherCv{display:block}`（首页沉浸），聊天页沉浸 `imm` 时天气画布是 `display:none`

于是：配置了天气 → chatBg 的图被清空 → 天气画布又不显示 → 状态栏后面什么都没有 → 露出机身底色。

**改法**：区分"配置了天气"（`wxon`）和"天气真的在画"（`wxlive`）。只有 `wxFrame` 成功画出一帧后才加 `wxlive`，也只有 `wxlive` 时才让天气接管背景、清空 `chatBg`。天气没跑起来（初始化失败、图还没解码、被 stop）时，`chatBg` 的图完整保留。同时补上聊天页沉浸时天气画布的显示规则。

**顺带修的层叠问题**：`.msg` 带 `animation:pop` 和 `transform`，会自建层叠上下文并提升成合成层，光给 `.body` 设 `z-index:1` 拦不住，气泡能飘到顶栏之上。用 `isolation:isolate` 把整个滚动区封成独立层叠上下文。

### 2026-09-01（八）· 回滚顶栏改动，改用模糊蒙层

前面为了"去掉护栏"连改四版（透明化 → 悬浮布局 → isolation → 天气画布），越改越乱，用户要求回滚。按 `6de5ed45`（动顶栏之前）逐块还原了顶栏、输入栏、背景遮罩、toBottom 位置，用 style 段逐行 diff 确认干净。唯一保留的差异是 `wxon → wxlive`（天气没真跑起来时不清空背景图），那条与顶栏无关。

然后重新实现用户真正想要的效果：**模糊蒙层，不是压暗的渐变色块**。

```css
#chatFrost{
  backdrop-filter: blur(16px) saturate(140%);
  mask-image: linear-gradient(to bottom,#000 34%,transparent);
}
```

关键是 `backdrop-filter` + `mask` 组合：backdrop-filter 把背景糊掉，mask 让**模糊本身**从实到虚渐隐 —— 所以没有硬边，也不会像色块那样压暗画面。这正是输入栏那种毛玻璃质感。

层级：蒙层 `z-index:2` 盖在气泡之上（气泡滚进去会渐渐糊掉，像滑进雾里），顶栏和输入栏 `z-index:3` 浮在最上面（文字保持锐利）。

实测：中间区域完全清晰，上下渐隐无硬边，顶栏文字和输入框都不受影响。

**小手机这边的真 bug 有两个**：

1. **补拍镜头不带历史**——模型漏发 pov 时的兜底调用，prompt 只有 bio + 刚发的几条消息，连对话历史都没有，场景只能凭 bio 瞎编。这就是"不符合剧情"的主要来源
2. **镜头之间没有连续性锚**——每次生成都是独立掷骰子，上一个镜头躺床上、下一个可能就在街上

修法：把**上一个镜头喂回去当场景锚**。主提示词的镜头规则里动态注入「上一个镜头是『…』，新镜头必须和它连续（地点/时间/姿势），除非对话里明确移动了」；兜底调用补上最近 8 条对话 + 上一个镜头。POV 本身就是场景状态，回灌它 = 零成本的场景连续性，不用额外 API。

### 2026-09-02（四）· 拆分不稳的真凶 + 线上/线下场景模式

**① 拆分「有的能拆有的拆不了」——是硬 bug，不是玄学**

`splitSentences` 的括号深度计数里，直引号同时出现在开、闭两个字符集：

```js
if('（(【“"「'.includes(ch)) depth++;          // 直引号在这里
else if('）)】”"」'.includes(ch)) depth--;     // 也在这里，但 else-if 永远轮不到
```

`else if` 短路，直引号只会 depth++、永不 --。**文本里只要出现一个直引号，depth 就再也回不到 0，后面全部拆不开。** 而模型输出经 JSON.parse 后转义引号正好变成直引号——带引号台词的长文本必中，这就是「明明都是长文本却时灵时不灵」。

修法：直引号和单引号改成布尔翻转（同一字符既开又闭，不能计数），成对的中文括号才走计数，并补上书名号。七个边界用例回归通过。

**② 手动拆分加分级兜底** `splitHard()`：句末标点 → 换行 → 逗号/分号（每段至少 6 字，避免切碎）。以前纯逗号长句只能弹「拆不开」，现在能拆。自动兜底仍保守不变——见逗号就断会把正常语气切烂。

**③ 线上/线下场景模式**

用户随时在两种模式间切，但 POV 一律按「发消息」来拍，面对面时也写「打开手机打字」。加 `chat.sceneMode`（online/offline）：

- `+` 面板加「线上/线下」快捷切换，切换时往聊天插一条**场景分隔条**（`type:'scene'`，渲染成居中强调线，发给模型是 `[场景切换：你们现在面对面]`）——历史里留痕，模型自己也看得见
- 线下时 POV 提示词换口径：**绝对不要出现手机、屏幕、打字**，拍当面的身体动作、眼神、距离
- 主提示词同步告知，禁止说「发消息」「看手机」这类隔屏才有的话
- 补拍镜头的兜底 prompt 同样跟随模式

**③ 定时器错峰**：原来 60/60/60/90/150 秒，每 450 秒所有任务撞在同一秒。改成互质周期 67/71/83/97/151 秒，且启动时间各自延后 5/19/33/47/61/79 秒。

**注意**：识图接进主链路后真图会真的发出去，一张图上千 token，TPM 限额会明显更容易撞到。这是这次 429 变频繁的可能诱因之一。

### 2026-09-05（九）· NovelAI 真正的卡点：zip 解析，不是网络

用户按步骤部署好了 Cloudflare Worker（`naizhao.svy777777.workers.dev`），从她的 Chrome 里实测：反代通、Key 对、NovelAI 出图成功回 200 + 47 万字节 zip，可小手机还是报 `Failed to fetch`。

**根因**：`unzipFirstPng` 只读 zip 的本地文件头拿压缩长度。NovelAI 的 zip 是流式写的（通用标志 bit 3 = data descriptor），本地头里压缩长度是 0，真实长度只在文件尾的中央目录里。于是切出一个空块喂给 `DecompressionStream`，解压流报错——而 Chrome 把 `Response(stream)` 读失败一律抛成 `TypeError: Failed to fetch`，和网络连不上一个措辞。前面几轮全被这句话带偏到跨域上去了。

**改法**：先从文件尾找 EOCD（`50 4b 05 06`）读中央目录，按里面的 method / 压缩长度 / 本地头偏移取数据；没有中央目录再退回扫本地头；两边长度都是 0 就截到下一个签名。挑名字以 `.png` 结尾的条目。解压失败改成能看懂的报错（压缩块字节数 + 条目名），解出来先验 PNG 魔数。

单测（Python 造三种 zip，node 跑）：流式 deflate 老版 TypeError / 新版通过；普通 deflate 两版都过；流式 stored 老版拿到错字节 / 新版通过。

**排查手法记一下**：在用户 Chrome 里把小手机的 `fetch` 临时换成 XHR 重发同一请求，看 readyState / 状态码 / 响应头 / 进度事件——一眼分出「没到」「到了但跨域」「到了但解析炸」。控制台里的 `Failed to fetch` 本身没有信息量。

顺带：测试中途她的 token 被 NAI 回 401 了（几分钟前还能出图），多半是又点了一次「Get Persistent API Token」或账号那边动了，和本次改动无关。

- **相册** `characters.photos`：聊天里生成的照片、朋友圈配图都存进去（上限 120），TA 的手机 → 相册 现在列出全部：发给你的照片、朋友圈配图、lithium 配图、编辑角色里加的图，点开看大图；手机壁纸选择器也能挑到
- 兜底解析同步认 desc；模型直接给 tags 的仍然可用，含中文的 tags 会再转一次
- 用户反馈 15-25 个 tag 太少：**数量不限**，按「背景 / 光线 → 动作 / 表情 / 构图 → 穿着」的顺序把描述里每个细节都落成 tag，明确不写外貌（固定词里有）；上限从 400 字放到 2000。「让 TA 想一个画面」同步放开

## 修过的坑（本次新增）

- **让聊天模型顺手写生图 tag 是在给它加戏** → 聊天回合里模型正忙着扮演角色，让它同时输出一段英文 tag，格式和质量都容易崩。拆成两步：回合里只写它擅长的中文描述，tag 转换单独一次调用，还能把角色固定词喂进去去重。
- **生成物要有落点** → 图生成完只挂在消息上，用户翻不到。任何自动生成的图片都要有一个能回看的地方（相册），存的时候带来源和说明。
- **新增结构化输出，第一天就要配兜底** → 贴表情、pov 都是这么栽过来的：提示词写得再清楚，模型也会用单引号、等号、漏 type。每加一种对象类型，`sanitizeParts` 里就要同步加一条「长得像它的文字」的识别，不然坏格式直接变成用户看到的台词。
- **要改所有调用点时，先想能不能反查** → 头像框需要知道「这是谁的头像」，直接做要改几十处 `avatarHTML(c.avatar)`。头像图本身就是身份，按图反查零改动。副作用（emoji 头像不行）在提示里写明就行。
- **容器裁切和外溢装饰冲突** → 头像容器全是 `overflow:hidden` 圆角，框要溢出。用 `:has()` 只在有框的容器上放开裁切，头像图改成自己裁，不动没框的地方。
- **格式靠猜，先拿真文件对** → 前一版按印象写的 bundle 格式只对了内层，外层完全不是那回事。用户手里有真导出物的时候，第一步是要来看结构，而不是写完让她试。
- **导出文件里什么都有，不等于什么都要存** → 8 MB 的文件里 95% 是原图，存进 settings 会让每次保存都卡。按用途挑字段存。
- **手机上别把功能藏在长按里** → 长按在 iOS 上会和系统菜单打架，用户根本发现不了。可调的参数必须有可见入口，滑块优先于弹窗输数字。
- **「有没有人」是生图路由的唯一开关** → 主/第二后端、拼不拼角色词、用不用 vibe，全都挂在这一个标记上。凡是产出图片描述的地方（朋友圈、lithium、聊天照片、生成页）都必须把这个标记一起产出来，缺了就只能靠正则猜。
- **文件里已有的编码别再花钱算一遍** → NAI 的 vibe 文件自带各模型编码，之前一律重新 encode 等于每次多扣点数。外部导出物先看里面有什么，再决定要不要调接口。
- **后台生成要排队** → 一轮回复可能带照片、朋友圈自动配图也可能同时触发，并发打 NAI 会 429。聊天照片走一个串行队列，朋友圈和 lithium 各自也是一张张来。
- **顺序 await 一串网络请求** → 几十个小文件串行等于把延迟乘几十倍。凡是互不依赖的下载都要并行，给个并发上限就行。
- **给「东西」配图别带角色外貌词（第二次）** → 朋友圈修过一次，lithium 那条线漏了。同一类问题要顺着所有调用点过一遍，不能只修报出来的那个入口。
- **「不联网也能显示」不能靠 `<link>`** → 外链字体每次打开都要请求一次，被墙或断网就退回系统字体。要做到离线可用，必须在添加的那一刻把字体文件抓下来存本地，链接只当来源。
- **CSS 里的字体文件不是一个** → Google Fonts 中文按 unicode-range 切成几十个 woff2，只抓第一个 url 等于只有几百个字。要按 @font-face 块逐个抓，并把 unicode-range 一起交给 FontFace。
- **大 Blob 别塞进 settings 记录** → `S` 每次改设置都整条重写，字体几十 MB 放进去每次保存都卡。这类东西开独立的表，`S` 只存 id。
- **`Failed to fetch` 不一定是网络** → Chrome 对「请求没发出去」「响应没跨域头」「响应流 / 解压流读到一半炸了」抛的是同一句话。解析层用了 `new Response(stream)` 的地方，异常一定要自己接住换措辞，否则会把人引到网络上白查几轮。
- **zip 解析只看本地头** → 流式写出的 zip（archiver / Node 流、NAI）本地头长度全是 0，真值在中央目录。凡是自己手写容器格式解析，都要按规范的「权威位置」读，不能只挑最靠前的那份。
- **用户机器上能复现时，先复现再推理** → 前面靠截图猜了三轮（网络、梯子、Key），接上她的 Chrome 一次请求就定位了。能拿到真实请求 / 响应时，别用推理代替。
- **「必须反代」说了三次，用户还是没走通** → 每次都停在「给了脚本」，没有一次把「双击它、填这个地址、点测试」写进用户会看到的那个报错框里。方案要放在用户撞墙的那个位置，不是放在项目目录里。
- **面板里的 `ERR_BLOCKED_BY_CLIENT` 不是产品 bug** → 测试环境有自己的拦截策略，验不了的东西要如实说验不了，不能把沙箱行为当成浏览器行为下结论。
- **「配好就能用」和「用户真的配得上」是两回事** → NAI 路径代码早就通了，但前提是用户自己部署反代，这一步卡了几个月，等于功能不存在。做接入时要按用户手头实际有的东西（一个聊天中转的地址和 Key）设计最短路径，而不是按最标准的接口。
- **https 页面连不上局域网 http** → 局域网反代方案在 GitHub Pages 部署下天然不成立，浏览器混合内容拦截。选方案前先对一遍部署形态。
- **给「东西」配图别带角色外貌词** → 生图提示词一律拼角色固定词，饭照里就会多出个人。凡是画面可能没有角色的场合，要让模型明确说照片里有没有人，再决定拼不拼。
- **「刷新」被做成「重来」** → lithium 每次刷新让模型重出一整份快照再整体覆盖，用户攒了几周的帖子一按就没。凡是有积累意义的内容（帖子、动态、日记、评论），刷新的语义都必须是「生成新增的那部分叠上去」，整份重生成只允许发生在第一次。
- **相对时间不能存文字** → 「2小时前」存成字符串，攒起来之后每条都是「2小时前」。要存时间戳，显示时再算；模型给的相对时间在写入那一刻就折算掉。
- **用户说「照抄 EVE」时不要再自己发明** → 条数这件事连改两版都在自作主张（先钉下限、再推目标），用户要的只是 EVE 那一行。有可参照的原文时，第一步是原样抄过来，效果不对再动。
- **「区间等于下限」不是定律** → 上一条坑写得太绝对。EVE 的「最少两三条，最多 20 条」在用户那里跑得好好的，模型确实会按剧情在区间里浮动。说得少的原因要去别处找（示例、模型、上下文），不要先怪措辞。

- **给模型一个区间，等于给它区间下限** → 「2 到 20 条」被执行成「2 条起」。要模型多产出，说的必须是目标值（「20 条上下」），上限只在需要封顶时单独提。区间式表达只适合约束，不适合驱动。
- **清洗上限按输入条数设，忘了拆分会膨胀** → 20 条输入拆句后可能 30 条，`max+2` 的 cap 把尾巴静默截掉，用户看到的比模型写的少还不报错。任何「按条数截断」都要按处理后的条数留余量，且截断要有痕迹。

- **约束只写一遍，等于没写** → 条数要求在 prompt 前段说了一次就再没提，长历史一冲就失效。凡是「每一轮都必须成立」的约束，都要在最末尾（离生成最近处）再钉一遍——格式如此，条数、人称、性别同理。

- **「像不像」的问题先找范文再调 prompt** → 日记风格不对，第一反应是改要求措辞，但 EVE 导出里躺着 36 篇她真写的日记。有真实产出时，几篇范文顶得上任何形容词。
- **别禁掉角色本来就有的习惯** → 旧 prompt 写着「不要日期」，可她每篇日记第一行都是带情绪的日期天气，那是声音的一部分。禁令要对着真实样本核过再下。

- **最影响效果的配置放在了全局** → 风格示例决定「像不像 TA」，却只有一份全局的，多角色时互相污染。凡是描述「这个角色是谁」的东西，都该是角色级的，全局只做兜底。

- **同类生成器各自攒上下文** → 11 个入口都手写「bio + 最近 N 条对话」，谁也看不见别人的产出，写出来的东西自然互相矛盾。**同一世界观下的多个生成入口必须共用一份上下文构造器**，各自只用 skip 排掉自己。
- **程序化替换比逐条字面替换稳** → 十几处结构相同的 prompt 头部，按函数名定位再重写区间，比一条条字面匹配可靠得多——后者被空白和转义坑了两次。

- **多个定时器用整数倍周期** → 60/60/60/90/150 秒看着错开，实际每 450 秒全部对齐，瞬间打出五个请求。多个后台任务的周期要取互质值，启动时间也要错峰。
- **可恢复的错误直接抛给用户** → 429/503 本质是「等一下就好」，以前一撞就报失败让用户手动重来。这类状态码应该自动退避重试，重试用尽再报错。

- **让模型用文本片段指认目标** → 「填那条消息的前几个字」看似省事，实际匹配到的常常不是它想指的那条。要模型精确指认某条历史记录，就得给它稳定的 ID 并在历史里标出来，匹配失败宁可丢弃也别回退到「最近一条」。

- **新增的非消息型输出会撞上「空回复」判定** → 只贴表情不说话时 parts 为空，直接抛「没解析出内容」。凡是加不产生气泡的输出类型（react、recall、transfer_action），都要检查空判定那一行放不放行。

- **同一个设置页里两套覆盖规矩** → 轮数、摘要是角色级可覆盖，记忆条数和提取间隔却只有全局，用户自然会觉得「角色设置没用」。一组同类设置要么全支持角色级覆盖，要么在 UI 上明确标出哪些是全局唯一。
- **用户报的位置不一定是真实位置** → 她说「读取轮数没用」，实测轮数完全正常，真正只有全局生效的是隔壁的记忆条数。先验证她指的那个，再顺着同一页找同类问题。

- **同一个字符既是开又是闭，却用计数器处理** → 直引号在开/闭两个集合里都写了，else-if 短路导致只增不减，depth 永久卡死。成对符号用计数，同形符号（直引号、单引号、反引号、星号、下划线）必须用布尔翻转。
- **概率性 bug 会被当成模型不稳定** → 拆分时灵时不灵，第一反应是「模型输出格式随机」，实际是引号触发的确定性代码 bug。「有时候行有时候不行」要先找输入里的差异变量，别急着归因给模型。

- **静默吞掉的兜底失败会伪装成别的 bug** → 补拍镜头失败被 catch(e){} 吞了，用户看到的是「后几条没有镜头记录」，报出来像存储问题，实际是 API 调用没成。**兜底路径失败至少要 console.warn**，不然排查方向直接歪掉。

- **关键事实靠自然语言描述承载** → 性别藏在自由文本身份描述里，没写就没了，写了也会被百条历史冲淡。模型必须一直记住的事实要做成结构化字段，并注入到离生成最近的位置——顶部 system 是给背景用的，不是给「此刻不能错」的事用的。

- **功能函数写对了但主路径没接** → 多模态识图的 toApiMessages 只被次要路径（主动消息）引用，主聊天仍走文字降级，功能形同虚设。**写完新管线要 grep 所有 payload 组装点，确认每条路都换上了**——只测函数不测接线，架子就是这么来的。

- **兜底路径的上下文远少于主路径** → 补拍镜头的 prompt 只有 bio+当次消息，没有历史，生成的场景和剧情脱节。**任何"重试/补生成"路径都要检查它拿到的上下文是不是和主路径同一套**——兜底不是降级的借口。

- **注入统计只算 system 一条消息** → payload 里还有 jb（独立 user 消息）和独立下发的世界书，「本次注入」显示的比实际发出去的小。**统计口径必须覆盖整个 payload，不能只算拼进 sys 的部分。**

- **报错把原因吞了** → 「接口返回了空内容」这一句盖住了 `length` / `content_filter` / 中转 error body / 推理型模型放错字段四种完全不同的成因，连猜三轮都定不下来。**兜底的错误分支必须把上游原文带出来**，不然每次排查都从零开始。
- **替换锚点吃掉了前缀** → 用 `function retry(){` 当锚点插新函数，实际匹配到的是 `async function retry(){` 的后半截，`async` 被留给了新插进去的 `copyFail`，`retry` 里的 `await` 当场语法错。**锚点要连着它前面的修饰符一起匹配**，`assert count==1` 拦不住这种。
- **写文件顺手改了换行符** → Python `open(...,newline='')` 写回把整份 CRLF 变成 LF，浏览器无所谓，但和备份一 diff 就是 11205 行全变，等于看不了改动。**改别人的文件要按原样式写回。**

- **手动出口用自动规则当显示条件** → 「拆分」菜单项的显示条件是 `splitSentences(...).length>1`，而它存在的意义正是补自动拆漏掉的那些。**给自动逻辑做手动兜底时，入口的显示条件绝不能复用同一套判断** —— 否则最需要它的场景恰好没有入口。

- **WebGLProgram 当对象 key** → 三个 program 的 uniform 表全串成 `"[object WebGLProgram]"` 一个键。对象当 key 会被字符串化。
- **渲染结果只有第一块是对的，其余全黑** → `gl.viewport(0, canvasH-H)` 的 y 是 GL 坐标（从底往上数），对应**图像顶部**；而拷贝时从图像底部 `canvasH-H` 取——只有 H 恰好等于画布高度时两者重合。sanctuary 原码同款隐患，它没炸只是因为它的画布尺寸基本不变。从 (0,0) 拷即可。
- **drawImage 源矩形越界整块不画** → 面板滚出视口后源 y 为负，Chrome 直接一像素不画而不是裁剪。先和壁纸范围求交再画。

## 修过的坑

- **"蒙层"默认理解成了渐变色块** → 用户要的是**模糊**（毛玻璃），我做成了压暗的渐变。两者视觉差别很大：色块会让画面变脏变暗，模糊只是糊开、保留颜色和亮度。做"蒙层"前先确认是 blur 还是 gradient。
- **渐变蒙层用 z-index:0 会盖住内容** → 想只压背景就得用负值；但如果要盖住内容做"渐隐"效果，就该用正值 + mask。两种做法目标不同，别混。
- **连改四版没解决就该回滚** → 与其在越堆越复杂的改动上继续打补丁，不如退回已知的干净版本再重来一次。这次回滚后一次就做对了。
- **改规则时留下旧规则，新逻辑被架空** → 加了 `wxlive` 精确判断，却漏删同选择器的旧 `wxon` 规则，后者继续生效，等于白改。**改 CSS 开关条件时要 grep 一遍同名选择器，确认没有残留。**
- **空 canvas 是不透明的** → `<canvas>` 即使没画任何东西也会遮住底下的元素，不像空 div 那样透明。用 canvas 做可选图层时，不渲染就必须 `display:none`。
- **连续猜错四次后才想到枚举** → 与其一版版猜哪个元素在作怪，不如直接把所有同级图层的 display/z-index/位置 dump 出来比对，一次就定位了。**视觉层级问题应该先枚举再动手。**
- **"已配置"和"真的在运行"当成一回事** → `wxon` 只表示用户开了天气，不代表画布真在渲染。拿它去 `!important` 清掉备用背景，一旦渲染没起来就露底。**凡是"A 接管 B"的切换，判断条件必须是"A 真的работает"，不能是"A 被配置了"。**
- **改了三版都没问到真正的现象** → 用户说"护栏"，我依次理解成分割线、消息被切、气泡盖顶栏，全不是。真相是状态栏露底色。**同一个描述连续改错两次以上，就该停下来要一张标注图，而不是继续猜。**
- **把"透明"当成"不占位"** → 顶栏底栏改 `background:transparent` 后仍然占据 flex 空间，内容滚到那里被截断，看起来像凭空多了一条边界。要真悬浮必须 `position:absolute` + 给内容容器等高 padding。
- **反复照着自己的理解改，而不是先问清楚现象** → 用户说"护栏"，我按"分割线"改了两版都不对，她圈图后才发现是"消息被切掉"。**描述有歧义时，先让对方指出来，比连改两版省事。**
- **加长上下文会顺带削弱格式遵循** → 历史从 30 条涨到 130 条后，开头的格式规则被冲淡，模型开始堆一条。**扩上下文窗口时要同步把格式约束往末尾挪**，离生成越近越有效。
- **按换行拆不够** → 模型堆一条时通常没有换行，是「A。B。C。」。兜底得按句拆，但要避开引号内、括号描写、和正常的短句语气。
- **上下文窗口按"条"算，对连发型角色等于砍掉大半** → 角色一次连发 8-10 条时，"30 条历史"只有 2.6 轮。**凡是"最近 N 条"的窗口，都要先问清楚一条是多大的单位**；对话类的正确单位是轮，不是条。
- **声称"追平"却没验证对方的实现** → 说记忆机制"和 EVE 一样"时，其实只查过它怎么**提取**，没查怎么**挑选和注入**（用户用的词是"唤起"，比我准）。一查发现 EVE 多三层。**说"和 X 一样"之前，要把 X 的那一侧也读完。**
- **后台 tick 的互斥锁在手动连调时会假失败** → `sumBusy` 没重置就再调一次 tick，看起来像功能坏了。调试这类节流函数前先把锁清掉。
- **全局后台任务没给每个对象留开关** → 记忆自动提取对所有角色一视同仁地跑，但用户有当记事本用的角色，提取毫无意义还打扰、烧额度。**凡是"对所有 X 自动做某事"的功能，都要能按 X 单独关掉。**
- **连着两次在同一个问题上猜错并下结论** → 绿框先后归因到「双重压缩」和「我加的 meta」，都错。证据不足时应该说"还不确定"，而不是给一个听起来完整的解释。用户一句"这在你改之前就有了"就推翻了整套推理。
- **`interactive-widget=resizes-content` 在实现不全的浏览器上留缝** → 它把布局视口压到键盘之上，浏览器算多了就露出自己的底色，而那块在布局视口之外、页面 CSS 完全够不着。同理 `100dvh` 也是。**凡是「让页面缩到键盘之上」的方案，都有这个风险；让键盘盖在页面上（`height:100%` + visualViewport 顶内容）才是安全的。**
- **排查时忘了怀疑自己刚加的东西** → 绿框是我今早加 meta 引入的，却花了五六轮去查浏览器、查键盘、查 CSS。**「什么时候开始的」永远要先和「我什么时候改了什么」对一遍。** 用户说的"昨晚没有今早才有"就是最强线索，我当时没抓住。
- **导入外部数据时假设字段都是字符串** → EVE 的 `content` 有 91 条是多模态数组，直接塞进 innerHTML 渲染成 `[object Object]`。导别人的数据前先统计一遍每个字段的实际类型分布，别看头两条就下结论。
- **`100dvh` 在内嵌 iframe 里算成 0** → 直接给 `#phone` 加 `height:100dvh` 导致整个界面塌成 0 高。必须用 `@supports (height:100dvh)` 包住，并限定只在窄屏生效，桌面保留 `height:100%`。新的视口单位要给退路。
- **给用户的开关自己是坏的** → 「钉住」档的生效条件 `kb>80` 在目标浏览器上恒不成立，等于这一档从没跑过。用户三档全试后反馈"都没用"，实际只试了两档，白白多绕一轮。**做成开关的排查手段，每一档都要先验证真的会执行。**
- **切了模式不立即生效** → 依赖事件回调的逻辑，切换设置时必须主动触发一次，不能等下一个事件。
- **靠推理修跨浏览器排版问题** → 键盘空隙连猜两版都没中。手上没有目标设备时，与其继续猜，不如把行为做成用户可切换的开关 + 自动采样的诊断，让问题变成可测量的。
- **诊断入口取不到要诊断的状态** → 键盘诊断放在设置页，可点击时键盘一定已经收起。要诊断瞬时状态就得自动采样存历史，不能等用户手动触发。
- **拿 `window.innerHeight` 当布局视口基准** → 部分浏览器键盘弹出后 innerHeight 不变但布局视口已被自己压过，照差值再压一次就是压两遍，底部空出一条露出浏览器背景色。要用 `document.documentElement.clientHeight`，并且先判断浏览器有没有自己处理。**修 A 浏览器的兼容代码可能是 B 浏览器的 bug 源**——这种改动要留诊断入口。
- **flex 居中容器里改子元素高度** → `body{align-items:center}` 下把 `#phone` 改矮，空隙会平均分到上下两边，看起来像"底部多出一条"。缩高度的同时必须改对齐方式。
- **触摸手势不设 touch-action** → 浏览器默认吞掉横向手势，JS 的 move 回调根本不触发。自定义横滑必须写 `touch-action:pan-y`。
- **正则里的 `\r?\n` 匹配错了** → JS 正则 `/\r?\n/` 是「反斜杠 + 可选 r + 反斜杠 + n」四个字符，不是我要的两字符字面量 `
`。要写 `/(?:\r)?\n/`。
- **保存角色整个覆盖对象** → `saveChar` 没有 spread 旧值，聊天设置 / 手机 / lithium / 日记 / 关系全丢。写 dbPut 时凡是"部分更新"都必须先 spread 旧对象——这是第二次栽（第一次是 savePhoneSet 冲掉自定义图标）。
- **长按被 pointermove 秒杀** → 监听里 `pointermove` 无条件 clearTimeout，手指微抖就取消。触摸交互的移动判定必须给容差。
- **静态 HTML 里写了 `${...}`** → 又一次在非模板字符串的地方写模板语法（朋友圈入口按钮），页面上直接显示成源码。第二次踩，静态区只能写死 HTML。
- **dock 没贴底** → 日志里写了 `margin-top:auto`，代码里写的却是 `margin:26px 0 0`。写完日志要跟代码对一遍。另外 `auto` 只在内容比视口矮时有效，内容长了还是会被推下去——补了 `position:sticky;bottom:2px` 才算真贴住。
- **换角色后注入胶囊还是上一个角色的** → 全局 `lastInject` 切角色没人清，`.show` class 一直留在共用 DOM 上。清空 + 记 cid 双保险。
- **hex 输入框敲一个字符就失焦** → oninput 里整页重渲染把输入框换掉了。颜色类改动只做局部刷新。
- **hex 输入框宽度是 0** → `.field input{width:100%}` 优先级压过了 `.hexin{flex:1}`（flex-basis 还是被 width 影响）。用 `.field .hexin` 提高优先级并显式 `width:auto`。
- **从设置里进的页面返回会掉进空白聊天页** → `goBack()` 栈空时一律 `show('s-chat')`，而开发日志、X、表情包这些是 `navReset()` 之后才 `goTo` 的，栈立刻就空了。加了 `navHome`：`tab()` 和 `openChat()` 会记下是谁把你送进来的，栈空就回那儿。
- **保存手机设置会把自定义图标冲掉** → `c.phoneCfg={...}` 整个覆盖，没有 spread 旧值，`icons` 字段就没了。
- **模型输出多个数组** → 消息显示成 `["谁是宝宝。"]` 字面量。补了 parseReply 第 3 层 + 提示词加反例。
- **图片气泡凭空高 127px** → `white-space:pre-wrap` 把模板换行当成空行渲染。非文本气泡改 `normal`。
- **点发送后背景跳版** → 输入指示器占位改变 `.body` 高度导致 `cover` 重新居中。背景挪到定高元素，指示器改成气泡内三点 + 顶栏副标题。
- **状态栏和导航栏之间一条横线** → 遮罩分别挂两个元素，交界处硬边。改成整块遮罩。
- **进设置页顶部露出一条背景图** → 沉浸 class 挂在 `#phone` 上没随屏幕切换。改成按屏幕重算。
- **设置页标题不是白色** → 选择器写的 `.title b`，但设置页的 `.title` 里没有 `<b>`。
- **气泡文字被挤成两行** → 加了 `.msgwrap` 外层后 `max-width` 被乘了两次。
- **假图占位卡看不见** → 气泡底色和图标同为紫色。假图改用中性卡片底。
- **真图气泡布局错乱** → 模板里写了两个 `style` 属性，第二个被浏览器忽略。改用 CSS 类。
- **转账卡片高出一倍** → 又是 `pre-wrap`。新增气泡类型时**必须**加进 `white-space:normal` 那一行，这是第三次踩。
- **挂断按钮显示成 `${''}`** → 在静态 HTML 里写了模板字面量语法，那里不是模板字符串。
- **点赞行星标和名字竖排** → `.ic` 是 `display:block`，容器要 `display:flex`。
- **裁剪窗算出负尺寸** → `display:none` 时 `clientWidth` 是 0，减去 padding 就成了负数。要先显示、强制 reflow 再量；隐藏页面里 rAF 不触发，不能靠它。
- **起居注圆点压住时间** → 又是绝对定位偏移和 flex 列宽算重叠了，第二次。加了 gap 把圆点塞进空隙里。
- **辅助函数被整块替换误删** → `asNote`/`asBrow` 在重写手机模块时被连带删除，浏览器页直接抛错。整块替换前要确认区间里有没有别处还在用的东西。
- **时间轴圆点压住时间标签** → 绝对定位偏移算错，圆点范围和标签范围重叠。
- **进 App 后文字压在壁纸上看不清** → 沉浸范围开太大，只有主屏该铺壁纸。
- **NAI 报 500** → V4 系列缺 `v4_prompt` 结构化字段；以及诊断自己用了非法尺寸 64×64。
- **私信头像是方的** → `.av4` 的圆角只写在 `.lipost .av4` 下面，其他容器里没继承到。
- **诊断结论出来了但解释文字不显示** → `diagHint` 在 `renderDiag()` 之后才赋值，少了一次重渲染。
- **CSS 被误删 16k** → 用 `s.index()` 定位替换区间时匹配到了更早的同名选择器，把中间整段覆盖掉了。改块时先确认锚点唯一。
</script>

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('characters')) d.createObjectStore('characters',{keyPath:'id'});
      if(!d.objectStoreNames.contains('messages'))
        d.createObjectStore('messages',{keyPath:'id'}).createIndex('characterId','characterId');
      if(!d.objectStoreNames.contains('worldbooks')) d.createObjectStore('worldbooks',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'id'});
      if(!d.objectStoreNames.contains('memories'))
        d.createObjectStore('memories',{keyPath:'id'}).createIndex('characterId','characterId');
      if(!d.objectStoreNames.contains('personas')) d.createObjectStore('personas',{keyPath:'id'});
      if(!d.objectStoreNames.contains('stickers')) d.createObjectStore('stickers',{keyPath:'id'});
      if(!d.objectStoreNames.contains('diaries'))
        d.createObjectStore('diaries',{keyPath:'id'}).createIndex('characterId','characterId');
      if(!d.objectStoreNames.contains('moods'))
        d.createObjectStore('moods',{keyPath:'id'}).createIndex('characterId','characterId');
      if(!d.objectStoreNames.contains('moments')) d.createObjectStore('moments',{keyPath:'id'});
      if(!d.objectStoreNames.contains('fonts')) d.createObjectStore('fonts',{keyPath:'id'});   // v8：自定义字体（存 Blob）
      if(!d.objectStoreNames.contains('frames')) d.createObjectStore('frames',{keyPath:'id'}); // v9：头像框
      if(!d.objectStoreNames.contains('presets')) d.createObjectStore('presets',{keyPath:'id'});
      if(!d.objectStoreNames.contains('summaries'))
        d.createObjectStore('summaries',{keyPath:'id'}).createIndex('characterId','characterId');
    };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const dbAll=n=>req(store(n).getAll());
const dbGet=(n,k)=>req(store(n).get(k));
const dbPut=(n,v)=>req(store(n,'readwrite').put(v));
const dbDel=(n,k)=>req(store(n,'readwrite').delete(k));

/* ---------- 导航栈 ----------
   手机里的页面是有层级的：手机 → lithium → 帖子详情，
   返回应该回上一层而不是一路弹回聊天页 */
let navStack=[], navHome='s-chats';
function navReset(home){ navStack=[]; if(home) navHome=home; }
function goTo(id,render){
  const top=navStack[navStack.length-1];
  if(!top||top.id!==id) navStack.push({id,render});
  else if(render) top.render=render;
  if(render) render();
  show(id);
}
function goBack(){
  navStack.pop();
  const p=navStack[navStack.length-1];
  if(p){ if(p.render) p.render(); show(p.id); }
  else backHome();
}
/* 栈空了回哪儿：谁把我送进来就回谁。
   以前一律 show('s-chat')，从设置里进的页面（开发日志、X…）返回
   就掉进一个没选角色的空聊天页 —— 那个白页就是这么来的 */
function backHome(){
  if(navHome==='s-chat'){
    if(curCharId){ show('s-chat'); renderChat(); return; }
    return tab('s-chats');
  }
  const el=document.getElementById(navHome);
  if(el&&!el.classList.contains('overlay')) return tab(navHome);
  tab('s-chats');
}
function navLabel(){
  const p=navStack[navStack.length-2];
  const names={'s-phone':'手机','s-li':'lithium','s-app':'手机','s-chat':'消息',
    's-liPost':'lithium','s-liDm':'私信','s-liUser':'lithium'};
  return p?(names[p.id]||'返回'):'消息';
}

/* ---------- 基础 UI ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.getElementById('phone').classList.toggle('inchat',id==='s-chat');
  document.getElementById('tabbar').style.display=
    document.getElementById(id).classList.contains('overlay')?'none':'flex';
  refreshImm(id);
  refreshPhoneImm(id);
  refreshHomeImm(id);
}
/* 沉浸只在聊天页生效；设置页要另开开关，否则状态栏会透出背景图、白字压在浅色设置页上 */
function refreshImm(id){
  const c=curCharId?characters.find(x=>x.id===curCharId):null;
  let cfg=c?chatCfg(c):null;
  // 设置页里用草稿值，开关才能即时预览
  if(id==='s-chatSet'&&cfg&&draftCfg) cfg={...cfg,...draftCfg,chatBg:draftChatBg};
  const bg=cfg&&cfg.chatBg?cfg.chatBg:'';
  const hasImm=!!bg&&cfg.immersive!==false;
  const ok=hasImm&&(id==='s-chat'||(id==='s-chatSet'&&cfg.setImmersive));
  document.getElementById('chatBg').style.backgroundImage=ok?`url("${bg}")`:'';
  document.getElementById('phone').classList.toggle('imm',ok);
  document.getElementById('phone').classList.toggle('noscrim',!!(cfg&&cfg.noScrim));
  if(ok) applyTone(bg); else document.getElementById('phone').classList.remove('lightbg');
  document.getElementById('s-chat').style.backgroundImage=(bg&&!hasImm)?`url("${bg}")`:'';
  if(typeof wxSync==='function') wxSync();
}
function tab(id){
  navHome=id;
  show(id);
  document.querySelectorAll('#tabbar .t').forEach(d=>d.classList.toggle('on',d.dataset.s===id));
  ({'s-chats':renderChatList,'s-chars':renderCharsScreen,'s-wbs':renderWbList,'s-settings':renderSettings}[id]||(()=>{}))();
}
let toastTimer;
function toast(t){
