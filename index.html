/* 一个片段 -> {type,content}；支持模型直接输出对象（表情包 / 语音） */
function normPart(x){
  if(typeof x==='string'){ const t=x.trim(); return t?{type:'text',content:t}:null; }
  if(x&&typeof x==='object'){
    const ty=String(x.type||'').toLowerCase();
    const pick=v=>String(v==null?'':v).trim();
    if(ty==='sticker'||ty==='emoji')
      { const c=pick(x.description||x.content||x.name); return c?{type:'sticker',content:c}:null; }
    if(ty==='recall') return {type:'recall',content:''};
    if(ty==='transfer'){
      const amt=Math.round(parseFloat(x.amount)*100)/100;
      return amt>0?{type:'transfer',content:String(x.note||x.content||'转账').trim(),amount:amt}:null;
    }
    if(ty==='transfer_action')
      return {type:'transfer_action',content:String(x.action||'').toLowerCase()};
    if(ty==='voice_message'||ty==='voice')
      { const c=pick(x.content||x.text); return c?{type:'voice',content:c}:null; }
    if(ty==='pov')
      { const c=pick(x.content||x.text); return c?{type:'pov',content:c}:null; }
    if(ty==='react'||ty==='reaction'){
      const e=pick(x.emoji||x.content||x.text);
      // emoji 可能是多码位组合，放宽到 8 个字符；太长的当乱输出丢掉
      return e&&e.length<=8
        ?{type:'react',content:e,mid:pick(x.message_id||x.messageId||x.mid||x.to||'')}:null;
    }
    if(ty==='image'||ty==='photo'||ty==='picture'||((x.tags||x.desc)&&(x.caption||x.self!==undefined))){
      const cap=pick(x.caption||x.content||x.text), desc=pick(x.desc||x.description), tags=pick(x.tags||x.prompt);
      if(!cap&&!tags&&!desc) return null;
      return {type:'image',content:cap||'照片',desc,tags,self:x.self!==false};
    }
    if(ty==='xshare'||ty==='share_post'){
      const t=pick(x.text||x.post); if(!t) return null;
      return {type:'xsh',content:pick(x.comment||''),xtext:t};
    }
    const c=pick(x.content||x.message||x.text);
    return c?{type:'text',content:c}:null;
  }
  return null;
}
/* 模型不守格式时的兜底清洗：
   ① 把混在正文里的 pov 对象抠出来（模型经常把它当普通消息发）
   ② 一条里挤了好几句的，按换行拆开
   提示词已经反复强调过，但没有哪个模型 100% 守规矩，所以代码这层必须兜住 */
function unwrapLine(x){
  let t=String(x||'').trim();
  t=t.replace(/^\[\s*/,'').replace(/\s*\]$/,'').replace(/,\s*$/,'').trim();
  // 只有首尾成对时才剥引号，别把 他说："走吧" 的尾引号吃掉
  if(t.length>1&&/^["'`]/.test(t)&&t[t.length-1]===t[0]) t=t.slice(1,-1).trim();
  return t;
}
/* 从一段文字里把照片对象拼回来：先试 JSON，不行就按 key: 'v' / key="v" / key=v 逐个抠 */
function imgPartFromText(m){
  const grab=k=>{
    const r=new RegExp('["\']?'+k+'["\']?\\s*[:=]\\s*(?:"([^"]*)"|\'([^\']*)\'|([^,}\\n]*))','i').exec(m);
    if(!r) return '';
    const v=r[1]!=null?r[1]:(r[2]!=null?r[2]:(r[3]||''));
    return String(v).trim();
  };
  let cap='', desc='', tags='', self=true;
  try{
    const j=JSON.parse(m);
    cap=String(j.caption||j.content||'').trim(); desc=String(j.desc||j.description||'').trim();
    tags=String(j.tags||j.prompt||'').trim(); self=j.self!==false;
  }catch(e){
    cap=grab('caption')||grab('content'); desc=grab('desc')||grab('description'); tags=grab('tags')||grab('prompt');
    const sv=grab('self'); self=!/^(false|0|no)$/i.test(sv||'true');
  }
  if(!tags&&!cap&&!desc) return null;
  return {type:'image',content:cap||'照片',desc,tags,self};
}
function sanitizeParts(parts){
  const out=[];
  // 拆句后条数会膨胀，上限给足——旧值 max+2 会把超出的气泡静默丢掉
  const cap=Math.max(6,(+S.maxMessages||8)*2+4);
  for(const p of parts){
    if(!p) continue;
    if(p.type!=='text'){ out.push(p); continue; }
    let t=String(p.content||'');

    // ① 正文里混进了 {"type":"pov","content":"…"}
    t=t.replace(/\{[^{}]*?["']?type["']?\s*:\s*["']?pov["']?[\s\S]*?\}/gi,m=>{
      let c='';
      try{ c=String(JSON.parse(m).content||'').trim(); }catch(e){
        const mm=m.match(/["']?content["']?\s*:\s*["']([\s\S]*?)["']\s*[},]/i);
        if(mm) c=mm[1].trim();
      }
      if(c) out.push({type:'pov',content:c});
      return '';
    });
    // ①b 正文里混进了照片对象。模型常写成 {caption: '…', tags='…', self=true} 这种半 JSON，
    //    JSON.parse 不认就会被当成台词发出来——用户看到的是一坨英文 tag
    t=t.replace(/\{[^{}]*?\b(?:tags|caption|desc)\b[\s\S]*?\}/gi,m=>{
      const ip=imgPartFromText(m);
      if(ip){ out.push(ip); return ''; }
      return m;
    });
    // ①c 没有花括号但整段是 caption/tags/self 残骸，同样转成照片，别当话说
    if(/\b(?:tags|desc)\s*[:=]/i.test(t)&&/\b(?:self|caption)\s*[:=]/i.test(t)){
      const ip=imgPartFromText(t);
      if(ip){ out.push(ip); t=''; }
    }
    // ② 裸奔的 pov: xxx / 【镜头】xxx 这类残留
    t=t.replace(/^\s*(?:["']?pov["']?\s*[:：]|【?第三视角】?\s*[:：]?|【镜头】\s*)/i,m=>{
      return '';
    });

    // ③ 一条里挤了多条 —— 先按换行拆
    //    模型有时吐的是字面量 \n（两个字符）而不是真换行，一并当断行处理
    t=t.replace(/(?:\\r)?\\n/g,'\n');
    for(const line of t.split(/\n+/)){
      const v=unwrapLine(line);
      if(!v) continue;
      for(const seg of splitSentences(v)){
        if(out.filter(x=>x.type==='text').length>=cap) break;
        out.push({type:'text',content:seg});
      }
    }
  }
  return out;
}

/* 上下文一长，模型就容易忘掉"一句一条"，把整段堆进一个元素里。
   提示词已经反复强调过，这里再按句兜一层。
   只在明显过长时才拆 —— 短句里的句号是正常语气，不能见号就断。 */
function splitSentences(t){
  const s0=String(t||'').trim();
  if(!s0) return [];
  // 短的不动。但"两句以上 + 有实质长度"就该拆 ——
  // 「现在。我不想看见你。」这种两句短句是正常语气，
  // 「你说什么？我他妈忍你很久了。滚。别回来了。」四句就是堆一条了
  if(s0.length<=16) return [s0];
  // 括号描写（（他摔门而去。）) 整段是一条，不拆
  if(/^[（(【].*[）)】]$/.test(s0)) return [s0];
  // 在句末标点后切，但保留标点；引号/括号内部不切
  const out=[]; let buf='', depth=0, dq=false;
  for(let i=0;i<s0.length;i++){
    const ch=s0[i];
    buf+=ch;
    // 直引号 " 和 ' 是"同一个字符既开又闭"，不能计数，只能来回翻
    if(ch==='"'||ch==="'") dq=!dq;
    else if('（(【“「《'.includes(ch)) depth++;
    else if('）)】”」》'.includes(ch)) depth=Math.max(0,depth-1);
    else if(depth===0&&!dq&&'。！？!?…'.includes(ch)){
      // 省略号/连续标点吃干净
      while(i+1<s0.length&&'。！？!?…'.includes(s0[i+1])){ buf+=s0[++i]; }
      const v=buf.trim();
      if(v) out.push(v);
      buf='';
    }
  }
  const tail=buf.trim();
  if(tail) out.push(tail);
  if(out.length<2) return [s0];
  // 两句且整体不长 —— 是连贯语气，保持原样（"现在。我不想看见你。"）
  if(out.length===2&&s0.length<=24) return [s0];
  // 太碎的往前粘（比如单独一个"呵。"跟前句合并会更自然？不合并，保持原样）
  return out;
}
function parseReply(text){ return sanitizeParts(parseReplyRaw(text)); }
function parseReplyRaw(text){
  let t=String(text).trim()
    .replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const norm=a=>a.map(normPart).filter(Boolean);

  // 1. 整体就是一个 JSON 数组（正常情况）
  try{ const a=JSON.parse(t); if(Array.isArray(a)) return norm(a); }catch(e){}

  // 2. 前后夹着解释文字，中间是一个数组
  const big=t.match(/\[[\s\S]*\]/);
  if(big){ try{ const a=JSON.parse(big[0]); if(Array.isArray(a)) return norm(a); }catch(e){} }

  // 3. 模型输出了「多个数组」，每行一个 —— 全部拆开合并
  const chunks=t.match(/\[[^\[\]]*\]/g);
  if(chunks&&chunks.length){
    const out=[];
    for(const ch of chunks){
      try{ const a=JSON.parse(ch); if(Array.isArray(a)) out.push(...norm(a)); }
      catch(e){ /* 单引号之类的脏数组，交给第 4 步 */ }
    }
    if(out.length) return out;
  }

  // 4. 兜底：按行拆，并把每行外面可能包着的 [ ] 和引号剥掉
  return t.split(/\n+/).flatMap(line=>{
    let s=line.trim(); if(!s) return [];
    try{
      const v=JSON.parse(s);
      if(Array.isArray(v)) return norm(v);
      const p=normPart(v); if(p) return [p];
    }catch(e){}
    s=s.replace(/^\[\s*/,'').replace(/\s*\]$/,'').trim();
    s=s.replace(/^["'`]/,'').replace(/["'`]\s*,?$/,'').trim();
    return s?[{type:'text',content:s}]:[];
  }).filter(Boolean);
}
/* ---------- 请求闸门 ----------
   七个后台定时器全在 init 里挨着注册，60/90/150 秒的倍数会周期性对齐，
   一秒内打出四五个请求 —— 免费档 RPM 3-20 直接 429。
   这里不做完整串行（后台一个慢摘要会卡住用户发送），只保证任意两个请求
   的**起跑时间**至少隔开 API_MIN_GAP，把并发削成排队。 */
const API_MIN_GAP=900;
let _apiLast=0, _apiChain=Promise.resolve();
function apiSlot(){
  _apiChain=_apiChain.then(async()=>{
    const wait=API_MIN_GAP-(Date.now()-_apiLast);
    if(wait>0) await new Promise(r=>setTimeout(r,wait));
    _apiLast=Date.now();
  });
  return _apiChain;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function callAPI(messages,_try){
  if(!S.apiKey) throw new Error('还没填 API Key');
  if(!S.apiBase) throw new Error('还没填 API 地址');
  await apiSlot();
  const r=await fetch(S.apiBase.replace(/\/+$/,'')+'/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.apiKey},
    body:JSON.stringify({model:S.model,messages,temperature:S.temperature,stream:false})
  });
  // 429/503 是"等一下就好"，自动退避重试两次，别让用户手动重来
  const n=+_try||0;
  if((r.status===429||r.status===503||r.status===529)&&n<2){
    const ra=parseFloat(r.headers.get('retry-after'));
    const wait=Number.isFinite(ra)&&ra>0?Math.min(ra*1000,20000):(n===0?3000:8000);
    console.warn('限流 '+r.status+'，'+Math.round(wait/1000)+'s 后重试（第'+(n+1)+'次）');
    await sleep(wait);
    return callAPI(messages,n+1);
  }
  // 先取原文再解析 —— 出错时接口说的话全在这里，解析失败也不能把它丢了。
  // 以前只报一句「接口返回了空内容」，把 finish_reason、usage、error body 全吞了，没法排查。
  const raw=await r.text();
  let j=null; try{ j=JSON.parse(raw); }catch(e){}
  const dump=()=>`
────原始响应────
`+String(raw).slice(0,900);
  if(!r.ok){
    const d=j?.error?.message||'';
    const hint=r.status===429
      ?String.fromCharCode(10)+'已自动重试 2 次仍被限流。要么是接口的每分钟请求/token 配额用完了，要么是发的图太多——图片很吃 token。可以到 设置→记忆 关掉自动提取、或聊天设置里关掉这个角色的自动提取来减少后台请求。'
      :'';
    throw new Error(`${r.status} ${d}`.trim()+hint+dump());
  }
  // 有些中转会返回 HTTP 200 + error body，没有 choices
  if(j&&j.error&&!j.choices) throw new Error('接口返回了错误：'+(j.error.message||'')+dump());
  const ch=j?.choices?.[0];
  let txt=ch?.message?.content;
  // 推理型模型会把正文放进 reasoning_content，content 留空串
  if(!txt&&ch?.message?.reasoning_content) txt=ch.message.reasoning_content;
  // content 也可能是多模态数组
  if(Array.isArray(txt)) txt=txt.map(x=>typeof x==='string'?x:(x?.text||'')).join('').trim();
  if(!txt){
    const why={length:'输出被截断：prompt 太长，没给回复留出空间',
      content_filter:'被接口的内容审核挡了',
      tool_calls:'模型返回的是工具调用，不是文本'}[ch?.finish_reason];
    throw new Error('接口返回了空内容'
      +`（finish_reason: ${ch?.finish_reason||'无'}）`
      +(why?`
`+why:'')
      +(j?.usage?`
用量 prompt ${j.usage.prompt_tokens} + 输出 ${j.usage.completion_tokens}`:'')
      +dump());
  }
  return txt;
}
/* 带类型的消息发给模型时转成文字 */
function msgToText(m){
  if(m.recalled) return m.role==='user'?'[对方撤回了一条消息]':'[你撤回了一条消息]';
  const q=m.quote?`[引用 ${m.quote.name}："${m.quote.text}"] `:'';
  // 已贴的表情要让模型看见，否则它会一直重复贴同一条
  const rc=(m.reactions&&m.reactions.length)?`　[这条已被贴了表情：${m.reactions.join('')}]`:'';
  return q+msgBody(m)+rc;
}
function msgBody(m){
  if(m.type==='image'){
    if(m.meta&&m.meta.real) return m.content?`[图片]${m.content}`:'[图片]';
    return m.content?`[图片：${m.content}]`:'[对方发来一张图片，你看不到内容，可以问问是什么]';
  }
  if(m.type==='sticker')  return `[表情包：${m.content}]`;
  if(m.type==='call'){
    const ls=(m.meta.lines||[]).map(l=>(l.who==='me'?'对方':'你')+'：'+l.text).join('　');
    return `[你们通了一次电话，时长 ${m.meta.dur}]${ls?'　通话内容：'+ls:''}`;
  }
  if(m.type==='transfer'){
    const st=m.meta.status||'pending';
    const tail=st==='accepted'?'，对方已收下':(st==='rejected'?'，被退回了':'，还没处理');
    return `[转账 ¥${m.meta.amount}${m.content&&m.content!=='转账'?'　留言：'+m.content:''}]${tail}`;
  }
  if(m.type==='voice')    return `[语音消息] ${m.content}`;
  if(m.type==='scene')    return `[场景切换：${m.content}]`;
  if(m.type==='xsh'){
    const x=m.meta||{};
    return `[转发了一条 X 帖子——@${x.who||'?'}：「${x.text||''}」]${m.content?'　'+m.content:''}`;
  }
  if(m.type==='location') return `[位置分享] ${m.content}${m.meta&&m.meta.addr?'（'+m.meta.addr+'）':''}`;
  return m.content;
}

/* 连发的每条之间停多久 —— 模拟"打字要时间"。
   旧版固定 430+40/字、封顶1.6s，像连珠炮；现在按档位算，带 ±20% 抖动更像人 */
const PACES={
  fast:  {base:300, per:28,  cap:1300},
  normal:{base:650, per:70,  cap:3000},
  slow:  {base:1100,per:120, cap:4800},
  turtle:{base:1700,per:180, cap:7500}
};
function paceDelay(len){
  const pc=PACES[S.replyPace]||PACES.normal;
  const raw=pc.base+len*pc.per;
  const jit=.8+Math.random()*.4;          // 0.8x ~ 1.2x
  return Math.min(pc.cap,Math.round(raw*jit));
}

        const t=(await callAPI([{role:'user',content:q}])).trim();
        if(t) povPart={type:'pov',content:t};
      }catch(e){}
    }
    // 补拍的镜头挂到最后一条；然后顺填（画面没变沿用上一个）+ 倒填开头空档，
    // 保证整轮每条消息点头像都有记录，不再出现"后几条没有镜头"
    if(povPart&&!seq.some(x=>x.pov)&&seq.length)
      seq[seq.length-1].pov=String(povPart.content||'').slice(0,300);
    {
      let _cur=null;
      for(const it of seq){ if(it.pov) _cur=it.pov; else it.pov=_cur; }
      for(let i=seq.length-2;i>=0;i--) if(!seq[i].pov) seq[i].pov=seq[i+1].pov;
    }
    for(const it of seq){
      const p=it.p;
      if(p.type==='recall'){ await doAiRecall(); continue; }
      if(p.type==='transfer_action'){ await aiTfAct(p.content); continue; }
      const row={id:uid(),characterId:curCharId,role:'assistant',...toMsg(p),timestamp:Date.now()};
      if(it.pov) row.meta={...row.meta,pov:it.pov};
      await dbPut('messages',row);
      if(row.type==='image') genChatImage(row.id);
      await renderChat();
      await new Promise(r=>setTimeout(r,paceDelay(p.content.length)));
    }
    const c=characters.find(x=>x.id===curCharId);
    if(document.hidden) pushNotify(c,parts.map(p=>p.content).join(' '));
    c.lastRead=Date.now(); await dbPut('characters',c); characters=await dbAll('characters');
  }catch(e){
    // 原文可能很长，toast 只放第一行，完整内容在下面的失败横条里（可复制）
    lastFail='发送失败：'+e.message;
    toast('发送失败：'+String(e.message).split(`
`)[0].slice(0,60));
  }finally{
    setTyping(false);
    await renderChat();
  }
}
function copyFail(){
  if(!lastFail) return;
  navigator.clipboard?.writeText(lastFail).then(()=>toast('报错原文已复制'),()=>toast('复制失败，长按选中吧'));
}
async function retry(){ if(sending) return; lockSend(true); await requestReply(); lockSend(false); }
function lockSend(v){
  sending=v;
  document.getElementById('aiBtn').disabled=v;
  document.getElementById('pushBtn').disabled=v;
}

/* ① 只发到界面 —— 不调用 AI */
async function pushMessage(){
  if(sending) return;
  const ta=document.getElementById('chatInput'), text=ta.value.trim();
  if(!text||!curCharId) return;
  ta.value=''; ta.style.height='auto';
  await addMyMessage({content:text});
}
async function addMyMessage(o){
  await dbPut('messages',{id:uid(),characterId:curCharId,role:'user',
    content:o.content||'', type:o.type||'text', meta:o.meta||{},
    quote:quoting?{...quoting}:null, timestamp:Date.now()});
  clearQuote();
  await renderChat();
}

/* ② 真正发给 AI —— 输入框有内容就先上屏再请求 */
async function askAI(){
  if(sending) return;
  const ta=document.getElementById('chatInput'), text=ta.value.trim();
  if(text){ ta.value=''; ta.style.height='auto'; await addMyMessage({content:text}); }
  const ms=await msgsOf(curCharId);
  if(!ms.length) return toast('还没有任何消息');
  lockSend(true);
  await requestReply();
  lockSend(false);
}

/* ---------- + 功能面板（微信式，展开把输入栏顶上去） ---------- */
const PLUS_ITEMS=[
  {ic:'image',t:'图片',fn:()=>sendImage()},
  {ic:'smile',t:'表情包',fn:()=>pickSticker()},
  {ic:'mic',t:'语音',fn:()=>sendVoice()},
  {ic:'location',t:'位置',fn:()=>sendLocation()},
  {ic:'money',t:'转账',fn:()=>sendTransfer()},
  {ic:'call',t:'通话',fn:()=>startCall()},
  {ic:'moments',t:'朋友圈',fn:()=>openMoments()},
  {ic:'oracle',t:'旁白',fn:()=>openOracle()},
  {ic:'note',t:'日记',fn:()=>openDiary()},
  {ic:'thought',t:'心情',fn:()=>openMood()},
  {ic:'phone',t:'TA的手机',fn:()=>enterPhone()},
  {ic:'star',t:'收藏',fn:()=>openFavs()},
  {ic:'oracle',t:'线上/线下',fn:()=>toggleScene()}
];

/* 线上=隔着手机聊天，线下=面对面。切换会往聊天里插一条旁白，
   模型从历史就能看出「从这里开始你们在同一个空间」 */
async function toggleScene(){
  const c=characters.find(x=>x.id===curCharId); if(!c) return;
  const now=chatCfg(c).sceneMode==='offline'?'online':'offline';
  // 直接落库 —— setCfg 写的是设置页的 draftCfg，聊天页没有它
  c.chat={...chatCfg(c),sceneMode:now};
  await dbPut('characters',c);
  characters=await dbAll('characters');
  await addMyMessage({type:'scene',
    content:now==='offline'?'你们现在面对面':'你们分开了，回到手机上聊',meta:{mode:now}});
  toast(now==='offline'?'切到线下：面对面':'切到线上：隔着手机');
}
function renderPlusPanel(){
  document.getElementById('ppGrid').innerHTML=PLUS_ITEMS.map((it,i)=>
    `<div class="ppitem" onclick="plusPick(${i})"><i>${IC(it.ic,26)}</i><span>${esc(it.t)}</span></div>`).join('');
}
function togglePlus(){
  const p=document.getElementById('plusPanel');
  const open=!p.classList.contains('open');
  if(open) renderPlusPanel();
  p.classList.toggle('open',open);
  document.getElementById('plusBtn').classList.toggle('on',open);
  // 面板展开/收起动画是 320ms，80ms 时高度还没变完，那时候滚是白滚。
  // 整个过程持续钉底，内容才会跟着面板一起上移，而不是被顶到面板后面。
  document.getElementById('chatInput').blur();
  const box=document.getElementById('chatBody');
  const t0=performance.now();
  const stick=()=>{
    box.scrollTop=box.scrollHeight;
    if(performance.now()-t0<420) requestAnimationFrame(stick);
  };
  requestAnimationFrame(stick);
}
function closePlus(){
  const wasOpen=document.getElementById('plusPanel').classList.contains('open');
  document.getElementById('plusPanel').classList.remove('open');
  if(wasOpen){
    const box=document.getElementById('chatBody');
    const t0=performance.now();
    const stick=()=>{ box.scrollTop=box.scrollHeight;
      if(performance.now()-t0<420) requestAnimationFrame(stick); };
    requestAnimationFrame(stick);
  }
  document.getElementById('plusBtn').classList.remove('on');
}
function plusPick(i){ closePlus(); navReset(); setTimeout(()=>PLUS_ITEMS[i].fn(),180); }
function sendImage(){
  actionSheet('发送图片',[
    {ic:'image',t:'真图　模型能真的看到',fn:()=>sendRealImage()},
    {ic:'note',t:'假图　只写描述，显示占位卡',fn:()=>sendFakeImage()}
  ]);
}
function sendRealImage(){
  pickImage(async src=>{
    const cap=prompt('补一句说明（可留空）：','');
    if(cap===null) return;
    await addMyMessage({type:'image',content:cap.trim(),meta:{src,real:true}});
    toast('已发送，下次请求会把图一起发给模型');
  },900,.85);
}
async function sendFakeImage(){
  const d=prompt('这张图是什么？\n模型只能读到这句描述：','');
  if(d===null||!d.trim()) return;
  await addMyMessage({type:'image',content:d.trim(),meta:{real:false}});
}
async function sendVoice(){
  const v=prompt('语音内容（会显示成语音条，点开才看得到文字）：','');
  if(v===null||!v.trim()) return;
  const t=v.trim();
  await addMyMessage({type:'voice',content:t,meta:{dur:Math.max(1,Math.round(t.length/3.6))}});
}
async function sendTransfer(){
  const a=prompt('转多少？（元）','52');
  if(a===null) return;
  const amount=Math.round(parseFloat(a)*100)/100;
  if(!(amount>0)) return toast('金额不对');
  const note=prompt('留言（可留空）：','');
  if(note===null) return;
  await addMyMessage({type:'transfer',content:note.trim()||'转账',
    meta:{amount,status:'pending'}});
}
async function tfAct(id,st){
  const ms=await msgsOf(curCharId), m=ms.find(x=>x.id===id);
  if(!m) return;
  if(!confirm(st==='accepted'?`收下这 ¥${m.meta.amount}？`:'退回这笔转账？')) return;
  m.meta={...m.meta,status:st,actedAt:Date.now()};
  await dbPut('messages',m);
  await renderChat(false);
  toast(st==='accepted'?'已收下':'已退回');
}

async function sendLocation(){
  const name=prompt('地点名称：','');
  if(name===null||!name.trim()) return;
  const addr=prompt('详细地址（可留空）：','');
  if(addr===null) return;
  await addMyMessage({type:'location',content:name.trim(),meta:{addr:addr.trim()}});
}

/* ---------- 启动 ---------- */
async function loadAll(){
  characters=await dbAll('characters');
  personas=await dbAll('personas');
  stickers=await dbAll('stickers');
  fonts=await dbAll('fonts');
  frames=await dbAll('frames');
  diaries=await dbAll('diaries');
  moods=await dbAll('moods');
  worldbooks=(await dbAll('worldbooks')).map(normBook);
  memories=await dbAll('memories');
  presets=await dbAll('presets');
  summaries=await dbAll('summaries');
}
async function ensurePersona(){
  if(!personas.length){
    const p={id:uid(),name:S.userName||'我',avatar:'',persona:S.userPersona||'',createdAt:Date.now()};
    await dbPut('personas',p); personas=[p];
  }
  let changed=false;
  for(const c of characters) if(!c.personaId){ c.personaId=personas[0].id; await dbPut('characters',c); changed=true; }
  if(changed) characters=await dbAll('characters');
}

(async function init(){
  try{ db=await openDB(); }
  catch(e){
    document.getElementById('chatList').innerHTML=
      emptyState(ICO_CHAT,'无法访问本地存储','请通过 http:// 打开，<br>并且不要用无痕模式');
    return;
  }
  const saved=await dbGet('settings','global');
  S=saved?{...DEFAULT_SETTINGS,...saved}:{...DEFAULT_SETTINGS};
  applyTheme(S.accent); applyFrameScale();
  await loadAll();
  try{ await applyFont(); }catch(e){ console.warn('字体应用失败',e); }
  await ensurePersona();

  initKeyboardFix();
  initSwipeQuote();
  tickClock(); setInterval(tickClock,20000);
  /* 周期互质 + 启动错峰：原来 60/60/60/90/150 每 450 秒就全撞在同一秒 */
  setTimeout(()=>setInterval(proactiveTick,67000),5000);
  setTimeout(()=>setInterval(autoDiaryTick,71000),19000);
  setTimeout(()=>setInterval(journalTick,83000),33000);
  setTimeout(()=>setInterval(journalAutoTick,10*60000+11000),47000);
  setTimeout(()=>setInterval(memAutoTick,97000),61000);
  setTimeout(()=>setInterval(sumAutoTick,151000),79000);
  setTimeout(memAutoTick,20000);
  setInterval(xDmTick,7*60000);
  setTimeout(journalAutoTick,8000);
  const ta=document.getElementById('chatInput');
  const or=document.getElementById('orInput');
  or.addEventListener('input',()=>{ or.style.height='auto'; or.style.height=Math.min(or.scrollHeight,100)+'px'; });
  or.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); askOracle(); }
  });
  const ci=document.getElementById('callInput');
  ci.addEventListener('input',()=>{ ci.style.height='auto'; ci.style.height=Math.min(ci.scrollHeight,96)+'px'; });
  ci.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); callSay(); }
  });
  ta.addEventListener('focus',closePlus);
  ta.addEventListener('input',()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,108)+'px'; });
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); pushMessage(); }
  });
  tab('s-chats');
})();
</script>
